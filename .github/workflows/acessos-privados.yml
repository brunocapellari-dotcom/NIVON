name: NIVON - Verificacao privada manual de APIs

# Desligado em PR, push e agendamentos. Somente no default branch APOS merge
# com GitHub Environment 'nivon-fontes-privadas' configurado pelo proprietario.
on:
  workflow_dispatch:
    inputs:
      fonte:
        description: Fonte a validar (uma por execução)
        required: true
        type: choice
        options:
          - usda
          - ana
          - inmet
      modo:
        description: Iniciar sem rede (preflight) ou autenticar/baixar uma fonte
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - live

permissions:
  contents: read

concurrency:
  group: nivon-fontes-manuais
  cancel-in-progress: false

jobs:
  validar-usda:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.fonte == 'usda'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: nivon-fontes-privadas
    env:
      PYTHONPATH: src
      AGROBR_USDA_API_KEY: ${{ secrets.AGROBR_USDA_API_KEY }}
    steps:
      - name: Codigo homologado no branch principal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Consultar somente catalogo USDA/FAS
        env:
          NIVON_ACCESS_MODE: ${{ inputs.modo }}
        run: |
          if [ "$NIVON_ACCESS_MODE" = "preflight" ]; then
            python -m nivon.acessos_smoke_privado --fonte usda --preflight
          elif [ "$NIVON_ACCESS_MODE" = "live" ]; then
            python -m nivon.acessos_smoke_privado --fonte usda --live
          else
            exit 2
          fi

  validar-ana:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.fonte == 'ana'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: nivon-fontes-privadas
    env:
      PYTHONPATH: src
      NIVON_ANA_IDENTIFICADOR: ${{ secrets.NIVON_ANA_IDENTIFICADOR }}
      NIVON_ANA_SENHA: ${{ secrets.NIVON_ANA_SENHA }}
      # Dados reais sao opt-in: somente se estacao, data e zona forem configuradas.
      NIVON_ANA_ESTACAO: ${{ vars.NIVON_ANA_ESTACAO }}
      NIVON_ANA_DATA_BUSCA: ${{ vars.NIVON_ANA_DATA_BUSCA }}
      NIVON_ANA_ZONA_ESTACAO: ${{ vars.NIVON_ANA_ZONA_ESTACAO }}
    steps:
      - name: Codigo homologado no branch principal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Autenticar ANA e consultar dados apenas quando configurados
        env:
          NIVON_ACCESS_MODE: ${{ inputs.modo }}
        run: |
          if [ "$NIVON_ACCESS_MODE" = "preflight" ]; then
            python -m nivon.acessos_smoke_privado --fonte ana --preflight
          elif [ "$NIVON_ACCESS_MODE" = "live" ]; then
            python -m nivon.acessos_smoke_privado --fonte ana --live
          else
            exit 2
          fi

  validar-inmet:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.fonte == 'inmet'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: nivon-fontes-privadas
    env:
      PYTHONPATH: src
      NIVON_INMET_BDMEP_URL: ${{ secrets.NIVON_INMET_BDMEP_URL }}
    steps:
      - name: Codigo homologado no branch principal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Preparar pasta privada temporaria
        env:
          NIVON_INMET_DIRETORIO_PRIVADO: ${{ runner.temp }}/nivon-bdmep
        run: mkdir -m 700 "$NIVON_INMET_DIRETORIO_PRIVADO"
      - name: Inspecionar um ZIP BDMEP sem publicar arquivos
        env:
          NIVON_INMET_DIRETORIO_PRIVADO: ${{ runner.temp }}/nivon-bdmep
          NIVON_ACCESS_MODE: ${{ inputs.modo }}
        run: |
          if [ "$NIVON_ACCESS_MODE" = "preflight" ]; then
            python -m nivon.acessos_smoke_privado --fonte inmet --preflight
          elif [ "$NIVON_ACCESS_MODE" = "live" ]; then
            python -m nivon.acessos_smoke_privado --fonte inmet --live
          else
            exit 2
          fi
