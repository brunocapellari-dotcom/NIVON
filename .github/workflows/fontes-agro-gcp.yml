name: NIVON - CEPEA IMEA CONAB para Google Cloud
on:
  workflow_dispatch:
    inputs:
      fonte:
        type: choice
        required: true
        options: [CEPEA_SOJA, CEPEA_MILHO, IMEA, CONAB]
      homologar_cepea:
        description: 'Promover CEPEA verificado para BigQuery, apenas com licença e qualidade aprovadas'
        type: boolean
        required: false
        default: false
  schedule:
    # Dias úteis após publicações; sem executar enquanto gates estiverem fechados.
    - cron: '15 1 * * 2-6'

permissions:
  contents: read
  id-token: write

concurrency:
  group: nivon-agro-gcp-sources
  cancel-in-progress: false

jobs:
  coletar:
    if: ${{ github.ref == 'refs/heads/main' && vars.NIVON_AGRO_GCP_WRITE_APPROVED == 'true' && vars.NIVON_RAW_ARCHIVE_APPROVED == 'true' && vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: nivon-gcp-producao
    strategy:
      fail-fast: false
      matrix:
        fonte: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.fonte) || '["CEPEA_SOJA","CEPEA_MILHO","IMEA","CONAB"]') }}
    env:
      NIVON_AGRO_FONTE_AUTORIZADA: 'true'
      NIVON_CEPEA_HOMOLOGACAO_APROVADA: ${{ vars.NIVON_CEPEA_HOMOLOGACAO_APROVADA }}
      NIVON_CEPEA_FONTE_AUTORIZADA: ${{ vars.NIVON_CEPEA_FONTE_AUTORIZADA }}
      NIVON_IMEA_FONTE_AUTORIZADA: ${{ vars.NIVON_IMEA_FONTE_AUTORIZADA }}
      NIVON_CONAB_FONTE_AUTORIZADA: ${{ vars.NIVON_CONAB_FONTE_AUTORIZADA }}
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_RAW_ARCHIVE_APPROVED: ${{ vars.NIVON_RAW_ARCHIVE_APPROVED }}
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_FONTE: ${{ matrix.fonte }}
      NIVON_PROMOVER: ${{ inputs.homologar_cepea || false }}
    steps:
      - name: Exigir permissão explícita da fonte
        shell: bash
        run: |
          case "$NIVON_FONTE" in
            CEPEA_*) test "$NIVON_CEPEA_FONTE_AUTORIZADA" = "true" ;;
            IMEA) test "$NIVON_IMEA_FONTE_AUTORIZADA" = "true" ;;
            CONAB) test "$NIVON_CONAB_FONTE_AUTORIZADA" = "true" ;;
            *) exit 2 ;;
          esac
          if [[ "$NIVON_PROMOVER" == "true" ]]; then
            [[ "$NIVON_FONTE" == CEPEA_* && "$NIVON_CEPEA_HOMOLOGACAO_APROVADA" == "true" ]] || exit 2
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Autenticar GCP por WIF sem chaves permanentes
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar clientes e coletores
        run: python -m pip install -e '.[agro,gcp]'
      - name: Verificar metadados e região dos recursos
        run: |
          python - <<'PY'
          import os
          from google.cloud import bigquery,storage
          project=os.environ['NIVON_BQ_PROJECT']
          ds=bigquery.Client(project=project).get_dataset(project+'.'+os.environ['NIVON_BQ_DATASET'])
          bucket=storage.Client(project=project).get_bucket(os.environ['NIVON_GCS_BUCKET'])
          if str(ds.location).lower()!='southamerica-east1' or str(bucket.location).lower()!='southamerica-east1':
              raise RuntimeError('REGIAO_DIVERGENTE')
          print('GCP_DESTINO_VALIDADO_SEM_ESCRITA')
          PY
      - name: Executar coleta e arquivamento com isolamento de fonte
        shell: bash
        run: |
          set -euo pipefail
          args=(--fonte "$NIVON_FONTE" --base "data/nivon/agro/$NIVON_FONTE" --executar --gcs)
          if [[ "$NIVON_PROMOVER" == "true" ]]; then
            python -m nivon.preflight_gcp_fontes --projeto "$NIVON_BQ_PROJECT" --dataset "$NIVON_BQ_DATASET" --bucket "$NIVON_GCS_BUCKET"
            args+=(--homologar-cepea --bigquery)
          fi
          python scripts/coletar_agro_google_cloud.py "${args[@]}"
