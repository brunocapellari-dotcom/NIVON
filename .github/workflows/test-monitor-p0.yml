name: NIVON P0 - verificar monitor de fontes
on:
  push:
    paths:
      - 'nivon/monitor_p0_workflows.py'
      - 'tests/test_monitor_p0_workflows.py'
      - '.github/workflows/test-monitor-p0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_monitor_p0_workflows.py' -v
