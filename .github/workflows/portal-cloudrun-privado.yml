name: "NIVON - Cloud Run portal privado: deploy controlado"
on:
  pull_request:
    paths:
      - 'src/nivon/portal_gcs.py'
      - 'src/nivon/portal_interno.py'
      - 'tests/test_portal_gcs.py'
      - 'tests/test_portal_deploy_policy.py'
      - 'scripts/nivon_portal_cloudrun_deploy.sh'
      - 'infra/google_cloud/Dockerfile.portal'
      - 'infra/google_cloud/cloudbuild.portal.yaml'
      - '.github/workflows/portal-cloudrun-privado.yml'
  workflow_dispatch:
    inputs:
      executar_deploy:
        type: boolean
        required: true
        default: false
        description: 'Cloud Build + Cloud Run podem gerar custo; exige aprovacao de gasto'
permissions:
  contents: read
concurrency:
  group: nivon-portal-cloudrun-privado
  cancel-in-progress: false
jobs:
  contrato-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar portal sem GCP ou credenciais
        run: python -m pip install -e .
      - name: Executar smoke completo e contratos de seguranca
        run: |
          set -euo pipefail
          bash -n scripts/nivon_portal_cloudrun_deploy.sh
          python -m compileall -q src/nivon/portal_gcs.py src/nivon/portal_interno.py
          python -m unittest discover -s tests -p 'test_portal_gcs.py' -v
          python -m unittest discover -s tests -p 'test_portal_deploy_policy.py' -v
          python -m unittest discover -s tests -p 'test_portal_interno.py' -v
      - name: Provar que PR nao faz deploy
        run: |
          if NIVON_BQ_PROJECT=nivon-data NIVON_GCS_BUCKET=nivon-data-raw-2026 \
             GITHUB_REF=refs/pull/11/merge bash scripts/nivon_portal_cloudrun_deploy.sh; then
            echo 'DEPLOY_NAO_FALHOU_FECHADO'; exit 1
          fi
          echo 'DEPLOY_BLOQUEADO_EM_PR'
  deploy-autenticado:
    needs: contrato-offline
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.executar_deploy == true &&
      vars.NIVON_PORTAL_DEPLOY_APPROVED == 'true' &&
      vars.NIVON_GCP_COST_REVIEWED == 'true' &&
      vars.NIVON_PORTAL_GCS_READ_APPROVED == 'true' &&
      vars.NIVON_PORTAL_PRIVATE_BUCKET_REVIEWED == 'true' &&
      vars.NIVON_BQ_PROJECT == 'nivon-data' &&
      vars.NIVON_GCS_BUCKET == 'nivon-data-raw-2026' &&
      vars.NIVON_GCP_PROVIDER != '' &&
      vars.NIVON_GCP_SERVICE_ACCOUNT != '' &&
      vars.NIVON_PORTAL_ARTIFACT_REPO != '' &&
      vars.NIVON_PORTAL_SERVICE_ACCOUNT != ''
    environment: nivon-gcp-producao
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_PORTAL_SERVICE_ACCOUNT: ${{ vars.NIVON_PORTAL_SERVICE_ACCOUNT }}
      NIVON_PORTAL_ARTIFACT_REPO: ${{ vars.NIVON_PORTAL_ARTIFACT_REPO }}
      NIVON_GCP_COST_REVIEWED: ${{ vars.NIVON_GCP_COST_REVIEWED }}
      NIVON_PORTAL_DEPLOY_APPROVED: ${{ vars.NIVON_PORTAL_DEPLOY_APPROVED }}
      NIVON_PORTAL_GCS_READ_APPROVED: ${{ vars.NIVON_PORTAL_GCS_READ_APPROVED }}
      NIVON_PORTAL_PRIVATE_BUCKET_REVIEWED: ${{ vars.NIVON_PORTAL_PRIVATE_BUCKET_REVIEWED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
      - name: Deploy privado, sem mudar IAM e sem cron
        run: bash scripts/nivon_portal_cloudrun_deploy.sh
