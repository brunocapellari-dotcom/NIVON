name: NIVON ZARC - quarentena real licenciada E2E

on:
  push:
    branches:
      - feat/fontes-gratuitas-ckan-apis-20261021
    paths:
      - .github/workflows/ensaio-zarc-real.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zarc-quarentena-real:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout sem persistir credenciais
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Coleta real controlada MAPA CC-BY e staging temporario
        env:
          PYTHONPATH: src
        run: python scripts/ensaio_zarc_real.py
      - name: Descartar staging local no final do job
        if: always()
        run: echo 'RAW CSV e staging armazenados somente em TemporaryDirectory, excluidos apos a rotina'
