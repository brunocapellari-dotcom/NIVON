name: NIVON - Conferir ANTT Ferrovia 2025 sem Escrita
on:
  pull_request:
    paths:
      - '.github/workflows/antt-ferrovia-2025-readonly.yml'
      - 'tests/test_antt_2025_readonly_policy.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/antt-ferrovia-2025-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-antt-2025-readonly
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar contrato de leitura sem gravacao
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_antt_gcp_preparar_piloto.py' -v
          python -m unittest discover -s tests -p 'test_antt_2025_readonly_policy.py' -v

  preparar_2025:
    needs: validar
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Limitar escopo a recursos GCP confirmados
        run: |
          set -euo pipefail
          test "$NIVON_PROJETO" = 'nivon-data'
          test "$NIVON_DATASET" = 'nivon_raw'
          test "$NIVON_BUCKET" = 'nivon-data-raw-2026'
      - name: Gerar credencial OIDC temporaria sem chave
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar clientes API
        run: python -m pip install --disable-pip-version-check --quiet 'google-cloud-bigquery>=3,<4' 'google-cloud-storage>=3,<4'
      - name: Baixar apenas CSV oficial de 2025, sem gravar Cloud
        run: |
          python -m nivon.coleta_antt --inicio 2025 --fim 2025 \
            --destino "$RUNNER_TEMP/antt-2025" --live --usar-url-verificada-contingencia
      - name: Diagnosticar somente cabecalho publico quando o parser falhar
        if: failure()
        run: |
          python - <<'PY'
          import hashlib
          from nivon.coleta_antt import catalogo_antt, _http
          from nivon.transporte_multimodal import CAMPOS_ANTT
          try:
              url = catalogo_antt(habilitar_rede=True)[2025]["url"]
              raw = _http(url)
              header = raw.splitlines()[0][:500]
              for codec in ("utf-8-sig", "cp1252"):
                  try:
                      decoded = header.decode(codec)
                      break
                  except UnicodeDecodeError:
                      continue
              else:
                  decoded = "CODIFICACAO_DESCONHECIDA"
              print("DIAGNOSTICO_FONTE_ANTT_2025_SHA256",hashlib.sha256(raw).hexdigest())
              print("DIAGNOSTICO_FONTE_ANTT_2025_BYTES",len(raw))
              print("DIAGNOSTICO_FONTE_ANTT_2025_CABECALHO",repr(decoded))
              print("ESQUEMA_ESPERADO",repr(CAMPOS_ANTT))
          except Exception as e:
              print("DIAGNOSTICO_FALHOU",type(e).__name__,str(e)[:140])
          PY
      - name: Validar SHA, volume, tabela existente e ausencia de objeto
        run: |
          python -m nivon.antt_gcp_preparar_piloto \
            --staging "$RUNNER_TEMP/antt-2025" --ano 2025 \
            --projeto "$NIVON_PROJETO" --dataset "$NIVON_DATASET" \
            --bucket "$NIVON_BUCKET" \
            --saida "$RUNNER_TEMP/nivon-antt-2025-readonly.json"
      - name: Resumir prova de 2025 sem escrita
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads((Path(os.environ["RUNNER_TEMP"])/"nivon-antt-2025-readonly.json").read_text())
          chaves=("estado","ano","competencia_maxima_publicada","linhas_ferroviarias",
                 "toneladas_uteis_declaradas_no_arquivo","arquivo_sha256",
                 "bigquery_tabela_existe","gcs_objeto_ja_arquivado",
                 "gravacoes_realizadas","jobs_bigquery_criados")
          for k in chaves: print("ANTT_2025_READONLY",k,doc[k])
          if doc["gravacoes_realizadas"] or doc["jobs_bigquery_criados"]:
              raise RuntimeError("READONLY_CONTRACT_VIOLATED")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf8") as out:
              out.write("### ANTT/SIADE 2025 — prova oficial somente leitura\n\n")
              for k in chaves:
                  out.write("- "+k+": "+str(doc[k])+"\n")
              out.write("\nSem upload GCS, DDL, job SQL ou carga BigQuery.\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: antt-ferrovia-2025-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/nivon-antt-2025-readonly.json
          retention-days: 30
      - name: Descartar CSV e metadados temporarios
        if: always()
        run: rm -rf "$RUNNER_TEMP/antt-2025" "$RUNNER_TEMP/nivon-antt-2025-readonly.json"
