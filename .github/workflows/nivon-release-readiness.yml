name: NIVON - Go-live interno: prontidao sem deploy

on:
  pull_request:
    paths:
      - 'scripts/nivon_release_readiness.py'
      - 'tests/test_nivon_release_readiness.py'
      - '.github/workflows/nivon-release-readiness.yml'
      - '.github/workflows/nivon-go-live-interno.yml'
      - '.github/workflows/nivon-terminal-go-live.yml'
      - '.github/workflows/maritimo-gcp-primeiro-lote.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico-sem-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Conferir releases, flags de custo e barreiras de seguranca
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_nivon_release_readiness.py' -v
          python scripts/nivon_release_readiness.py --strict-policy --json "$RUNNER_TEMP/nivon-readiness.json"
      - name: Exibir lacunas sem revelar credenciais ou executar infraestrutura
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"nivon-readiness.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as o:
              o.write("## NIVON — go-live interno: preflight offline\n\n")
              o.write("**Este job nao faz deploy, coleta, consulta BigQuery ou publica relatorios.**\n\n")
              for name,lane in r["trilhas"].items():
                  o.write(f"- **{name}**: codigo={lane['codigo_preparado']}, "
                          f"configuracao_positiva={lane['preflight_configuracao_completo']}\n")
              o.write("\nO runtime GCP e os direitos devem ser verificados antes de ativar.\n")
          assert r["escritas_cloud"] == 0 and r["deploys"] == 0
          assert r["liberacao_publica"] is False
          PY
