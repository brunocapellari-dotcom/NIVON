# Primeiro ensaio de go-live interno: fonte oficial BCB apenas GET, sem valores publicados.
# Sem coleta agendada, credenciais, persistencia de cotacao ou envio WhatsApp.
name: NIVON - Piloto interno PTAX ao vivo

on:
  pull_request:
    paths:
      - 'src/nivon/piloto_ptax_readonly.py'
      - 'tests/test_piloto_ptax_readonly.py'
      - 'src/nivon/painel_local_mvp.py'
      - 'tests/test_painel_local_mvp.py'
      - '.github/workflows/piloto-go-live-ptax.yml'
      - 'src/nivon/ptax_plano.py'
      - 'src/nivon/bcb_ptax.py'
  workflow_dispatch:
    inputs:
      confirmar_consulta:
        description: 'Executar um GET oficial PTAX sem persistir ou divulgar preços'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nivon-piloto-ptax-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bcb-live-readonly:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == 'brunocapellari-dotcom/NIVON' &&
       github.event.pull_request.head.ref == 'release/mvp-interno-ptax-20261025') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.confirmar_consulta == true)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Codigo sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testar fluxo ponta a ponta sem rede
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_piloto_ptax_readonly.py' -v
      - name: Smoke de interface HTTP local e bloqueio de dados inexistentes
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_painel_local_mvp.py' -v
      - name: GET oficial BCB e normalizacao real, sem publicar precos
        env:
          PYTHONPATH: src
        run: |
          mkdir -p evidencias-internas
          python -m nivon.piloto_ptax_readonly --consultar-bcb \
            > evidencias-internas/ptax_metadados_sem_valores.json
      - name: Verificar frescor e bloqueio de divulgacao/envio
        run: |
          python -c 'import json; d=json.load(open("evidencias-internas/ptax_metadados_sem_valores.json")); assert d["status"]=="PREVIA_INTERNA_VALIDA" and d["aprovado_go_live"] is False and d["publicacao_autorizada"] is False and d["whatsapp_enviado"] is False and d["dados_coletados_nao_persistidos"] is True and d["consulta_ao_vivo_executada"] is True and "cotacao_venda" not in d'
          cd evidencias-internas
          sha256sum ptax_metadados_sem_valores.json > sha256sums.txt
          sha256sum -c sha256sums.txt
      - name: Artefato de metadados sem valor financeiro
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nivon-piloto-ptax-metadados
          path: evidencias-internas/
          retention-days: 3
          if-no-files-found: error
