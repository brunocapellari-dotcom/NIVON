name: "NIVON - ANTT RGI - testes e verificacao da fonte"
on:
  push:
    branches: [main]
    paths:
      - "src/nivon/antt_anuario*.py"
      - "scripts/ingest_antt_anuario_rgi.py"
      - "tests/test_antt_anuario*.py"
      - ".github/workflows/antt-anuario-rgi.yml"
  pull_request:
    paths:
      - "src/nivon/antt_anuario*.py"
      - "scripts/ingest_antt_anuario_rgi.py"
      - "tests/test_antt_anuario*.py"
      - ".github/workflows/antt-anuario-rgi.yml"
  workflow_dispatch: {}
  schedule:
    - cron: "55 11 2 * *"
permissions:
  contents: read
concurrency:
  group: antt-rgi-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  testes_offline:
    name: "Testes offline - sem HTTP"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: "Executar parser e contrato sem rede"
        env:
          PYTHONPATH: "src:."
        run: python -m unittest discover -s tests -p 'test_antt_anuario*.py' -v

  extracao_oficial:
    name: "Fonte oficial ANTT - verificação pontual"
    needs: [testes_offline]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: "Instalar leitor PDF por hash fixo"
        run: python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements/antt-rgi.txt
      - name: "Extrair somente PDF oficial em armazenamento efêmero"
        env:
          PYTHONPATH: src
        run: python scripts/ingest_antt_anuario_rgi.py --db "$RUNNER_TEMP/antt-relatorio-2025.sqlite"
      - name: "Limpar banco local"
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/antt-relatorio-2025.sqlite"*
