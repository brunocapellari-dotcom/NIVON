name: NIVON - Prova de dados hidroviarios secundarios ANTAQ
on:
  push:
    branches: [feature/transporte-antt-antaq-20261022]
    paths:
      - '.github/workflows/antaq-fonte-secundaria-prova.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecao_somente_leitura:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar leitor de parquet e cliente do dataset publico
        run: python -m pip install --quiet 'pyarrow>=18,<24' 'huggingface_hub>=0.30,<2'
      - name: Baixar e examinar agregado historico sem persistir dados nem secrets
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          import pyarrow.parquet as pq
          from huggingface_hub import HfApi, hf_hub_download
          repo='vinicius-souza/antaq'
          path='gold/carga_hidrovia_anual.parquet'
          info=HfApi().dataset_info(repo_id=repo)
          sha=info.sha
          fname=hf_hub_download(repo_id=repo,filename=path,repo_type='dataset',revision=sha)
          p=pathlib.Path(fname)
          if p.stat().st_size>20_000_000:raise ValueError('parquet fora do limite')
          data=p.read_bytes()
          t=pq.read_table(p)
          print('REPLICA_ANTAQ_NAO_OFICIAL','commit',sha,'sha256',hashlib.sha256(data).hexdigest(),'rows',t.num_rows,'bytes',len(data))
          print('SCHEMA',str(t.schema).replace('\n',' ; ')[:2500])
          if t.num_rows>300:raise ValueError('agregado com numero de linhas inesperado')
          for item in t.to_pylist():
              print('AGREGADO_3P',json.dumps(item,default=str,ensure_ascii=False))
          print('STATUS','FONTE_TERCEIRO_SEM_CONCILIACAO_OFICIAL')
          PY
