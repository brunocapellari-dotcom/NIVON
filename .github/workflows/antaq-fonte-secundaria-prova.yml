name: NIVON - Prova secundaria de hidrovias ANTAQ
on:
  push:
    branches: [feature/transporte-antt-antaq-20261022]
    paths:
      - '.github/workflows/antaq-fonte-secundaria-prova.yml'
      - 'src/nivon/antaq_replica_hidrovia.py'
      - 'tests/test_antaq_replica_hidrovia.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecao_somente_leitura:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar leitor do arquivo secundario
        run: python -m pip install --quiet 'pyarrow>=18,<24' 'huggingface_hub>=0.30,<2'
      - name: Testar contrato do agregado sem acesso externo
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_antaq_replica_hidrovia.py' -v
      - name: Verificar versao da fonte e confrontar Madeira sem publicacao no banco
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi, hf_hub_download
          from nivon.antaq_replica_hidrovia import (
              HF_DATASET, HF_PATH, HF_REVISION_VERIFICADA, HF_SHA256_VERIFICADO,
              ler_parquet, serializar_resumo,
          )
          rev=HfApi().dataset_info(repo_id=HF_DATASET).sha
          path=hf_hub_download(repo_id=HF_DATASET,filename=HF_PATH,repo_type='dataset',revision=rev)
          doc=ler_parquet(path,revisao=rev)
          if rev != HF_REVISION_VERIFICADA or doc["sha256"] != HF_SHA256_VERIFICADO:
              print("TERCEIRO_MUDOU_VERSAO_REAVALIAR_PROVENIENCIA")
          print("REPLICA_ANTAQ_RESULTADO",serializar_resumo(doc))
          print("ESTADO","FONTE_TERCEIRA_NAO_CONCILIADA_SEM_ESCRITA_EM_BANCO")
          PY
