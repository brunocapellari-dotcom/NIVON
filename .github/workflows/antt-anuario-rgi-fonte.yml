name: NIVON - ANTT RGI - verificacao mensal da fonte
on:
  push:
    branches: [fix/p0-antt-rgi-ci-separado-20261023]
    paths:
      - '.github/workflows/antt-anuario-rgi-fonte.yml'
  workflow_dispatch:
  schedule:
    - cron: '55 11 2 * *'

permissions:
  contents: read

jobs:
  verificar-fonte:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar parser RGI sem rede
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_antt_anuario_rgi.py' -v
      - name: Instalar leitor PDF com hash fixo
        if: github.event_name != 'push'
        run: python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements/antt-rgi.txt
      - name: Consultar e processar PDF oficial em banco temporario
        if: github.event_name != 'push'
        env:
          PYTHONPATH: src
        run: python scripts/ingest_antt_anuario_rgi.py --db "$RUNNER_TEMP/antt-relatorio-2025.sqlite"
      - name: Excluir banco temporario
        if: always()
        run: rm -f "$RUNNER_TEMP/antt-relatorio-2025.sqlite"*
