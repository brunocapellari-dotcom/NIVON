name: NIVON - ANTT RGI - consulta mensal
on:
  push:
    branches: [fix/p0-antt-rgi-ci-separado-20261023]
    paths:
      - '.github/workflows/antt-anuario-rgi-fonte.yml'
  workflow_dispatch:
  schedule:
    - cron: '55 11 2 * *'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar parser offline
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_antt_anuario_rgi.py' -v
      - name: Verificar fonte oficial somente no agendamento ou acionamento manual
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "CI_OFFLINE_ONLY"
            exit 0
          fi
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements/antt-rgi.txt
          trap 'rm -f "$RUNNER_TEMP/antt-relatorio-2025.sqlite"*' EXIT
          python scripts/ingest_antt_anuario_rgi.py --db "$RUNNER_TEMP/antt-relatorio-2025.sqlite"
