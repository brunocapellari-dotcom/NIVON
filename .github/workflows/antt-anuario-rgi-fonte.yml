name: NIVON - ANTT RGI - consulta mensal
on:
  push:
    branches: [fix/p0-antt-rgi-ci-separado-20261023]
    paths:
      - '.github/workflows/antt-anuario-rgi-fonte.yml'
  workflow_dispatch:
  schedule:
    - cron: '55 11 2 * *'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar parser offline
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_antt_anuario_rgi.py' -v
