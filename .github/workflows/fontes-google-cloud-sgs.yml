name: NIVON - Selic diaria BCB para Google Cloud
on:
  schedule:
    - cron: '55 13 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: nivon-gcp-bcb-sgs11
  cancel-in-progress: false
jobs:
  coletar:
    if: ${{ github.ref == 'refs/heads/main' && vars.NIVON_GCP_OPERACIONAL_APROVADO == 'true' && vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_FONTE_BCB_SGS_TAXA_SELIC_DIARIA_ATIVA == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' && vars.NIVON_GCP_RIGHTS_EVIDENCE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NIVON_GCP_OPERACIONAL_APROVADO: ${{ vars.NIVON_GCP_OPERACIONAL_APROVADO }}
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_FONTE_BCB_SGS_TAXA_SELIC_DIARIA_ATIVA: ${{ vars.NIVON_FONTE_BCB_SGS_TAXA_SELIC_DIARIA_ATIVA }}
      NIVON_GCP_RIGHTS_EVIDENCE: ${{ vars.NIVON_GCP_RIGHTS_EVIDENCE }}
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[gcp]'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - run: python scripts/coletar_sgs_google_cloud.py --executar
