name: NIVON ZARC - consultar revisão oficial CKAN

on:
  push:
    branches:
      - feat/fontes-gratuitas-ckan-apis-20261021
    paths:
      - .github/workflows/verificar-zarc-ckan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prova-metadados:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout sem persistir credenciais
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Uma consulta ao catálogo MAPA - licença e revision ID
        env:
          PYTHONPATH: src
        run: python scripts/diagnostico_zarc_ckan_live.py --executar
