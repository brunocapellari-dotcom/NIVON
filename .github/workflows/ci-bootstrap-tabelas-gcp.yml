name: NIVON - Testar bootstrap de tabelas GCP sem nuvem

on:
  pull_request:
    paths:
      - 'src/nivon/bootstrap_tabelas_gcp.py'
      - 'tests/test_bootstrap_tabelas_gcp.py'
      - '.github/workflows/ci-bootstrap-tabelas-gcp.yml'
  push:
    branches: ['feat/gcp-bootstrap-tabelas-consolidadas-20261023']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-fake-gcp:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Testes de IAM/gates e criacao idempotente sem nuvem
        run: python -m unittest discover -s tests -p 'test_bootstrap_tabelas_gcp.py' -v
      - name: Confirmar plano seguro sem ADC
        run: |
          python -m nivon.bootstrap_tabelas_gcp --projeto nivon-data \
            --dataset nivon_raw --bucket nivon-data-raw-2026
