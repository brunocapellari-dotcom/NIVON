name: NIVON CONAB - contrato historico
on:
  push:
    paths:
      - 'nivon/conab_historico.py'
      - 'tests/test_conab_historico.py'
      - '.github/workflows/conab-historico-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_conab_historico.py' -v
