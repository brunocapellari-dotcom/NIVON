name: NIVON - CONAB Go Live Google Cloud

on:
  workflow_dispatch:
    inputs:
      quantidade:
        description: 'Semanas oficiais recentes (1 a 4)'
        type: choice
        required: true
        default: '2'
        options: ['1','2','3','4']
      criar_tabela:
        description: 'Criar somente agro_fonte_stage no dataset existente se houver aprovacao'
        type: boolean
        required: false
        default: false
  schedule:
    # Fica bloqueado ate a homologacao e a aprovacao explicita do agendamento.
    - cron: '25 13 * * 1'

permissions:
  contents: read
  id-token: write

concurrency:
  group: nivon-conab-gcp-producao
  cancel-in-progress: false

jobs:
  capturar-persistir:
    if: >-
      ${{ github.ref == 'refs/heads/main'
          && vars.NIVON_CONAB_LIVE_APPROVED == 'true'
          && vars.NIVON_RAW_ARCHIVE_APPROVED == 'true'
          && vars.NIVON_ZERO_COST_BQ_APPROVED == 'true'
          && vars.NIVON_GCP_PROVIDER != ''
          && vars.NIVON_GCP_SERVICE_ACCOUNT != ''
          && vars.NIVON_BQ_PROJECT != ''
          && vars.NIVON_BQ_DATASET != ''
          && vars.NIVON_GCS_BUCKET != ''
          && (github.event_name != 'schedule' || vars.NIVON_CONAB_SCHEDULE_APPROVED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: nivon-gcp-producao
    env:
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_CONAB_WEEKS: ${{ inputs.quantidade || '2' }}
      NIVON_CONAB_CREATE_TABLE: ${{ inputs.criar_tabela || 'false' }}
      NIVON_CONAB_SCHEMA_CREATE_APPROVED: ${{ vars.NIVON_CONAB_SCHEMA_CREATE_APPROVED }}
    steps:
      - name: Exigir limites e aprovacao para criacao de tabela
        shell: bash
        run: |
          set -euo pipefail
          case "$NIVON_CONAB_WEEKS" in 1|2|3|4) ;; *) exit 2 ;; esac
          if [[ "$NIVON_CONAB_CREATE_TABLE" == 'true' ]]; then
            [[ "$NIVON_CONAB_SCHEMA_CREATE_APPROVED" == 'true' ]] || exit 2
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Credencial temporaria Google Workload Identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar bibliotecas do nucleo
        run: python -m pip install --disable-pip-version-check -e '.[gcp]'
      - name: Preparar diretorio temporario privado
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$RUNNER_TEMP/nivon-conab-${GITHUB_RUN_ID}"
          mkdir -m 700 "$root"
          mkdir -m 700 "$root/raw"
          echo "NIVON_WORK_DIR=$root" >> "$GITHUB_ENV"
      - name: Verificar/criar tabela somente sob autorizacao
        shell: bash
        run: |
          set -euo pipefail
          args=(--projeto "$NIVON_BQ_PROJECT" --dataset "$NIVON_BQ_DATASET")
          if [[ "$NIVON_CONAB_CREATE_TABLE" == "true" ]]; then
            args+=(--aplicar --schema-aprovado --custos-autorizados)
          fi
          python -m nivon.conab_gcp_schema "${args[@]}"
      - name: Coletar XLSX oficiais e importar quarentena
        shell: bash
        run: |
          set -euo pipefail
          python -m nivon.conab_incremental \
            --banco "$NIVON_WORK_DIR/conab.sqlite" \
            --pasta-raw "$NIVON_WORK_DIR/raw" \
            --quantidade "$NIVON_CONAB_WEEKS" \
            --executar --direitos-consulta --direitos-coleta --direitos-armazenamento
      - name: Arquivar RAW e evidencia por SHA no GCS com readback
        shell: bash
        run: |
          set -euo pipefail
          python -m nivon.conab_gcs_archive \
            --banco "$NIVON_WORK_DIR/conab.sqlite" \
            --pasta-raw "$NIVON_WORK_DIR/raw" \
            --bucket "$NIVON_GCS_BUCKET" \
            --executar --direitos-armazenamento --custos-autorizados
      - name: Preparar indicadores de quarentena
        shell: bash
        run: |
          python -m nivon.agro_bigquery_stage \
            --banco "$NIVON_WORK_DIR/conab.sqlite" \
            --saida "$NIVON_WORK_DIR/conab_stage.jsonl"
      - name: Inserir somente novos indicadores no BigQuery
        shell: bash
        run: |
          python -m nivon.agro_bigquery_loader \
            --arquivo "$NIVON_WORK_DIR/conab_stage.jsonl" \
            --projeto "$NIVON_BQ_PROJECT" \
            --dataset "$NIVON_BQ_DATASET" \
            --executar --custos-autorizados \
            --armazenamento-autorizado --licencas-conferidas
      - name: Remover dados temporarios (arquivos duraveis somente GCS)
        if: always()
        shell: bash
        run: |
          if [[ -n "${NIVON_WORK_DIR:-}" && "$NIVON_WORK_DIR" == "$RUNNER_TEMP"/nivon-conab-* ]]; then
            rm -rf -- "$NIVON_WORK_DIR"
          fi
