name: NIVON ZARC - pacote RAW real para Drive

on:
  push:
    branches:
      - feat/fontes-gratuitas-ckan-apis-20261021
    paths:
      - .github/workflows/zarc-pacote-real.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-arquivo-oficial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sem token persistente
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reservar área temporária
        run: |
          install -d -m 0700 "${RUNNER_TEMP}/nivon-zarc-artifact"
      - name: Executar coleta real licenciada e preparar arquivos compactados
        env:
          PYTHONPATH: src
          NIVON_ZARC_ARTIFACT_DIR: ${{ runner.temp }}/nivon-zarc-artifact
        run: python -m nivon.zarc_pacote_real
      - name: Publicar arquivo transferível autenticado com retenção curta
        uses: actions/upload-artifact@v4
        with:
          name: nivon-zarc-2026-2027-validado
          path: ${{ runner.temp }}/nivon-zarc-artifact/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
      - name: Eliminar área temporária
        if: always()
        run: rm -rf "${RUNNER_TEMP}/nivon-zarc-artifact"
