name: NIVON - IBGE PAM e World Bank WDI E2E
on:
  pull_request:
    paths:
      - 'src/nivon/coletores_agro_ibge_wdi.py'
      - 'src/nivon/coletores_dados_reais.py'
      - 'tests/test_coletores_agro_ibge_wdi.py'
      - 'tests/test_agenda_fontes_ibge_wdi.py'
      - 'scripts/operar_fontes_reais.py'
      - '.github/workflows/coleta-recorrente-fontes.yml'
      - 'scripts/ensaio_ibge_wdi_live.py'
      - 'scripts/diagnosticar_ibge_endpoints.py'
      - '.github/workflows/ibge-wdi-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_coletores_agro_ibge_wdi.py' -v
      - run: python -m unittest discover -s tests -p 'test_agenda_fontes_ibge_wdi.py' -v
      - name: Diagnosticar rotas IBGE com timeout curto
        run: python scripts/diagnosticar_ibge_endpoints.py
      - name: Smoke oficial HTTPS sem dados privados
        run: python scripts/ensaio_ibge_wdi_live.py
