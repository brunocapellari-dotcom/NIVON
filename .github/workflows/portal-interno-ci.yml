name: "NIVON - Portal interno: contrato e interface"
on:
  pull_request:
    paths:
      - 'src/nivon/portal_interno.py'
      - 'src/nivon/portal_static/**'
      - 'scripts/gerar_painel_interno.py'
      - 'tests/test_portal_interno.py'
      - 'tests/test_portal_interno_cloud_policy.py'
      - 'scripts/atualizar_snapshot_portal_gcp.py'
      - '.github/workflows/portal-interno-gcp.yml'
      - 'pyproject.toml'
      - '.github/workflows/portal-interno-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/nivon/portal_interno.py'
      - 'src/nivon/portal_static/**'
      - 'scripts/gerar_painel_interno.py'
      - 'tests/test_portal_interno.py'
      - 'tests/test_portal_interno_cloud_policy.py'
      - 'scripts/atualizar_snapshot_portal_gcp.py'
      - '.github/workflows/portal-interno-gcp.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrato-privado:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar app sem SDK ou dependencias extras
        run: python -m pip install -e .
      - name: Compilar rotas do portal e conversor
        run: python -m compileall -q src/nivon/portal_interno.py scripts/gerar_painel_interno.py tests/test_portal_interno.py
      - name: Testar readback -> snapshot -> interface WSGI
        run: |
          python -m unittest discover -s tests -p 'test_portal_interno.py' -v
          python -m unittest discover -s tests -p 'test_portal_interno_cloud_policy.py' -v
      - name: Garantir arquivos da interface no pacote
        run: |
          python - <<'PY'
          from importlib.resources import files
          for filename in ("index.html","portal.css","portal.js"):
              assert files("nivon").joinpath("portal_static",filename).is_file()
          print("INTERFACE_EM_PACOTE_OK")
          PY
