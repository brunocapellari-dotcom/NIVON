name: NIVON - Terminal privado Go Live
on:
  pull_request:
    paths:
      - 'src/nivon/terminal_web.py'
      - 'src/nivon/diagnostico_terminal_cloudrun.py'
      - 'tests/test_diagnostico_terminal_cloudrun.py'
      - 'tests/test_terminal_web.py'
      - 'tests/test_terminal_go_live_policy.py'
      - 'infra/google_cloud/Dockerfile.terminal'
      - 'infra/google_cloud/cloudbuild.terminal.yaml'
      - 'scripts/deploy_terminal_privado.sh'
      - '.github/workflows/nivon-terminal-go-live.yml'
  push:
    branches: [main]
    paths:
      - 'src/nivon/terminal_web.py'
      - 'tests/test_terminal_web.py'
      - 'tests/test_terminal_go_live_policy.py'
      - 'infra/google_cloud/Dockerfile.terminal'
      - 'scripts/deploy_terminal_privado.sh'
      - '.github/workflows/nivon-terminal-go-live.yml'
  workflow_dispatch:
    inputs:
      confirmar_deploy:
        description: 'Publicar serviço privado no Cloud Run com custos aprovados'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nivon-terminal-deploy-controlado
  cancel-in-progress: false

jobs:
  testes-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar serviço, segurança, dados, portas e limites
        env:
          PYTHONPATH: src
        run: |
          bash -n scripts/deploy_terminal_privado.sh
          python -m compileall -q src/nivon/terminal_web.py
          python -m unittest discover -s tests -p 'test_terminal_web.py' -v
          python -m unittest discover -s tests -p 'test_terminal_go_live_policy.py' -v
          python -m unittest discover -s tests -p 'test_diagnostico_terminal_cloudrun.py' -v
      - name: Ensaiar bloqueio de deploy fora de main sem acessar GCP
        run: |
          if GITHUB_REF=refs/pull/999/merge \
             NIVON_PROJETO=nivon-data NIVON_DATASET=nivon_raw \
             bash scripts/deploy_terminal_privado.sh; then
            echo 'FALHA: permissao de deploy em PR'
            exit 1
          fi
          if GITHUB_REF=refs/heads/main \
             NIVON_GO_LIVE_DEPLOY_APPROVED=false NIVON_GCP_COST_REVIEWED=false \
             bash scripts/deploy_terminal_privado.sh; then
            echo 'FALHA: deploy sem aprovacao'
            exit 1
          fi
          echo 'DEPLOY_PROTEGIDO_POR_TESTE=OK'

  publicar-privado:
    needs: testes-e2e
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmar_deploy == true &&
      vars.NIVON_GO_LIVE_DEPLOY_APPROVED == 'true' &&
      vars.NIVON_GCP_COST_REVIEWED == 'true' &&
      vars.NIVON_TERMINAL_ARTIFACT_REPO != '' &&
      vars.NIVON_TERMINAL_EXECUTION_SA != '' &&
      vars.NIVON_GCP_PROVIDER != '' &&
      vars.NIVON_GCP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GO_LIVE_DEPLOY_APPROVED: ${{ vars.NIVON_GO_LIVE_DEPLOY_APPROVED }}
      NIVON_GCP_COST_REVIEWED: ${{ vars.NIVON_GCP_COST_REVIEWED }}
      NIVON_TERMINAL_ARTIFACT_REPO: ${{ vars.NIVON_TERMINAL_ARTIFACT_REPO }}
      NIVON_TERMINAL_EXECUTION_SA: ${{ vars.NIVON_TERMINAL_EXECUTION_SA }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
      - name: Instalar SDK de leitura para preflight sem consultas
        run: python -m pip install --disable-pip-version-check -e '.[gcp]'
      - name: Build e deploy somente com recursos existentes e IAM privado
        run: bash scripts/deploy_terminal_privado.sh

  diagnostico-metadados:
    needs: testes-e2e
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.NIVON_GCP_PROVIDER != '' &&
      vars.NIVON_GCP_SERVICE_ACCOUNT != '' &&
      vars.NIVON_BQ_PROJECT != '' &&
      vars.NIVON_BQ_DATASET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      NIVON_TERMINAL_ARTIFACT_REPO: ${{ vars.NIVON_TERMINAL_ARTIFACT_REPO }}
      NIVON_TERMINAL_EXECUTION_SA: ${{ vars.NIVON_TERMINAL_EXECUTION_SA }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
      - run: python -m pip install --disable-pip-version-check -e '.[gcp]'
      - name: Conferir recursos sem consulta SQL, alterações ou deploy
        shell: bash
        run: |
          set -euo pipefail
          python -m nivon.diagnostico_terminal_cloudrun --descobrir-candidatos > "$RUNNER_TEMP/nivon-preflight-terminal.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"nivon-preflight-terminal.json").read_text())
          assert x["alteracoes_cloud"]==0 and x["sql_executado"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as output:
              output.write("### NIVON — diagnóstico Cloud Run sem escrita\n\n")
              output.write("| Recurso | Estado |\n|---|---|\n")
              for name,status in sorted(x["componentes"].items()):
                  output.write(f"| {name} | {status} |\n")
              output.write("\n**Metadados prontos:** "+str(x["metadados_basicos_confirmados"]))
              candidates=x.get("descoberta_candidatos")
              if candidates:
                  output.write("\n\n### Recursos já existentes — sem criar ou alterar nada\n")
                  output.write("\n| Descoberta | Estado | Candidatos |\n|---|---|---:|\n")
                  output.write("| Artifact Registry Docker | "+candidates["consulta_artifact_registry"]+
                               " | "+str(candidates["repositorios_encontrados"])+" |\n")
                  output.write("| Contas de serviço GCP | "+candidates["consulta_service_accounts"]+
                               " | "+str(candidates["contas_encontradas"])+" |\n")
                  output.write("\nPara configurar na página de variáveis GitHub, revisar os candidatos abaixo. ")
                  output.write("Os nomes não garantem permissões de execução, BigQuery ou build.\n")
                  for r in candidates["repositorios_docker_existentes"]:
                      output.write("\n- NIVON_TERMINAL_ARTIFACT_REPO = \`"+r+"\`")
                  for a in candidates["contas_existentes_necessitam_revisao_iam"]:
                      output.write("\n- NIVON_TERMINAL_EXECUTION_SA = \`"+a+"\`")
                  output.write("\n\nNenhum candidato foi selecionado ou ativado automaticamente.\n")
              output.write("\n\nSem build, IAM, SQL ou deploy. Custos/permissões de escrita não foram testados.\n")
          print("NIVON_CLOUD_RUN_PREFLIGHT="+x["proxima_acao"])
          PY
