name: Aceitacao real do console IVO PAM sem nova coleta

on:
  pull_request:
    paths:
      - '.github/workflows/ivo-pam-aceitacao-real.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  aceitar-ivo-pam:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout apenas leitura
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recuperar backup real IBGE ja coletado e auditado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nivon-ivo-pam"
          gh run download 39946796466 --repo "$GITHUB_REPOSITORY" \
            --name nivon-pam-estado --dir "$RUNNER_TEMP/nivon-ivo-pam"
          test -s "$RUNNER_TEMP/nivon-ivo-pam/estado_pam.zip"
      - name: Restaurar, auditar e consultar IVO SEM executar coleta
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,subprocess,sys
          from datetime import datetime,timezone
          from nivon.ivo_pam_backup import restaurar_backup_pam
          from nivon.ivo_pam_leitura import abrir_pam_somente_leitura
          from nivon.ivo_pam_alertas import alertas_revisoes_pam
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"nivon-ivo-pam"
          stats=restaurar_backup_pam(
              arquivo=base/"estado_pam.zip",destino=base/"restaurado")
          assert (stats["capturas"],stats["vintages"])==(24,6),stats
          command=[sys.executable,"-m","nivon.ivo_console",
              "--pergunta","Como evoluiu a soja em Tangará da Serra?",
              "--pam-db",str(base/"restaurado"/"pam.sqlite"),
              "--municipio","5107958","--produto","2713","--variavel","214",
              "--inicio","2021","--fim","2024",
              "--alertas-desde","2026-10-23T00:00:00+00:00"]
          run=subprocess.run(command,check=True,capture_output=True,text=True)
          doc=json.loads(run.stdout)
          dados=doc["serie_pam"]["serie_anual"]
          expected={2021:382800.,2022:400200.,2023:423540.,2024:364048.}
          assert {r["ano_civil"]:r["valor"] for r in dados}==expected,dados
          assert all(r["sha256"] and r["capturas"]==4 for r in dados),dados
          assert doc["alertas_pam"]["alteracoes_relevantes"]==0
          assert doc["alertas_pam"]["escopo"]["municipio_ibge"]=="5107958"
          assert not doc["coleta_nova_executada"]
          assert not doc["modelo_preditivo_executado"]
          # Uma data anterior à primeira coleta real não possui
          # "vintage histórica" falsa de 2021.
          old=subprocess.run(command+[
            "--corte","2026-10-23T02:30:00+00:00"],check=True,
            capture_output=True,text=True)
          before=json.loads(old.stdout)["serie_pam"]["serie_anual"]
          assert all(r["valor"] is None for r in before),before
          summary={
             "estado":"IVO_PAM_ACEITACAO_REAL_APROVADA",
             "capturas_reais":stats["capturas"],"vintages_distintas":stats["vintages"],
             "municipio_ibge":"5107958","variavel":"214","categoria_c81":"2713",
             "valores_atuais_pam":expected,
             "alertas_nesse_acervo":doc["alertas_pam"]["alteracoes_relevantes"],
             "corte_antes_da_primeira_captura_sem_dados":True,
             "nova_coleta_ibge_executada":False,
             "data_oficial_publicacao_comprovada":False,
             "treinamento_ou_previsao_homologados":False,
          }
          (base/"aceitacao_ivo_pam.json").write_text(
             json.dumps(summary,indent=2,ensure_ascii=False))
          print("ACEITACAO_REAL_IVO=APROVADA")
          print("CAPTURAS_RESTAURADAS=",stats["capturas"])
          print("VINTAGES_RESTAURADAS=",stats["vintages"])
          print("ALERTAS_MATERIAIS=",summary["alertas_nesse_acervo"])
          print("CORTE_RETROSPECTIVO=SEM_DADOS")
          PY
      - name: Evidencia compacta de aceitacao IVO
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nivon-ivo-pam-aceitacao-real
          path: ${{ runner.temp }}/nivon-ivo-pam/aceitacao_ivo_pam.json
          retention-days: 7
          if-no-files-found: warn
