name: NIVON - Preparar tabelas Google Cloud
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: 'Quais tabelas validar ou criar'
        required: true
        type: choice
        default: ambas
        options:
          - ambas
          - canonico
          - agro
      aplicar:
        description: 'Criar somente tabelas ausentes após conferir gates/IAM/custos'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: nivon-bootstrap-tabelas-gcp
  cancel-in-progress: false
jobs:
  verificar-e-preparar:
    if: ${{ github.ref == 'refs/heads/main' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' }}
    runs-on: ubuntu-latest
    environment: nivon-gcp-producao
    timeout-minutes: 15
    env:
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_BQ_BOOTSTRAP_TABLE_APPROVED: ${{ vars.NIVON_BQ_BOOTSTRAP_TABLE_APPROVED }}
      NIVON_AGRO_STAGING_SCHEMA_APPROVED: ${{ vars.NIVON_AGRO_STAGING_SCHEMA_APPROVED }}
      NIVON_AGRO_GCP_WRITE_APPROVED: ${{ vars.NIVON_AGRO_GCP_WRITE_APPROVED }}
      NIVON_BOOTSTRAP_ALVO: ${{ inputs.alvo }}
      NIVON_BOOTSTRAP_APLICAR: ${{ inputs.aplicar }}
    steps:
      - name: Checar autorizações ANTES da autenticação
        shell: bash
        run: |
          set -euo pipefail
          case "$NIVON_BOOTSTRAP_ALVO" in
            ambas|canonico|agro) ;;
            *) exit 2 ;;
          esac
          if [[ "$NIVON_BOOTSTRAP_APLICAR" == "true" ]]; then
            [[ "$NIVON_ZERO_COST_BQ_APPROVED" == "true" ]] || exit 2
            if [[ "$NIVON_BOOTSTRAP_ALVO" == "canonico" || "$NIVON_BOOTSTRAP_ALVO" == "ambas" ]]; then
              [[ "$NIVON_BQ_BOOTSTRAP_TABLE_APPROVED" == "true" ]] || exit 2
            fi
            if [[ "$NIVON_BOOTSTRAP_ALVO" == "agro" || "$NIVON_BOOTSTRAP_ALVO" == "ambas" ]]; then
              [[ "$NIVON_AGRO_STAGING_SCHEMA_APPROVED" == "true" ]] || exit 2
              [[ "$NIVON_AGRO_GCP_WRITE_APPROVED" == "true" ]] || exit 2
            fi
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Autenticar WIF no contexto main
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - run: python -m pip install -e '.[gcp]'
      - name: Auditar tabelas e aplicar somente se explicitamente autorizado
        shell: bash
        run: |
          set -euo pipefail
          args=(--projeto "$NIVON_BQ_PROJECT" --dataset "$NIVON_BQ_DATASET"
                --bucket "$NIVON_GCS_BUCKET" --alvo "$NIVON_BOOTSTRAP_ALVO")
          if [[ "$NIVON_BOOTSTRAP_APLICAR" == "true" ]]; then
            args+=(--aplicar)
          fi
          python -m nivon.bootstrap_tabelas_bq "${args[@]}"
