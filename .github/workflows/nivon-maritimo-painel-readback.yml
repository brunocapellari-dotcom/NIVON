name: NIVON - Readback Maritimo BigQuery no Painel
on:
  pull_request:
    paths:
      - '.github/workflows/nivon-maritimo-painel-readback.yml'
      - 'src/nivon/maritimo_painel_bigquery.py'
      - 'src/nivon/ponte_painel_fontes.py'
      - 'tests/test_maritimo_painel_bigquery.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nivon-maritimo-painel-readback.yml'
  workflow_dispatch:
    inputs:
      confirmar_leitura:
        description: 'Autorizo ate 2 consultas read-only limitadas a 50 MB cada'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: nivon-maritimo-painel-readback
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testar consulta e politica de dados
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests -p 'test_maritimo_painel_bigquery.py' -v

  readback-real:
    needs: testes
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.confirmar_leitura == true))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Restringir destino NIVON e numero de queries
        run: |
          set -euo pipefail
          test "$NIVON_PROJETO" = 'nivon-data'
          test "$NIVON_DATASET" = 'nivon_raw'
      - name: Identidade efemera OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar cliente BigQuery
        run: python -m pip install --disable-pip-version-check -e '.[gcp]'
      - name: Ler revisoes Imbituba e PortWatch Panama pelo mesmo painel
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          base={"projeto":os.environ["NIVON_PROJETO"],
                "dataset":os.environ["NIVON_DATASET"],
                "inicio":"2026-10-01","fim":"2026-10-31","limite":500}
          configs={"consultas_maritimas_bigquery":[
              {**base,"fonte":"imbituba"},{**base,"passagem":"panama"}]}
          Path(os.environ["RUNNER_TEMP"],"consulta-maritima.json").write_text(
              json.dumps(configs),encoding="utf-8")
          PY
          NOW="$(python -c 'from datetime import datetime,timezone;print(datetime.now(timezone.utc).isoformat())')"
          python scripts/rodar_painel_operacional.py \
            --entrada "$RUNNER_TEMP/consulta-maritima.json" \
            --as-of "$NOW" --executar-bigquery > "$RUNNER_TEMP/readback-maritimo.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"readback-maritimo.json").read_text())
          if not report.get("executou_bigquery") or report.get("status")!="ANALISE_SHADOW_NAO_HOMOLOGADA":
              raise RuntimeError("PAINEL_MARITIMO_NAO_EXECUTADO")
          items=report["fontes_maritimas_bigquery"]
          if (len(items)!=2 or not all(x["executado"] and not x["publicavel"] for x in items)
              or items[0]["fonte"]!="imbituba" or items[1]["passagem"]!="panama"):
              raise RuntimeError("FONTES_OU_PUBLICACAO_MARITIMA_DIVERGENTES")
          if (items[0].get("navios_operados_confirmados") is not None
              or items[0].get("toneladas_realizadas") is not None
              or items[1].get("volume_movimentado_real") is not None):
              raise RuntimeError("INFERENCIA_DE_CARGA_REAL_PROIBIDA")
          if items[0]["estado"]=="SEM_REVISOES_NAO_EQUIVALE_A_ZERO":
              raise RuntimeError("IMBITUBA_SEM_REVISOES_READBACK_INCONCLUSIVO")
          summary={"imbituba_estado":items[0]["estado"],
              "programacoes_ids":items[0]["ids_programacao_distintos"],
              "revisoes":items[0]["revisoes_visiveis"],
              "portwatch_estado":items[1]["estado"],
              "portwatch_revisoes":items[1]["revisoes_visiveis"],
              "duv_confirmadas":False,"carga_realizada_confirmada":False}
          print("NIVON_MARITIMO_READBACK_REAL",json.dumps(summary,ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### NIVON — readback marítimo BigQuery real (SHADOW)\n\n")
              f.write(f"Imbituba: {summary['revisoes']} revisões da programação em {summary['programacoes_ids']} IDs.\n\n")
              f.write(f"PortWatch Panamá: {summary['portwatch_revisoes']} revisões.\n\n")
              f.write("**Não certifica AIS por navio, DUV, tonelagem real ou fila.**\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: nivon-maritimo-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/readback-maritimo.json
          retention-days: 30
      - name: Eliminar temporarios
        if: always()
        run: rm -f "$RUNNER_TEMP/readback-maritimo.json" "$RUNNER_TEMP/consulta-maritima.json"
