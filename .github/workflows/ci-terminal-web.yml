name: NIVON - Terminal Web Go-Live
on:
  pull_request:
    paths:
      - 'public/**'
      - 'src/nivon/terminal_web.py'
      - 'src/nivon/mercado_bcb_ro.py'
      - 'infra/google_cloud/Dockerfile.terminal'
      - 'tests/test_terminal_gcp_unico.py'
      - 'tests/terminal_publico.test.js'
      - '.github/workflows/ci-terminal-web.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/nivon/terminal_web.py'
      - 'src/nivon/mercado_bcb_ro.py'
      - 'infra/google_cloud/Dockerfile.terminal'
      - 'tests/test_terminal_gcp_unico.py'
      - 'tests/terminal_publico.test.js'
      - '.github/workflows/ci-terminal-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verificar JavaScript e integridade do MVP
        run: |
          node --check public/assets/nivon.js
          node --test tests/terminal_publico.test.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testar rotas reais do unico backend Cloud Run
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_terminal_gcp_unico.py' -v
      - name: Comprovar build estático, sem fontes internas expostas
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/assets/nivon.css
          test -s public/assets/nivon.js
          ! test -e public/.env
          ! test -e public/credentials.json
          ! test -e public/pyproject.toml
          ! test -e public/src
          python3 - <<'PY'
          import json
          from pathlib import Path
          docker=Path('infra/google_cloud/Dockerfile.terminal').read_text()
          service=Path('src/nivon/terminal_web.py').read_text()
          assert 'COPY public ./public' in docker
          assert '/painel' in service and '/api/mercado' in service
          assert Path('public/assets/mercado.js').is_file()
          assert not Path('vercel.json').exists()
          print('NIVON_GCP_UNICO_FRONTEND_OK')
          PY
