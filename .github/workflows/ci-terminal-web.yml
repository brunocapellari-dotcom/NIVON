name: NIVON - Terminal Web Go-Live
on:
  pull_request:
    paths:
      - 'public/**'
      - 'infra/google_cloud/portal-security-headers.json'
      - 'tests/terminal_publico.test.js'
      - '.github/workflows/ci-terminal-web.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'infra/google_cloud/portal-security-headers.json'
      - 'tests/terminal_publico.test.js'
      - '.github/workflows/ci-terminal-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verificar JavaScript e integridade do MVP
        run: |
          node --check public/assets/nivon.js
          node --test tests/terminal_publico.test.js tests_web/mercado_portal.test.cjs
      - name: Comprovar build estático, sem fontes internas expostas
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/assets/nivon.css
          test -s public/assets/nivon.js
          ! test -e public/.env
          ! test -e public/credentials.json
          ! test -e public/pyproject.toml
          ! test -e public/src
          python3 - <<'PY'
          import json
          from pathlib import Path
          headers=json.loads(Path('infra/google_cloud/portal-security-headers.json').read_text())
          assert "default-src 'none'" in headers['Content-Security-Policy']
          assert Path('api/mercado.js').is_file()
          assert Path('public/assets/mercado.js').is_file()
          print('NIVON_GOOGLE_CLOUD_PORTAL_OK')
          PY
