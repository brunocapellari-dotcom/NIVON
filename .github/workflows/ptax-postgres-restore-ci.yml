name: NIVON - Teste restauracao PostgreSQL 17 sintetica

on:
  pull_request:
    paths:
      - '.github/workflows/ptax-postgres-restore-ci.yml'
      - 'scripts/ptax_pg_restore_synthetic_e2e.sh'
      - 'scripts/ptax_postgres_native_backup.py'
      - 'tests/fixtures/ptax_postgres17_synthetic.sql'

permissions:
  contents: read

jobs:
  restore-sintetico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Restaurar dump real em PostgreSQL descartavel sem rede
        run: bash scripts/ptax_pg_restore_synthetic_e2e.sh --run-synthetic
