name: NIVON - Verificar Conexao Google Cloud
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nivon-gcp-conexao-readonly.yml'
      - 'scripts/inventario_gcp_readonly.py'
      - 'scripts/auditar_permissoes_gcp.py'
      - 'tests/test_auditoria_permissoes_gcp.py'
      - 'tests/test_inventario_gcp_readonly.py'
      - 'scripts/bootstrap_nivon_gcp.sh'
      - 'database/bigquery/nivon_neon_legado_schema.sql'
  pull_request:
    paths:
      - '.github/workflows/nivon-gcp-conexao-readonly.yml'
      - 'scripts/inventario_gcp_readonly.py'
      - 'scripts/auditar_permissoes_gcp.py'
      - 'tests/test_auditoria_permissoes_gcp.py'
      - 'tests/test_inventario_gcp_readonly.py'
      - 'scripts/bootstrap_nivon_gcp.sh'
      - 'database/bigquery/nivon_neon_legado_schema.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-gcp-conexao-readonly
  cancel-in-progress: false

jobs:
  validar-inventario-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar inventario e scripts sem cloud
        run: |
          python -m unittest discover -s tests -p 'test_inventario_gcp_readonly.py' -v
          python -m unittest discover -s tests -p 'test_auditoria_permissoes_gcp.py' -v
          bash -n scripts/bootstrap_nivon_gcp.sh

  autenticar-e-verificar-metadados:
    needs: validar-inventario-offline
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
    steps:
      - name: Exigir somente variaveis de conexao
        env:
          WIF_PROVIDER: ${{ vars.NIVON_GCP_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
        run: |
          set -eu
          test -n "$NIVON_PROJETO" || { echo 'FALTA_NIVON_BQ_PROJECT'; exit 1; }
          test -n "$NIVON_DATASET" || { echo 'FALTA_NIVON_BQ_DATASET'; exit 1; }
          test -n "$NIVON_BUCKET" || { echo 'FALTA_NIVON_GCS_BUCKET'; exit 1; }
          test -n "$WIF_PROVIDER" || { echo 'FALTA_NIVON_GCP_PROVIDER'; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo 'FALTA_NIVON_GCP_SERVICE_ACCOUNT'; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Gerar credencial temporaria por OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar clientes de API
        run: |
          python -m pip install --disable-pip-version-check --quiet 'google-cloud-bigquery>=3,<4' 'google-cloud-storage>=3,<4'
      - name: Autenticar e consultar apenas metadados
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from google.cloud import bigquery, storage

          project = os.environ['NIVON_PROJETO']
          dataset_id = os.environ['NIVON_DATASET']
          bucket_name = os.environ['NIVON_BUCKET']
          esperado = 'southamerica-east1'

          # Somente metadados: nenhum job SQL, download, upload, criação
          # de tabela, criação de bucket, IAM ou objeto é permitido.
          ds = bigquery.Client(project=project).get_dataset(
              f'{project}.{dataset_id}', timeout=30)
          bucket = storage.Client(project=project).get_bucket(
              bucket_name, timeout=30)

          loc_ds = str(ds.location or '').lower()
          loc_bucket = str(bucket.location or '').lower()
          if (loc_ds, loc_bucket) != (esperado, esperado):
              raise RuntimeError('REGIAO_DIVERGENTE_ENTRE_BIGQUERY_E_STORAGE')
          if ds.project != project or ds.dataset_id != dataset_id or bucket.name != bucket_name:
              raise RuntimeError('RECURSO_DIVERGENTE_DAS_VARIAVEIS')

          report = {
              'estado':'AUTENTICACAO_WIF_E_LEITURA_METADADOS_OK',
              'projeto':project,
              'dataset':dataset_id,
              'bucket':bucket_name,
              'localizacao':esperado,
              'operacoes_de_escrita':0,
              'jobs_bigquery':0,
              'carga_antt_realizada':False,
          }
          print(json.dumps(report, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('### Conexão NIVON → Google Cloud verificada\n\n')
              f.write('Autenticação OIDC + leitura de metadados BigQuery e GCS concluídas.\n\n')
              f.write('Nenhum objeto, tabela, dataset ou consulta SQL foi criado.\n')
          PY
      - name: Conferir tabela e view da ANTT exclusivamente por metadados
        env:
          PYTHONPATH: src
        run: |
          python -m nivon.antt_gcp_preflight \
            --projeto "$NIVON_PROJETO" --dataset "$NIVON_DATASET"
      - name: Testar permissões IAM de GCS (indicativo, sem escrita)
        shell: bash
        run: |
          python scripts/auditar_permissoes_gcp.py \
            --projeto "$NIVON_PROJETO" \
            --dataset "$NIVON_DATASET" \
            --bucket "$NIVON_BUCKET"
      - name: Inventario read-only de destinos e esquemas sem SQL
        shell: bash
        run: |
          set -euo pipefail
          python scripts/inventario_gcp_readonly.py \
            --projeto "$NIVON_PROJETO" \
            --dataset-raw "$NIVON_DATASET" \
            --bucket "$NIVON_BUCKET"
