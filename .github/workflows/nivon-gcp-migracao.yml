name: NIVON - migracao historica Neon para BigQuery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nivon-gcp-migracao.yml'
      - 'scripts/nivon_gcp_migracao.py'
      - 'scripts/bootstrap_nivon_gcp.sh'
      - 'tests/test_nivon_gcp_migracao*.py'
  pull_request:
    paths:
      - '.github/workflows/nivon-gcp-migracao.yml'
      - 'scripts/nivon_gcp_migracao.py'
      - 'scripts/bootstrap_nivon_gcp.sh'
      - 'tests/test_nivon_gcp_migracao*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-migracao-legado-gcp
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar contratos e permissao sem acessar fonte privada
        run: python -m unittest discover -s tests -p 'test_nivon_gcp_migracao*.py' -v
      - name: Conferir sintaxe e DDL versionado sem criar recursos
        run: |
          bash -n scripts/bootstrap_nivon_gcp.sh
          test -f database/bigquery/nivon_neon_legado_schema.sql
          test -f database/bigquery/nivon_ptax_schema.sql
          test -f database/bigquery/nivon_zarc_schema.sql

  migrar:
    name: Extracao privada manual e carga GCP sob autorizacao separada
    needs: validar
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
      id-token: write
    env:
      NIVON_NEON_LEGACY_ENDPOINT: https://br-twilight-cell-b77ukd6x-nivonlegacy.compute.c-13.us-east-1.aws.neon.tech
      NIVON_GCP_WRITE_APPROVED: ${{ vars.NIVON_GCP_WRITE_APPROVED }}
      NIVON_GCP_COST_REVIEWED: ${{ vars.NIVON_GCP_COST_REVIEWED }}
      NIVON_GCP_ENABLED: ${{ vars.NIVON_GCP_WRITE_APPROVED == 'true' && vars.NIVON_GCP_COST_REVIEWED == 'true' && vars.NIVON_GCP_MIGRATION_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Autenticacao federada somente se escrita estiver autorizada
        if: ${{ env.NIVON_GCP_ENABLED == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
      - name: Instalar BigQuery client somente se autorizado
        if: ${{ env.NIVON_GCP_ENABLED == 'true' }}
        run: python -m pip install --disable-pip-version-check google-cloud-bigquery==3.38.0
      - name: Extrair, validar e opcionalmente conciliar BigQuery (sem artifacts privados)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/nivon-gcp-private"
          trap 'rm -rf "$RUNNER_TEMP/nivon-gcp-private"' EXIT
          for source in imea cepea conab_safras conab_balancos conab_series; do
            file="$RUNNER_TEMP/nivon-gcp-private/$source.jsonl"
            python -m scripts.nivon_gcp_migracao --dataset "$source" \
              --endpoint "$NIVON_NEON_LEGACY_ENDPOINT" --arquivo "$file"
            if [ -f "$file" ]; then
              python -m scripts.nivon_gcp_migracao --validar --arquivo "$file"
              if [ "$NIVON_GCP_ENABLED" = "true" ]; then
                python -m scripts.nivon_gcp_migracao --carregar --arquivo "$file"
              else
                echo 'BIGQUERY_BLOQUEADO_SEM_WIF_APROVACAO_DE_MIGRACAO_E_CUSTOS=true'
              fi
            fi
          done
          echo 'NIVON_LEGACY_EXPORT_FINISHED; private files removed on exit'
