name: CONAB selecao de publicacoes
on:
  push:
    paths:
      - 'nivon/conab_publicacoes.py'
      - 'tests/test_conab_publicacoes.py'
      - '.github/workflows/conab-selector.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_conab_publicacoes.py' -v
