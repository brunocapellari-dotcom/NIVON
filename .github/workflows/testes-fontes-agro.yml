name: NIVON - testes de origem CEPEA e IMEA
on:
  push:
    paths:
      - 'nivon/fontes_agrobr.py'
      - 'tests/test_fontes_agrobr.py'
      - '.github/workflows/testes-fontes-agro.yml'
  pull_request:
    paths:
      - 'nivon/fontes_agrobr.py'
      - 'tests/test_fontes_agrobr.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-fontes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_fontes_agrobr.py' -v
