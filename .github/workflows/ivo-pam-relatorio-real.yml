name: Aceite real IVO PAM sem rede de fontes

on:
  pull_request:
    paths:
      - 'src/nivon/ivo_pam_relatorio.py'
      - 'src/nivon/ivo_pam_aceite.py'
      - '.github/workflows/ivo-pam-relatorio-real.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ivo-relatorio-aceite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aceite-pam-real:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout codigo PR sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recuperar backup real auditado do piloto MT sem tocar SIDRA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ivo-real/backup"
          gh run download 39946796466 \
            --repo "$GITHUB_REPOSITORY" \
            --name nivon-pam-estado \
            --dir "$RUNNER_TEMP/ivo-real/backup"
          mapfile -t backups < <(find "$RUNNER_TEMP/ivo-real/backup" -type f -name estado_pam.zip)
          if test "${#backups[@]}" -ne 1; then
            echo "::error::Arquivo real de 24 capturas indisponivel/duplicado."
            exit 2
          fi
          echo "PAM_BACKUP=${backups[0]}" >> "$GITHUB_ENV"
      - name: Restaurar todas as capturas e gerar relatorio HTML/Markdown
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m nivon.ivo_pam_aceite \
            --backup "$PAM_BACKUP" \
            --tarefas config/ivo_pam_piloto_mt.v1.json \
            --saida "$RUNNER_TEMP/ivo-real/relatorio"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"ivo-real"/"relatorio"
          report=json.loads((root/"aceite_pam.json").read_text())
          if (report["capturas_verificadas"]!=24
              or report["vintages_verificadas"]!=6
              or report["celulas"]!=6
              or report["revisoes_relevantes"]!=0
              or not report["integridade_local_aprovada"]
              or report["site_publicado"]):
              raise SystemExit("Go-live piloto bloqueado: acervo diferente do estado real esperado.")
          for name in ("relatorio_pam.html","relatorio_pam.md"):
              if (root/name).stat().st_size<600:
                  raise SystemExit("Relatorio vazio: "+name)
          print("ACEITE_REAL_PAM=OK; capturas=24; vintages=6; celulas=6; sem rede SIDRA")
          PY
      - name: Publicar relatorio de acesso interno como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nivon-ivo-pam-relatorio-real
          path: |
            ${{ runner.temp }}/ivo-real/relatorio/relatorio_pam.html
            ${{ runner.temp }}/ivo-real/relatorio/relatorio_pam.md
            ${{ runner.temp }}/ivo-real/relatorio/entrega_ivo_pam.json
            ${{ runner.temp }}/ivo-real/relatorio/auditoria_pam.json
            ${{ runner.temp }}/ivo-real/relatorio/aceite_pam.json
          retention-days: 14
          if-no-files-found: error
