name: NIVON - Segurança
on:
  pull_request:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  auditoria-dependencias:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Instalar auditor
        run: python -m pip install --disable-pip-version-check 'pip-audit==2.9.0'
      - name: Auditar requisitos travados, sem instalação de dependências
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          arquivos=(requirements/*.txt)
          if (( ${#arquivos[@]} == 0 )); then
            echo 'ERRO: nenhum arquivo travado em requirements/*.txt'
            exit 1
          fi
          for arquivo in "${arquivos[@]}"; do
            echo "Auditando ${arquivo}"
            python -m pip_audit --disable-pip --no-deps --requirement "${arquivo}"
          done
          if [[ ! -f requirements/ci.lock && ! -f requirements/ci.txt ]]; then
            echo '::warning::F2 ainda precisa entregar lock completo de runtime/CI.'
          fi

  codeql:
    name: codeql-python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: '/language:python'
