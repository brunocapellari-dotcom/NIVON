name: NIVON - Validar ou criar tabela staging agro

on:
  workflow_dispatch:
    inputs:
      aplicar:
        type: boolean
        description: 'Criar a tabela apenas se ausente; exige aprovação IAM/custos'
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: nivon-bootstrap-agro-staging
  cancel-in-progress: false

jobs:
  preparar-tabela:
    if: ${{ github.ref == 'refs/heads/main' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nivon-gcp-producao
    env:
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_AGRO_STAGING_SCHEMA_APPROVED: ${{ vars.NIVON_AGRO_STAGING_SCHEMA_APPROVED }}
      NIVON_AGRO_GCP_WRITE_APPROVED: ${{ vars.NIVON_AGRO_GCP_WRITE_APPROVED }}
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_APLICAR: ${{ inputs.aplicar }}
    steps:
      - name: Recusar criacao sem três gates explícitos
        shell: bash
        run: |
          if [[ "$NIVON_APLICAR" == "true" ]]; then
            test "$NIVON_AGRO_STAGING_SCHEMA_APPROVED" = "true"
            test "$NIVON_AGRO_GCP_WRITE_APPROVED" = "true"
            test "$NIVON_ZERO_COST_BQ_APPROVED" = "true"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - run: python -m pip install -e '.[gcp]'
      - name: Validar schema ou criar a única tabela autorizada
        shell: bash
        run: |
          args=(--projeto "$NIVON_BQ_PROJECT" --dataset "$NIVON_BQ_DATASET" --verificar)
          if [[ "$NIVON_APLICAR" == "true" ]]; then args+=(--aplicar); fi
          python scripts/bootstrap_agro_staging_gcp.py "${args[@]}"
