name: NIVON - Expansao 50 fontes - QA offline
on:
  pull_request:
    paths:
      - 'config/fontes_nivon_master.v1.json'
      - 'config/rotas_coleta.v1.json'
      - 'config/motores_externos_20261022.v1.json'
      - 'src/nivon/fontes_expansao_20261022.py'
      - 'src/nivon/rotas_coleta.py'
      - 'tests/test_fontes_expansao_20261022.py'
      - '.github/workflows/expansao-fontes-20261022.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NIVON
        run: python -m pip install -e .
      - name: Check catalog and safe metadata collectors
        run: python -m unittest discover -s tests -p 'test_fontes_expansao_20261022.py' -v
