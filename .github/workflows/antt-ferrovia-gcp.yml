name: NIVON - ANTT Ferrovia para Google Cloud
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'preflight sem rede ou live com coleta e persistencia'
        required: true
        default: preflight
        type: choice
        options: [preflight, live]
  schedule:
    # Terças e sextas, 12 UTC (08h Mato Grosso): verifica ano atual e anterior.
    - cron: '0 12 * * 2,5'
  push:
    branches: [feature/transporte-antt-antaq-20261022]
    paths:
      - '.github/workflows/antt-ferrovia-gcp.yml'

permissions:
  contents: read

concurrency:
  group: nivon-antt-ferrovia-gcp
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Informar estado sem expor parametros
        env:
          P: ${{ vars.NIVON_GCP_PROJECT_ID }}
          D: ${{ vars.NIVON_BQ_DATASET }}
          B: ${{ vars.NIVON_GCS_BUCKET }}
          W: ${{ vars.NIVON_GCP_WIF_PROVIDER }}
          S: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$P" ] && [ -n "$D" ] && [ -n "$B" ] && [ -n "$W" ] && [ -n "$S" ]; then
            echo 'GCP_VARIAVEIS_CONFIGURADAS_NAO_EQUIVALE_AUTENTICACAO'
          else
            echo 'GCP_PENDENTE_CONFIGURACAO; nenhuma autenticacao ou escrita'
          fi
  coletar-e-persistir:
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.modo == 'live') &&
      vars.NIVON_GCP_PROJECT_ID != '' &&
      vars.NIVON_BQ_DATASET != '' &&
      vars.NIVON_GCS_BUCKET != '' &&
      vars.NIVON_GCP_WIF_PROVIDER != '' &&
      vars.NIVON_GCP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Autenticacao temporaria GCP sem chave de servico
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_GCP_PROJECT_ID }}
          create_credentials_file: true
      - name: Preparar bibliotecas Google Cloud
        run: |
          python -m pip install --disable-pip-version-check --quiet 'google-cloud-bigquery>=3,<4' 'google-cloud-storage>=3,<4'
      - name: Executar pipeline completo de maneira idempotente
        env:
          PYTHONPATH: src
          NIVON_PROJETO: ${{ vars.NIVON_GCP_PROJECT_ID }}
          NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
          NIVON_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
        run: |
          python - <<'PY'
          import os,subprocess
          from datetime import datetime, timezone
          ano=datetime.now(timezone.utc).year
          cmd=['python','-m','nivon.antt_gcp_pipeline',
               '--staging',os.path.join(os.environ['RUNNER_TEMP'],'antt-stage'),
               '--projeto',os.environ['NIVON_PROJETO'],
               '--dataset',os.environ['NIVON_DATASET'],
               '--bucket',os.environ['NIVON_BUCKET'],
               '--inicio',str(ano-1),'--fim',str(ano),'--live']
          subprocess.run(cmd,check=True)
          PY
