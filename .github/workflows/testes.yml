name: Testes locais NIVON

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-testes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar-nucleo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compilar sem dependencias
        run: python -m compileall -q src tests
      - name: Testar com fixtures 100 por cento sinteticas
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Execucao ponta a ponta PTAX (13 etapas, somente sintéticas)
        env:
          PYTHONPATH: src
        run: python scripts/ensaio_ptax_integrado.py
      - name: Execucao ponta a ponta Fretes R01 + Quant (10 etapas sintéticas)
        env:
          PYTHONPATH: src
        run: python scripts/ensaio_fretes_integrado.py
      - name: Conferir campos econômicos contra RAW JSON estruturado original (sintético)
        env:
          PYTHONPATH: src
        run: python scripts/ensaio_fretes_semantica_raw.py
      - name: Validar quarentena PTAX e preparar objetos GCS sem rede
        env:
          PYTHONPATH: src
        run: python scripts/ensaio_quarentena_ptax_gcs.py
      - name: Conferir catálogo mestre e cobertura de indicadores
        env:
          PYTHONPATH: src
        run: |
          python -m nivon.catalogo_fontes --resumo
          python -m nivon.rotas_coleta --resumo
          python -m nivon.rotas_coleta --prioridade P0
          python -m nivon.cobertura
          python -m nivon.registro_motores
          python -m nivon.auditoria_prontidao --resumo
          python -m nivon.orquestrador_fontes --prioridade P0 --resumo
          python -m nivon.auditoria_coletores --resumo
      - name: Demonstracao deterministica
        env:
          PYTHONPATH: src
        run: python -m nivon
      - name: Fluxos sintéticos ANTT e MAPA
        env:
          PYTHONPATH: src
        run: python -m nivon.analise_local --config config/contrato_exemplo_sintetico.json

  conferir-schema-mapa:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout apenas para inspecionar metadados
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Criar lista municipal agregada (falha de fonte reprova a coleta)
        run: python scripts/resumir_sipeagro.py --saida-agregada derivados/mapa_racao_municipios.json
      - name: Validar privacidade e integridade antes da publicacao
        run: python scripts/validar_agregado.py derivados/mapa_racao_municipios.json
      - name: Publicar somente agregado validado por 3 dias
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nivon-mapa-racao-municipios-agregado
          path: derivados/mapa_racao_municipios.json
          retention-days: 3
          if-no-files-found: error

  inspecao-conab-xls:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Leitor XLS BSD com versao fixa
        run: python -m pip install --disable-pip-version-check xlrd==2.0.2
      - name: Inspecionar layout de cinco planilhas oficiais CONAB
        env:
          PYTHONPATH: src
        run: python scripts/inspecionar_conab_xls.py

  inspecao-antt-ferrovias:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar formato e fluxos ferroviários oficiais ANTT (não rodoviários)
        env:
          PYTHONPATH: src
        run: python scripts/inspecionar_antt_ferrovias.py

  inspecao-antt-csv-2026:
    # Fonte oficial retornou página WAF Request Rejected (HTTP 200) em 19/10/2026.
    # Não insistir em PR nem contornar proteção; diagnóstico somente manual.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verificar CSV aberto SIADE ferroviario ANTT
        run: python scripts/inspecionar_antt_csv.py

  inspecao-anp-diesel:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar setembro de 2026 ANP diesel e S10 sem registros identificadores
        env:
          PYTHONPATH: src
        run: python scripts/inspecionar_anp_diesel.py

  integracao-bibliotecas-opcionais:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar extras consolidados sem credenciais, browser ou download de dados
        run: |
          python -m pip install --disable-pip-version-check -e '.[agro,analytics,forecast,ports]'
          python -m pip check
      - name: Smoke tests com dados 100 por cento sintéticos
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import agrobr, duckdb, polars, pydantic, pdfplumber, statsforecast
          from nivon.previsoes_bibliotecas import prever_mensal
          serie = [
              (f"{2023+i//12:04d}-{i%12+1:02d}", 100.0+i)
              for i in range(36)
          ]
          resultado = prever_mensal(serie, horizonte=2)
          assert len(resultado["previsoes"]) == 2
          assert resultado["estado"] == "CENARIO_NAO_HOMOLOGADO"
          print("INTEGRACAO_EXTRAS_OK (SEM CHAMADAS A FONTES REAIS)")
          PY
