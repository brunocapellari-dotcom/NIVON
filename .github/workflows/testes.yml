name: Testes locais NIVON

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-testes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar-nucleo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compilar sem dependencias
        run: python -m compileall -q src tests
      - name: Verificar sintaxe do runner maritimo em conteiner
        run: bash -n scripts/run_maritime_pdf_container.sh
      - name: Testar com fixtures 100 por cento sinteticas
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Conferir catálogo mestre e cobertura de indicadores
        env:
          PYTHONPATH: src
        run: |
          python -m nivon.catalogo_fontes --resumo
          python -m nivon.rotas_coleta --resumo
          python -m nivon.rotas_coleta --prioridade P0
          python -m nivon.cobertura
          python -m nivon.registro_motores
          python -m nivon.auditoria_prontidao --resumo
          python -m nivon.orquestrador_fontes --prioridade P0 --resumo
          python -m nivon.auditoria_coletores --resumo
      - name: Demonstracao deterministica
        env:
          PYTHONPATH: src
        run: python -m nivon
      - name: Fluxos sintéticos ANTT e MAPA
        env:
          PYTHONPATH: src
        run: python -m nivon.analise_local --config config/contrato_exemplo_sintetico.json


  validar-pdf-maritimo-offline:
    # Only synthetic PDFs generated in memory; no network source requests,
    # collector activation or publication. Test dependencies are pinned.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Obter codigo sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Bibliotecas PDF apenas para os testes, versoes fixas
        run: python -m pip install --disable-pip-version-check pdfplumber==0.11.9 reportlab==4.4.9
      - name: PDF real sintetico -> pdfplumber -> parser -> bridge
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_maritime_pdfplumber_e2e.py' -v
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover(
              'tests', pattern='test_maritime_pdfplumber_e2e.py'
          )
          count = suite.countTestCases()
          if count != 27:
              raise SystemExit(f'Expected 27 PDF byte tests, got {count}')
          PY

  validar-pdf-maritimo-em-conteiner:
    # Docker build may fetch PUBLIC dependency images at build time; the
    # subsequent 3 actual container executions are strictly --network none.
    # Synthetic data ONLY, no real PDFs, no cloud services or deployment.
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
    steps:
      - name: Obter codigo sem credenciais persistidas
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preparar Python de fixture
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas PDF apenas para gerar fixture sintética
        run: python -m pip install --disable-pip-version-check pdfplumber==0.11.9 reportlab==4.4.9
      - name: Construir imagem local offline sem push nem deploy
        run: docker build -f docker/Dockerfile.maritime-pdf-offline -t nivon-maritime-pdf-offline:local .
      - name: Gerar tres edicoes PDF sinteticas com SHA e manifesto
        env:
          PYTHONPATH: .:src:tests
        run: |
          set -euo pipefail
          echo "MARITIME_E2E_ROOT=${RUNNER_TEMP}/nivon_pdf_smoke" >> "${GITHUB_ENV}"
          python tests/maritime_container_smoke.py prepare \
            "${RUNNER_TEMP}/nivon_pdf_smoke/inputs" \
            "${RUNNER_TEMP}/nivon_pdf_smoke/outputs"
      - name: Processar lote completo dry-run SEM rede e sem SQLite
        run: |
          set -euo pipefail
          bash scripts/run_maritime_pdf_container.sh \
            "${MARITIME_E2E_ROOT}/inputs" "${MARITIME_E2E_ROOT}/outputs" \
            input_manifest.json audit_dryrun.json 2026-10-20T18:00:00+00:00
          test ! -e "${MARITIME_E2E_ROOT}/outputs/maritime.sqlite"
      - name: Persistir edicoes derivadas e gerar auditoria SEM rede
        run: |
          set -euo pipefail
          bash scripts/run_maritime_pdf_container.sh \
            "${MARITIME_E2E_ROOT}/inputs" "${MARITIME_E2E_ROOT}/outputs" \
            input_manifest.json audit_commit.json 2026-10-20T18:00:00+00:00 --commit
      - name: Repetir mesmo lote e verificar idempotencia SEM rede
        run: |
          set -euo pipefail
          bash scripts/run_maritime_pdf_container.sh \
            "${MARITIME_E2E_ROOT}/inputs" "${MARITIME_E2E_ROOT}/outputs" \
            input_manifest.json audit_replay.json 2026-10-20T18:00:00+00:00 --commit
      - name: Ingerir quarta edicao em lote posterior SEM rede
        run: |
          set -euo pipefail
          bash scripts/run_maritime_pdf_container.sh \
            "${MARITIME_E2E_ROOT}/inputs" "${MARITIME_E2E_ROOT}/outputs" \
            incremental_manifest.json audit_incremental.json 2026-10-20T20:00:00+00:00 --commit
      - name: Reexecutar lote incremental sem duplicar edicoes SEM rede
        run: |
          set -euo pipefail
          bash scripts/run_maritime_pdf_container.sh \
            "${MARITIME_E2E_ROOT}/inputs" "${MARITIME_E2E_ROOT}/outputs" \
            incremental_manifest.json audit_incremental_replay.json 2026-10-20T20:00:00+00:00 --commit
      - name: Afirmar arquivos, relatorio, SQLite, diferencas e bloqueio de release
        env:
          PYTHONPATH: .:src:tests
        run: |
          python tests/maritime_container_smoke.py verify "${MARITIME_E2E_ROOT}/outputs"
      - name: Publicar apenas relatorios sinteticos auditados, por tres dias
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nivon-maritime-offline-container-synthetic-evidence
          path: ${{ runner.temp }}/nivon_pdf_smoke/outputs/audit_*.json
          retention-days: 3
          if-no-files-found: error

  conferir-schema-mapa:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout apenas para inspecionar metadados
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Criar lista municipal agregada (falha de fonte reprova a coleta)
        run: python scripts/resumir_sipeagro.py --saida-agregada derivados/mapa_racao_municipios.json
      - name: Validar privacidade e integridade antes da publicacao
        run: python scripts/validar_agregado.py derivados/mapa_racao_municipios.json
      - name: Publicar somente agregado validado por 3 dias
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nivon-mapa-racao-municipios-agregado
          path: derivados/mapa_racao_municipios.json
          retention-days: 3
          if-no-files-found: error

  inspecao-conab-xls:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Leitor XLS BSD com versao fixa
        run: python -m pip install --disable-pip-version-check xlrd==2.0.2
      - name: Inspecionar layout de cinco planilhas oficiais CONAB
        env:
          PYTHONPATH: src
        run: python scripts/inspecionar_conab_xls.py

  inspecao-antt-ferrovias:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar formato e fluxos ferroviários oficiais ANTT (não rodoviários)
        env:
          PYTHONPATH: src
        run: python scripts/inspecionar_antt_ferrovias.py

  inspecao-antt-csv-2026:
    # Fonte oficial retornou página WAF Request Rejected (HTTP 200) em 19/10/2026.
    # Não insistir em PR nem contornar proteção; diagnóstico somente manual.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verificar CSV aberto SIADE ferroviario ANTT
        run: python scripts/inspecionar_antt_csv.py

  inspecao-anp-diesel:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar setembro de 2026 ANP diesel e S10 sem registros identificadores
        env:
          PYTHONPATH: src
        run: python scripts/inspecionar_anp_diesel.py
