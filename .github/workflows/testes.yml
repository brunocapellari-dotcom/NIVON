name: Testes locais NIVON

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-testes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar-nucleo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compilar sem dependencias
        run: python -m compileall -q src tests
      - name: Testar com fixtures 100 por cento sinteticas
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Smoke E2E PAM offline - dois recortes, quarentena e gate de revisao
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/smoke_ivo_pam_lote.py
      - name: MVP go-live HTTP — painel, IVO e publicação condicionada
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/smoke_go_live_mvp.py
      - name: Construir imagem Docker do MVP sem enviar a registry
        run: docker build -f Dockerfile --tag nivon-mvp:ci .
      - name: Executar contêiner MVP em loopback sem dados e sem credenciais
        run: |
          set -euo pipefail
          docker run --detach --name nivon-mvp-smoke \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 256m --cpus 1 \
            --publish 127.0.0.1:18080:8080 \
            --env NIVON_PRIVATE_DEPLOY_APPROVED=true \
            nivon-mvp:ci
          trap 'docker rm --force nivon-mvp-smoke >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          host = "http://127.0.0.1:18080"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(host+"/healthz",timeout=2) as r:
                      assert r.status == 200
                  break
              except (OSError,AssertionError):
                  time.sleep(.2)
          else:
              raise SystemExit("container não iniciou")
          with urllib.request.urlopen(host+"/api/status",timeout=3) as r:
              status=json.loads(r.read())
              assert status["status"]=="PREVIEW_SEM_EDICAO_HOMOLOGADA"
          try:
              urllib.request.urlopen(host+"/api/edicao",timeout=3)
              raise AssertionError("edição ausente não pode retornar sucesso")
          except urllib.error.HTTPError as ex:
              assert ex.code==503
          payload=urllib.parse.urlencode(
              {"pergunta":"analisar soja clima e frete"}).encode()
          request=urllib.request.Request(host+"/ivo",data=payload,
              headers={"Content-Type":"application/x-www-form-urlencoded"})
          with urllib.request.urlopen(request,timeout=3) as r:
              assert r.status==200
              body=r.read().decode()
              assert "PLANO_OFFLINE_SEM_DADOS_HOMOLOGADOS" in body
          print("CONTAINER_MVP_PRIVADO_E2E_OK — sem edicao, sem rede externa")
          PY
      - name: Conferir catálogo mestre e cobertura de indicadores
        env:
          PYTHONPATH: src
        run: |
          python -m nivon.catalogo_fontes --resumo
          python -m nivon.rotas_coleta --resumo
          python -m nivon.rotas_coleta --prioridade P0
          python -m nivon.cobertura
          python -m nivon.registro_motores
          python -m nivon.auditoria_prontidao --resumo
          python -m nivon.orquestrador_fontes --prioridade P0 --resumo
          python -m nivon.auditoria_coletores --resumo
      - name: Demonstracao deterministica
        env:
          PYTHONPATH: src
        run: python -m nivon
      - name: Fluxos sintéticos ANTT e MAPA
        env:
          PYTHONPATH: src
        run: python -m nivon.analise_local --config config/contrato_exemplo_sintetico.json

  conferir-schema-mapa:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout apenas para inspecionar metadados
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Criar lista municipal agregada (falha de fonte reprova a coleta)
        run: python scripts/resumir_sipeagro.py --saida-agregada derivados/mapa_racao_municipios.json
      - name: Validar privacidade e integridade antes da publicacao
        run: python scripts/validar_agregado.py derivados/mapa_racao_municipios.json
      - name: Publicar somente agregado validado por 3 dias
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nivon-mapa-racao-municipios-agregado
          path: derivados/mapa_racao_municipios.json
          retention-days: 3
          if-no-files-found: error

  inspecao-conab-xls:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Leitor XLS BSD com versao fixa
        run: python -m pip install --disable-pip-version-check xlrd==2.0.2
      - name: Inspecionar layout de cinco planilhas oficiais CONAB
        env:
          PYTHONPATH: src
        run: python scripts/inspecionar_conab_xls.py

  inspecao-antt-ferrovias:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar formato e fluxos ferroviários oficiais ANTT (não rodoviários)
        env:
          PYTHONPATH: src
        run: python scripts/inspecionar_antt_ferrovias.py

  inspecao-antt-csv-2026:
    # Fonte oficial retornou página WAF Request Rejected (HTTP 200) em 19/10/2026.
    # Não insistir em PR nem contornar proteção; diagnóstico somente manual.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verificar CSV aberto SIADE ferroviario ANTT
        run: python scripts/inspecionar_antt_csv.py

  inspecao-anp-diesel:
    # Diagnóstico de fonte real somente manual. Não repetir downloads em todo PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar setembro de 2026 ANP diesel e S10 sem registros identificadores
        env:
          PYTHONPATH: src
        run: python scripts/inspecionar_anp_diesel.py
