name: Testes locais NIVON

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.github/workflows/testes.yml'
      - 'scripts/inspecionar_sipeagro.py'
      - 'scripts/resumir_sipeagro.py'
      - 'scripts/validar_agregado.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-testes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar-nucleo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compilar sem dependencias
        run: python -m compileall -q src tests
      - name: Testar com fixtures 100 por cento sinteticas
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Demonstracao deterministica
        env:
          PYTHONPATH: src
        run: python -m nivon
      - name: Fluxos sintéticos ANTT e MAPA
        env:
          PYTHONPATH: src
        run: python -m nivon.analise_local --config config/contrato_exemplo_sintetico.json

  conferir-schema-mapa:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout apenas para inspecionar metadados
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspecao nao bloqueante de cabecalho CSV publico MAPA
        continue-on-error: true
        run: python scripts/inspecionar_sipeagro.py
      - name: Resumo agregado por municipio sem identificadores pessoais
        continue-on-error: true
        run: python scripts/resumir_sipeagro.py

      - name: Criar lista municipal agregada sem identificadores
        continue-on-error: true
        run: python scripts/resumir_sipeagro.py --saida-agregada derivados/mapa_racao_municipios.json
      - name: Bloquear publicacao de dados individuais
        if: ${{ hashFiles('derivados/mapa_racao_municipios.json') != '' }}
        run: python scripts/validar_agregado.py derivados/mapa_racao_municipios.json
      - name: Publicar somente agregado validado por 3 dias
        if: ${{ hashFiles('derivados/mapa_racao_municipios.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nivon-mapa-racao-municipios-agregado
          path: derivados/mapa_racao_municipios.json
          retention-days: 3
          if-no-files-found: error
