name: NIVON CONAB - piloto oficial pontual

# Experimento de UMA execução em branch de desenvolvimento.
# Sem cron, segredo, custo GCP, artefatos persistidos nem publicação.
# Novos commits não disparam novamente esta coleta (filtro paths).
on:
  push:
    branches:
      - feat/argentina-sagyp-fontes-prioritarias-20261022
    paths:
      - .github/workflows/piloto-conab-uma-vez.yml

permissions:
  contents: read

jobs:
  captura-pontual-conab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter codigo da branch isolada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Diagnosticar links publicos da ultima edicao CONAB (somente metadados)
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from urllib.parse import urljoin,urlsplit
          from nivon.conab_indice_progresso import consultar_indice
          from nivon.conab_sync_metadados import consultar_pagina_semana
          from nivon.conab_fila_publicacoes import _Links,examinar_pagina_semana,_recurso_oficial
          idx=consultar_indice(executar=True)
          print('Indice_edicoes',len(idx['edicoes_candidatas']))
          first=idx['edicoes_candidatas'][0]
          print('Edicao_URL',first['pagina_oficial'])
          raw=consultar_pagina_semana(first['pagina_oficial'],executar=True,direitos_consulta=True)
          parser=_Links();parser.feed(raw.decode('utf-8-sig'))
          print('Edicao_links',len(parser.links))
          matches=[(h,t) for h,t in parser.links if 'plantio' in t.casefold() or 'colheita' in t.casefold()]
          print('Links_plantio',len(matches))
          for h,t in matches[:8]:
              u=urljoin(first['pagina_oficial'].rstrip('/')+'/',h or '')
              print('Rotulo',repr(t[:100]),'href_path',repr(urlsplit(u).path),'aceito',_recurso_oficial(u,first['pagina_oficial']))
          print('Candidatos_extraidos',len(examinar_pagina_semana(raw,pagina_url=first['pagina_oficial'])['recursos']))
          PY
      - name: Coletar UMA edicao oficial e inspecionar RAW sem upload
        env:
          PYTHONPATH: src
          WORK_DIR: ${{ runner.temp }}/nivon-conab-one-off
        run: |
          set -eu
          mkdir -m 700 "$WORK_DIR"
          mkdir -m 700 "$WORK_DIR/raw"
          python -m nivon.conab_execucao_edicao \
            --banco "$WORK_DIR/coleta.sqlite" \
            --pasta-raw "$WORK_DIR/raw" \
            --executar \
            --direitos-consulta \
            --direitos-coleta \
            --direitos-armazenamento
      - name: Nao salvar arquivos nem publicar dados
        if: always()
        env:
          WORK_DIR: ${{ runner.temp }}/nivon-conab-one-off
        run: |
          rm -rf -- "$WORK_DIR"
