name: NIVON - Primeira Edicao Operacional Interna

on:
  pull_request:
    paths:
      - 'src/nivon/painel_lancamento.py'
      - 'scripts/publicar_painel_interno.py'
      - 'tests/test_painel_lancamento.py'
      - '.github/workflows/nivon-go-live-interno.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nivon-go-live-interno.yml'
  schedule:
    - cron: '20 12 * * 1-5'
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar um retrato interno com 3 consultas read-only e dois objetos GCS'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nivon-go-live-interno-gcs
  cancel-in-progress: false

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testar o contrato, CLI offline e renderizacao
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e .
          python -m compileall -q src/nivon/painel_lancamento.py scripts/publicar_painel_interno.py
          python -m unittest discover -s tests -p 'test_painel_lancamento.py' -v
          python scripts/publicar_painel_interno.py --as-of 2026-10-25T20:00:00Z | python -c 'import json,sys; x=json.load(sys.stdin); assert x["status"]=="PLANO_SEM_REDE"'

  primeira-publicacao:
    needs: qualidade
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publicar == true) ||
      (github.event_name == 'schedule' &&
       vars.NIVON_PAINEL_INTERNO_AGENDADO == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Bloquear outro projeto e recurso nao aprovado
        run: |
          set -euo pipefail
          test "$NIVON_PROJETO" = 'nivon-data'
          test "$NIVON_DATASET" = 'nivon_raw'
          test "$NIVON_BUCKET" = 'nivon-data-raw-2026'
      - name: Autenticar apenas com OIDC temporario
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar bibliotecas de consulta
        run: python -m pip install --disable-pip-version-check -e '.[gcp]'
      - name: Produzir relatorio interno usando tres series reais e readback privado
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publicar_painel_interno.py \
            --projeto "$NIVON_PROJETO" \
            --dataset "$NIVON_DATASET" \
            --bucket "$NIVON_BUCKET" \
            --executar > "$RUNNER_TEMP/nivon-lancamento-status.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"nivon-lancamento-status.json"
          status=json.loads(path.read_text(encoding="utf-8"))
          if (status.get("status")!="PUBLICADO_SOMENTE_GCS_PRIVADO"
              or status.get("objetos")!=4 or not status.get("sem_url_publica")
              or not status.get("sha256_json")):
              raise RuntimeError("LANÇAMENTO_INTERNO_SEM_PROVA_DE_READBACK")
          print("NIVON_LANCAMENTO_INTERNO_OK",json.dumps({
              "status":status["status"],
              "corte":status["data_corte"],
              "objetos":status["objetos"],
              "prefixo":status["prefixo"],
              "sha256_json":status["sha256_json"],
          },ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as stream:
              stream.write("### NIVON — primeira edição operacional interna\n\n")
              stream.write("Resultado em bucket privado existente, sem URL pública.\n\n")
              stream.write("Caminho: nivon/painel-interno/latest.html\n\n")
              stream.write("Fontes: ANTT SIADE (histórico), Imbituba (programação), PortWatch (estimativa).\n\n")
              stream.write("Status: SHADOW. Não representa operações concluídas.\n")
          PY
      - name: Limpar saidas temporarias sem publicar documentos
        if: always()
        run: rm -f "$RUNNER_TEMP/nivon-lancamento-status.json"
