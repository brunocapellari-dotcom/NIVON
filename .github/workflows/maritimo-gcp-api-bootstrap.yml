# Auditoria C1: habilitar APIs de nuvem requer operador humano autorizado.
# Este workflow nao recebe OIDC e nao modifica Google Cloud.
name: NIVON - Orientacoes de APIs Cloud Run (sem escrita)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orientacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Informar bloqueio administrativo sem token de nuvem
        run: |
          echo 'CLOUD_RUN_API_BOOTSTRAP=ACAO_ADMINISTRATIVA_PENDENTE'
          echo 'Nenhuma API foi ativada, nenhum recurso foi criado.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Habilitar apenas APIs necessarias mediante revisao de IAM e Billing no GCP.' >> "$GITHUB_STEP_SUMMARY"
