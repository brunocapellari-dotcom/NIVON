name: NIVON - Deploy controlado Cloud Run maritimo
on:
  pull_request:
    paths:
      - 'scripts/nivon_maritimo_cloudrun_deploy.sh'
      - '.github/workflows/maritimo-gcp-cloudrun-deploy.yml'
  workflow_dispatch:
    inputs:
      executar_piloto:
        description: 'Executar um lote unico Imbituba + PortWatch apos publicar a imagem'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: nivon-maritimo-cloud-run-deploy
  cancel-in-progress: false
jobs:
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validar deploy fail-closed sem credenciais
        run: |
          bash -n scripts/nivon_maritimo_cloudrun_deploy.sh
          if NIVON_PROJETO=nivon-data NIVON_DATASET=nivon_raw \
             NIVON_BUCKET=nivon-data-raw-2026 \
             NIVON_EXECUTION_SA=nivon-coletor-de-dados@nivon-data.iam.gserviceaccount.com \
             GITHUB_REF=refs/pull/123/merge bash scripts/nivon_maritimo_cloudrun_deploy.sh; then
             echo 'ERRO: DEFERIR EXECUCAO DE PR'
             exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          src=Path('scripts/nivon_maritimo_cloudrun_deploy.sh').read_text()
          assert 'gcloud run jobs deploy' in src
          assert 'gcloud run jobs execute' in src
          assert 'gcloud scheduler jobs create' not in src
          assert 'set-iam-policy' not in src
          print('CONTRATO_CLOUD_RUN_SEM_CRON_E_SEM_IAM=OK')
          PY
  deploy:
    needs: contrato
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_EXECUTION_SA: nivon-coletor-de-dados@nivon-data.iam.gserviceaccount.com
      NIVON_MARITIMO_ARTIFACT_REPO: ${{ vars.NIVON_MARITIMO_ARTIFACT_REPO }}
      NIVON_EXECUTAR_PILOTO: ${{ inputs.executar_piloto }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
      - name: Instalar SDKs e validar script antes de qualquer escrita
        run: |
          python -m pip install --disable-pip-version-check -e '.[gcp]'
          bash -n scripts/nivon_maritimo_cloudrun_deploy.sh
          test "$NIVON_PROJETO" = nivon-data
      - name: Build, deploy e piloto unico condicionado a recursos existentes
        run: bash scripts/nivon_maritimo_cloudrun_deploy.sh
