name: NIVON - Prova detalhamento hidrovia 2025
on:
  push:
    branches: [feat/antaq-hidrovia-produtos-20261023]
    paths:
      - '.github/workflows/antaq-hidrovia-detalhe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar_detalhe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar leitor local de dados secundarios
        run: python -m pip install --quiet 'pyarrow>=18,<24' 'huggingface_hub>=0.30,<2'
      - name: Inspecionar 2025 somente metadados e campos
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          import pyarrow.parquet as pq
          from huggingface_hub import HfApi, hf_hub_download
          repo='vinicius-souza/antaq'
          paths=['silver/Carga_Hidrovia/ano=2025/data.parquet',
                 'silver/Carga/ano=2025/data.parquet',
                 'silver/Carga_Rio/ano=2025/data.parquet']
          info=HfApi().dataset_info(repo_id=repo,files_metadata=True)
          sizes={x.rfilename:x.size for x in info.siblings}
          print('VERSAO_FONTE_SECUNDARIA',info.sha)
          for path in paths:
              size=sizes.get(path)
              print('ARQUIVO',path,'BYTES_DECLARADOS',size)
              if size is None or size>65_000_000:continue
              fn=hf_hub_download(repo_id=repo,repo_type='dataset',filename=path,revision=info.sha)
              pqf=pq.ParquetFile(fn)
              print('METADADOS',path,'n_rows',pqf.metadata.num_rows,'schema',repr(pqf.schema_arrow))
              dados=pqf.read_row_group(0).slice(0,3).to_pylist()
              for x in dados:
                  print('AMOSTRA_3P',path,json.dumps(x,default=str,ensure_ascii=False)[:1300])
          print('CLASSIFICACAO','FONTE_DERIVADA_NAO_HOMOLOGADA')
          PY
