name: NIVON - Prova detalhamento hidrovia 2025
on:
  push:
    branches: [feat/antaq-hidrovia-produtos-20261023]
    paths:
      - '.github/workflows/antaq-hidrovia-detalhe.yml'
      - 'src/nivon/antaq_replica_detalhe.py'
      - 'tests/test_antaq_replica_detalhe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspecionar_detalhe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar leitor local de dados secundarios
        run: python -m pip install --quiet 'pyarrow>=18,<24' 'huggingface_hub>=0.30,<2'
      - name: Validar taxonomia e juncoes sem rede
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --quiet 'duckdb>=1.2,<2'
          python -m unittest discover -s tests -p 'test_antaq_replica_detalhe.py' -v
      - name: Inspecionar 2025 somente metadados e campos
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          import pyarrow.parquet as pq
          from huggingface_hub import HfApi, hf_hub_download
          repo='vinicius-souza/antaq'
          paths=['silver/Carga_Hidrovia/ano=2025/data.parquet',
                 'silver/Carga/ano=2025/data.parquet',
                 'silver/Carga_Rio/ano=2025/data.parquet']
          info=HfApi().dataset_info(repo_id=repo,files_metadata=True)
          sizes={x.rfilename:x.size for x in info.siblings}
          print('VERSAO_FONTE_SECUNDARIA',info.sha)
          for path in paths:
              size=sizes.get(path)
              print('ARQUIVO',path,'BYTES_DECLARADOS',size)
              if size is None or size>65_000_000:continue
              fn=hf_hub_download(repo_id=repo,repo_type='dataset',filename=path,revision=info.sha)
              pqf=pq.ParquetFile(fn)
              print('METADADOS',path,'n_rows',pqf.metadata.num_rows,'schema',repr(pqf.schema_arrow))
              dados=pqf.read_row_group(0).slice(0,3).to_pylist()
              for x in dados:
                  print('AMOSTRA_3P',path,json.dumps(x,default=str,ensure_ascii=False)[:1300])
          print('CLASSIFICACAO','FONTE_DERIVADA_NAO_HOMOLOGADA')
          PY
      - name: Cruzar cargas de 2025 por hidrovia, navegacao e commodity
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          from huggingface_hub import HfApi,hf_hub_download
          from nivon.antaq_replica_detalhe import resumo_parquets,resumo_agro
          repo='vinicius-souza/antaq'
          rev=HfApi().dataset_info(repo_id=repo).sha
          def get(table):
              return hf_hub_download(repo_id=repo,repo_type='dataset',revision=rev,
                         filename='silver/'+table+'/ano=2025/data.parquet')
          doc=resumo_parquets(get('Carga_Hidrovia'),get('Carga'))
          agro=resumo_agro(doc)
          print("PROVENIENCIA",rev,"TERCEIRO_NAO_HOMOLOGADO")
          print("QUANTIDADE_LINHAS_HIDROVIA",doc["linhas_hidrovia"])
          print("QUANTIDADE_LINHAS_CARGA",doc["linhas_carga"])
          print("CHAVES_SEM_VINCULO",doc["linhas_sem_vinculo"])
          interiores=[r for r in agro["recortes_agro"] if r["navegacao"] == "Interior"]
          print("NAVEGACAO_INTERIOR_AGRO_TOP_60",json.dumps(interiores[:60],ensure_ascii=False))
          print("TOTAL_RECORTES_AGRO",len(agro["recortes_agro"]),"INTERIOR",len(interiores))
          print("ESTADO","DADOS_TERCEIRO_SEM_CONCILIACAO_OFICIAL")
          PY
