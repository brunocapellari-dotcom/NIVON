name: NIVON - Maritimo CI Google Cloud (sem ingestao)
on:
  pull_request:
    paths:
      - 'src/nivon/lineup_portos.py'
      - 'src/nivon/maritimo_pipeline.py'
      - 'src/nivon/maritimo_lote.py'
      - 'src/nivon/portwatch_fluxos.py'
      - 'src/nivon/maritimo_bigquery.py'
      - 'src/nivon/maritimo_cloud_storage.py'
      - 'src/nivon/maritimo_gcp_job.py'
      - 'src/nivon/maritimo_replay_gcp.py'
      - 'src/nivon/maritimo_portwatch_backfill.py'
      - 'infra/google_cloud/**'
      - 'pyproject.toml'
      - 'tests/test_lineup_portos.py'
      - 'tests/test_maritimo_integrado.py'
      - 'tests/test_maritimo_lote.py'
      - 'tests/test_portwatch_fluxos.py'
      - 'tests/test_maritimo_google_cloud.py'
      - 'tests/test_maritimo_migracao_gcp.py'
      - 'tests/test_maritimo_portwatch_backfill.py'
      - 'tests/test_maritimo_gcp_preflight.py'
      - '.github/workflows/maritimo-integrado.yml'
  workflow_dispatch:
    inputs:
      fonte:
        description: 'Fonte HTML (suape, imbituba, santarem_cdp, vila_conde_cdp)'
        required: true
        default: suape
        type: choice
        options: [suape, imbituba, santarem_cdp, vila_conde_cdp]
permissions:
  contents: read
concurrency:
  group: nivon-maritimo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar dependencias oficiais de parsing dos coletores
        run: python -m pip install --disable-pip-version-check -e '.[ports]'
      - name: Validar codigo completo do modulo
        run: python -m compileall -q src tests
      - name: Testes de fluxo integrado sem rede
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
  imagem-cloud-run:
    # Exercicio real de build da imagem de producao; sem credenciais de cloud.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Construir imagem Cloud Run com dependencias reais
        run: docker build -f infra/google_cloud/Dockerfile.maritimo -t nivon-maritimo:ci .
      - name: Verificar importacao SDK Google e contrato do job
        run: |
          docker run --rm nivon-maritimo:ci python -c "import google.cloud.bigquery, google.cloud.storage; from nivon.maritimo_gcp_job import executar_job; print('SDK_GCP_E_JOB_OK')"
      - name: Comprovar que container nao coleta desabilitado
        run: |
          if docker run --rm nivon-maritimo:ci; then
            echo "ERRO: job executou sem habilitacao"
            exit 1
          fi
          echo "Job permaneceu desabilitado como esperado"
  smoke-publico-imbituba:
    # Diagnostico HTTP read-only em PR; nunca grava dados reais ou usa secrets.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verificar parser da programacao oficial sem persistencia
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from nivon.maritimo_pipeline import baixar_html
          from nivon.lineup_portos import extrair_lineup_html
          from datetime import datetime,timezone
          import json
          html = baixar_html('imbituba', habilitar_rede=True,timeout=15)
          rows = extrair_lineup_html(html,'imbituba',
                    coletado_em=datetime.now(timezone.utc).isoformat())
          if not rows:
              raise SystemExit('IMBITUBA_PARSER_NAO_PRODUZIU_LINHAS')
          print(json.dumps({'fonte':'imbituba','registros_detectados':len(rows),
              'sem_exibicao_de_navios_ou_dados_de_terceiros':True}))
          PY
  smoke-publico-portwatch:
    # Apenas 1 consulta curta de fonte aberta; nao salva resposta AIS no repo.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Confirmar consulta da fonte FMI com dados reais
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import datetime,timezone,timedelta
          from nivon.portwatch_fluxos import consulta_url, baixar_pagina, normalizar
          import json
          today=datetime.now(timezone.utc).date()
          first=(today-timedelta(days=14)).isoformat()
          last=(today-timedelta(days=7)).isoformat()
          selected=['hormuz','bab_el_mandeb','suez','panama']
          url=consulta_url(passagens=selected,inicio=first,fim=last)
          payload=baixar_pagina(url,permitir_rede=True)
          records,more=normalizar(payload,consultadas=selected,
              coletado_em=datetime.now(timezone.utc).isoformat())
          if not records or more:
              raise SystemExit('PORTWATCH_VAZIO_OU_PAGINACAO_INCOMPLETA')
          print(json.dumps({'fonte':'FMI_PORTWATCH','registros':len(records),
              'passagens_identificadas':sorted({r['passagem'] for r in records}),
              'datas':[min(r['data_referencia'] for r in records),max(r['data_referencia'] for r in records)],
              'sem_persistencia_publica':True}))
          PY
