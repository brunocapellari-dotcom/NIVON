name: NIVON - Maritimo integracao e capturas verificadas
on:
  pull_request:
    paths:
      - 'src/nivon/lineup_portos.py'
      - 'src/nivon/maritimo_pipeline.py'
      - 'src/nivon/maritimo_lote.py'
      - 'src/nivon/portwatch_fluxos.py'
      - 'src/nivon/maritimo_neon.py'
      - 'migrations/001_maritimo_neon.sql'
      - 'tests/test_lineup_portos.py'
      - 'tests/test_maritimo_integrado.py'
      - 'tests/test_maritimo_lote.py'
      - 'tests/test_portwatch_fluxos.py'
      - 'tests/test_maritimo_neon.py'
      - '.github/workflows/maritimo-integrado.yml'
  workflow_dispatch:
    inputs:
      fonte:
        description: 'Fonte HTML (suape, imbituba, santarem_cdp, vila_conde_cdp)'
        required: true
        default: suape
        type: choice
        options: [suape, imbituba, santarem_cdp, vila_conde_cdp]
  schedule:
    - cron: '12 */6 * * *'
permissions:
  contents: read
concurrency:
  group: nivon-maritimo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar codigo completo do modulo
        run: python -m compileall -q src tests
      - name: Testes de fluxo integrado sem rede
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
  coleta:
    needs: qa
    if: ${{ github.event_name != 'pull_request' && vars.NIVON_MARITIMO_COLETA_HABILITADA == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Coleta publica explicitamente habilitada
        env:
          PYTHONPATH: src
          NIVON_FONTE_MANUAL: ${{ inputs.fonte }}
        run: |
          set -euo pipefail
          FONTE="${NIVON_FONTE_MANUAL:-suape}"
          case "$FONTE" in
            suape|imbituba|santarem_cdp|vila_conde_cdp) ;;
            *) exit 3 ;;
          esac
          mkdir -p .work
          # Processar fontes independentes sem descartar dados bons por falha de uma.
          SUCESSOS=0
          for FONTE in suape imbituba santarem_cdp vila_conde_cdp; do
            set +e
            python -m nivon.maritimo_pipeline --fonte "$FONTE" --permitir-rede --banco .work/maritimo.sqlite
            CODIGO=$?
            set -e
            if [ "$CODIGO" -eq 0 ] || [ "$CODIGO" -eq 2 ]; then SUCESSOS=$((SUCESSOS+1)); fi
          done
          if [ "$SUCESSOS" -eq 0 ]; then echo "SEM_COLETAS_VALIDAS"; exit 5; fi
      - name: Sincronizar banco Neon com historico privado
        env:
          PYTHONPATH: src
          NIVON_MARITIMO_DSN: ${{ secrets.NIVON_MARITIMO_DSN }}
        run: |
          if [ -z "${NIVON_MARITIMO_DSN:-}" ]; then
            echo "NIVON_MARITIMO_DSN NAO CONFIGURADO; BLOQUEIO DE COLETA OPERACIONAL"
            exit 4
          fi
          python -m pip install 'psycopg[binary]==3.2.10'
          python -m nivon.maritimo_neon --banco .work/maritimo.sqlite
      # Banco do runner e efemero e NAO equivale a ingestao permanente.
      # Nao publicar raw HTML ou sqlite em repositorio publico.
