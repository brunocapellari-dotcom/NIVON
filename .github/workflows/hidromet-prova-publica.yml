name: NIVON - Prova pontual APIs hidrometeorologicas publicas
# Sem secrets, sem agendamento e sem publicacao de dados.
# Executar no PR de integracao somente quando este workflow for criado/alterado.
on:
  pull_request:
    paths:
      - .github/workflows/hidromet-prova-publica.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-hidromet-public-probe
  cancel-in-progress: false

jobs:
  provar-fontes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Diagnosticar INMET publicamente sem expor resposta
        env:
          PYTHONPATH: src
        run: python -m nivon.diagnostico_apis_publicas --fonte inmet --live
      - name: Diagnosticar BrasilAPI CPTEC sem expor resposta
        env:
          PYTHONPATH: src
        run: python -m nivon.diagnostico_apis_publicas --fonte cptec --live
