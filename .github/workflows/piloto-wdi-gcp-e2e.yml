name: NIVON - Piloto real WDI GCS BigQuery
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: nivon-piloto-wdi-gcp
  cancel-in-progress: false
jobs:
  piloto:
    if: ${{ github.ref == 'refs/heads/main' && vars.NIVON_PILOTO_WDI_GCP_APPROVED == 'true' && vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_RAW_ARCHIVE_APPROVED == 'true' && vars.NIVON_RECOVERABLE_STAGE_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' }}
    environment: nivon-gcp-producao
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NIVON_PILOTO_WDI_GCP_APPROVED: ${{ vars.NIVON_PILOTO_WDI_GCP_APPROVED }}
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_RAW_ARCHIVE_APPROVED: ${{ vars.NIVON_RAW_ARCHIVE_APPROVED }}
      NIVON_RECOVERABLE_STAGE_APPROVED: ${{ vars.NIVON_RECOVERABLE_STAGE_APPROVED }}
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Autenticar sem chave JSON no GitHub
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar coletores e clientes GCP
        run: python -m pip install -e '.[gcp]'
      - name: Executar observacao real WDI unica e conferir ambos destinos
        run: |
          python -m nivon.piloto_gcp_wdi \
            --projeto "$NIVON_BQ_PROJECT" \
            --dataset "$NIVON_BQ_DATASET" \
            --bucket "$NIVON_GCS_BUCKET" --executar
