name: Inspecao pontual PAM/IBGE NIVON

# Diagnostico de coleta REAL sob demanda; nao repetir a cada push do PR.
# Uma cadencia automatica deve ser ativada junto ao storage persistente.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-ivo-pam-piloto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  piloto-pam:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Consultar seis celulas publicas SIDRA/IBGE e preservar bytes
        id: coleta
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          mkdir -p "${{ runner.temp }}/nivon-pam"
          timeout 120s python -m nivon.ivo_pam_operacao \
            --modo PUBLICO_IBGE \
            --tarefas config/ivo_pam_piloto_mt.v1.json \
            --db "${{ runner.temp }}/nivon-pam/pam.sqlite" \
            --acervo "${{ runner.temp }}/nivon-pam/cofre" \
            > "${{ runner.temp }}/nivon-pam/resultado_coleta.json"
      - name: Resumo observavel sem afirmar falso sucesso de coleta
        if: always()
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, pathlib, os
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"nivon-pam"
          path=root/"resultado_coleta.json"
          if not path.exists():
              print("BLOQUEADO: coleta nem gerou relatorio JSON.")
          else:
              try:
                  data=json.loads(path.read_text())
                  print("ESTADO:",data.get("estado"))
                  print("CONSULTAS:",data.get("total"))
                  print("SUCESSOS_REAIS:",data.get("aprovados",0))
                  print("FALHAS:",data.get("falhas",0))
                  for x in data.get("resultados",[]):
                      print("TAREFA",x.get("ordem"),x.get("status"),
                            x.get("motivo","")[:150])
              except (ValueError,OSError) as exc:
                  print("BLOQUEADO: relatorio nao decodificavel",str(exc))
          PY
      - name: Conferir consistencia do SQLite e acervo local
        if: always()
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, pathlib,os
          from nivon.ivo_pam_operacao import abrir_operacao_pam
          from nivon.ivo_pam_qualidade import auditar_operacao_pam
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"nivon-pam"
          if (base/"pam.sqlite").exists():
              db=abrir_operacao_pam(base/"pam.sqlite")
              try:
                  rel=auditar_operacao_pam(db=db,raiz=base/"cofre")
                  (base/"auditoria.json").write_text(
                      json.dumps(rel,ensure_ascii=False,indent=2))
                  print("INTEGRIDADE:",rel["estado"])
                  print("CAPTURAS:",rel["capturas_registradas"])
                  print("VINTAGES:",rel["vintages_verificadas"])
              finally:
                  db.close()
          else:
              print("SEM_BANCO: nao houve captura persistida.")
          PY
      - name: Preservar resultados temporarios de inspecao
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nivon-pam-piloto-inspecao
          path: ${{ runner.temp }}/nivon-pam/
          retention-days: 3
          if-no-files-found: warn
