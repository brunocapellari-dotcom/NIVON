name: NIVON - Painel integrado logistica AIS e quantitativo
on:
  pull_request:
    paths:
      - 'src/nivon/painel_operacional.py'
      - 'src/nivon/ponte_painel_fontes.py src/nivon/consulta_analitica_bq.py'
      - 'src/nivon/consulta_analitica_bq.py'
      - 'src/nivon/maritimo_painel_avancado.py'
      - 'src/nivon/adaptadores_operacionais.py'
      - 'src/nivon/motor_tendencias.py'
      - 'src/nivon/dinamica_tendencias.py'
      - 'src/nivon/dinamica_mercados_pit.py'
      - 'src/nivon/maritime/**'
      - 'src/nivon/conciliacao_corredores_ferrovia.py'
      - 'scripts/rodar_painel_operacional.py'
      - 'tests/test_painel_operacional.py'
      - 'tests/test_adaptadores_operacionais.py'
      - 'tests/test_ponte_painel_fontes.py'
      - 'tests/test_consulta_analitica_bq.py'
      - 'tests/test_integracao_logistica_maritima_avancada.py'
      - 'tests/test_motor_tendencias.py'
      - 'tests/test_dinamica_tendencias.py'
      - 'tests/test_dinamica_mercados_pit.py'
      - 'tests/test_maritime_agrolog_maritime_queue.py'
      - 'tests/test_maritime_agrolog_maritime_queue_forecast.py'
      - 'tests/test_maritime_agrolog_maritime_source_health.py'
      - 'tests/fixtures/painel_operacional_sintetico.json'
      - '.github/workflows/painel-operacional-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integracao-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar codigo NIVON
        run: python -m pip install -e .
      - name: Compilacao e testes do contrato
        run: |
          python -m compileall -q src/nivon/painel_operacional.py src/nivon/ponte_painel_fontes.py src/nivon/maritimo_painel_avancado.py src/nivon/adaptadores_operacionais.py src/nivon/dinamica_mercados_pit.py src/nivon/motor_tendencias.py src/nivon/dinamica_tendencias.py src/nivon/maritime scripts/rodar_painel_operacional.py
          python -m unittest discover -s tests -p 'test_painel_operacional.py' -v
          python -m unittest discover -s tests -p 'test_ponte_painel_fontes.py' -v
          python -m unittest discover -s tests -p 'test_consulta_analitica_bq.py' -v
          python -m unittest discover -s tests -p 'test_adaptadores_operacionais.py' -v
          python -m unittest discover -s tests -p 'test_integracao_logistica_maritima_avancada.py' -v
          python -m unittest discover -s tests -p 'test_motor_tendencias.py' -v
          python -m unittest discover -s tests -p 'test_dinamica_tendencias.py' -v
          python -m unittest discover -s tests -p 'test_dinamica_mercados_pit.py' -v
          python -m unittest discover -s tests -p 'test_maritime_agrolog_maritime_queue.py' -v
          python -m unittest discover -s tests -p 'test_maritime_agrolog_maritime_queue_forecast.py' -v
          python -m unittest discover -s tests -p 'test_maritime_agrolog_maritime_source_health.py' -v
          python -m unittest discover -s tests -p 'test_conciliacao_corredores_ferrovia.py' -v
      - name: Ensaio integrado em um comando sem nuvem
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rodar_painel_operacional.py \
            --entrada tests/fixtures/painel_operacional_sintetico.json \
            --as-of 2026-10-23T12:00:00Z > "$RUNNER_TEMP/painel.json"
          python -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["status"]=="ANALISE_SHADOW_NAO_HOMOLOGADA"; assert p["logistica"]["recorte"]=="mdfe_sintetico"; assert p["maritimo"][0]["indice_pressao"]=="40.20"; assert p["quantitativo"][0]["tendencia"]=="ALTA"; assert all(not item["publicavel"] for item in [p["logistica"],p["maritimo"][0],p["quantitativo"][0]])' "$RUNNER_TEMP/painel.json"
