name: NIVON - Testes isolados de acesso
on:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Dependencia de fixtures ANTAQ Parquet
        run: python -m pip install --quiet 'pyarrow>=18,<24' 'duckdb>=1.2,<2' 'beautifulsoup4==4.12.3'
      - name: Compilar modulos sem dependencias externas
        run: python -m compileall -q src tests
      - name: Validar apenas fixtures sinteticas, SEM secrets ou chamadas a API
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Confirmar bloqueio de rede por padrao
        env:
          PYTHONPATH: src
        run: |
          python -m nivon.acessos_smoke_privado --fonte usda
          python -m nivon.acessos_smoke_privado --fonte ana
          python -m nivon.acessos_smoke_privado --fonte inmet
