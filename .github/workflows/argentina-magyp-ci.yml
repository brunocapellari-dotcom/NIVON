name: Argentina MAGyP - contrato e ledger RAW
on:
  pull_request:
    paths:
      - 'src/nivon/argentina_magyp.py'
      - 'scripts/coletar_argentina_magyp.py'
      - 'tests/test_argentina_magyp*.py'
      - '.github/workflows/argentina-magyp-ci.yml'
  push:
    branches: [feat/argentina-magyp-live-evidencia]
    paths:
      - 'src/nivon/argentina_magyp.py'
      - 'scripts/coletar_argentina_magyp.py'
      - 'tests/test_argentina_magyp*.py'
      - '.github/workflows/argentina-magyp-ci.yml'
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_argentina_magyp*.py'
      - run: python -m unittest discover -s tests -p 'test_arquivo_raw_gcs.py'
