name: NIVON - AIS Geocercas Offline
on:
  pull_request:
    paths:
      - 'src/nivon/maritime/ais_geofence_inference.py'
      - 'src/nivon/ponte_painel_fontes.py'
      - 'tests/test_maritime_ais_geofence_inference.py'
      - '.github/workflows/ais-geofence-e2e.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_maritime_ais_geofence_inference.py' -v
