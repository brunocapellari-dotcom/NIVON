name: NIVON - Preflight privado sem cloud
on:
  pull_request:
    paths:
      - 'src/nivon/terminal_preflight.py'
      - 'src/nivon/terminal_web.py'
      - 'tests/test_terminal_preflight.py'
      - '.github/workflows/terminal-preflight-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Diagnostico e contrato sem SDK, OIDC, SQL ou deploy
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -p 'test_terminal_preflight.py' -v
