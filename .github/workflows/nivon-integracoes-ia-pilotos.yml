name: NIVON - Pilotos P0-P2 sob demanda
on:
  workflow_dispatch:
    inputs:
      capacidade:
        description: "Uma capacidade por execução; escolha diagnostico para nao consumir servicos externos"
        required: true
        type: choice
        default: diagnostico
        options:
          - diagnostico
          - grafo
          - firecrawl
          - pageindex
          - hindsight
          - paperclip
      confirmar_custo_e_envio:
        description: "Autorizo esta unica requisicao externa e possiveis custos do fornecedor"
        required: true
        type: boolean
        default: false
      origem_publica:
        description: "URL HTTPS exata da fonte (somente Firecrawl, dominio aprovado nas variables)"
        required: false
        type: string
      pergunta:
        description: "Consulta curta sem dados pessoais (PageIndex/Hindsight)"
        required: false
        type: string
      pdf_em_docs:
        description: "PDF ja presente em docs/ (somente PageIndex; sem upload automatico)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nivon-piloto-manual-${{ github.ref }}-${{ inputs.capacidade }}
  cancel-in-progress: false

jobs:
  executar-um-piloto:
    if: ${{ inputs.capacidade == 'diagnostico' || inputs.capacidade == 'grafo' || inputs.confirmar_custo_e_envio == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Instalar NIVON sem extras de fornecedores
        run: python -m pip install --no-input -e .
      - name: Instalar dependencia exclusiva do piloto escolhido
        if: ${{ inputs.capacidade == 'pageindex' || inputs.capacidade == 'hindsight' }}
        env:
          NIVON_CAPACIDADE: ${{ inputs.capacidade }}
        run: |
          set -euo pipefail
          if [[ "$NIVON_CAPACIDADE" == pageindex ]]; then
            python -m pip install --no-input 'pageindex==0.4.7'
          elif [[ "$NIVON_CAPACIDADE" == hindsight ]]; then
            python -m pip install --no-input 'hindsight-client==0.10.2'
          fi
      - name: Executar piloto ou diagnostico e escrever evidencias limitadas
        shell: bash
        env:
          NIVON_CAPACIDADE: ${{ inputs.capacidade }}
          NIVON_ORIGEM: ${{ inputs.origem_publica }}
          NIVON_PERGUNTA: ${{ inputs.pergunta }}
          NIVON_DOCUMENTO: ${{ inputs.pdf_em_docs }}
          NIVON_AI_NETWORK_APPROVED: ${{ inputs.confirmar_custo_e_envio }}
          NIVON_AI_EXTERNAL_APPROVED: ${{ inputs.confirmar_custo_e_envio }}
          NIVON_AI_APPROVED_HOSTS: ${{ vars.NIVON_AI_APPROVED_HOSTS }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          NIVON_HINDSIGHT_API_KEY: ${{ secrets.NIVON_HINDSIGHT_API_KEY }}
          NIVON_HINDSIGHT_URL: ${{ vars.NIVON_HINDSIGHT_URL }}
          NIVON_HINDSIGHT_BANK_ID: ${{ vars.NIVON_HINDSIGHT_BANK_ID }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
          NIVON_PAPERCLIP_ORIGEM: ${{ vars.NIVON_PAPERCLIP_ORIGEM }}
          NIVON_PAPERCLIP_COMPANY_ID: ${{ vars.NIVON_PAPERCLIP_COMPANY_ID }}
          OPENAI_API_KEY: ${{ secrets.NIVON_IA_OPENAI_API_KEY }}
          NIVON_PAGEINDEX_MODELO: ${{ vars.NIVON_PAGEINDEX_MODELO }}
          NIVON_PAGEINDEX_CHAT_MODELO: ${{ vars.NIVON_PAGEINDEX_CHAT_MODELO }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nivon-piloto"
          case "$NIVON_CAPACIDADE" in
            diagnostico|grafo|firecrawl|pageindex|hindsight|paperclip) ;;
            *) echo 'CAPACIDADE_NAO_PERMITIDA'; exit 2 ;;
          esac
          python -m nivon.integracoes_ia.pilotos \
            --capacidade "$NIVON_CAPACIDADE" \
            --origem "$NIVON_ORIGEM" \
            --pergunta "$NIVON_PERGUNTA" \
            --arquivo "$NIVON_DOCUMENTO" \
            --saida "$RUNNER_TEMP/nivon-piloto/resultado.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'nivon-piloto'/'resultado.json'
          j=json.loads(p.read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## NIVON - piloto P0-P2\n')
              f.write(f"Capacidade: **{j['capacidade']}** | Modo: **{j['execucao']}**\n\n")
              f.write('**Sem homologacao, publicacao, ingestao BigQuery ou deploy Cloud Run.**\n')
          PY
      - name: Salvar prova sem conteudo de terceiros
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nivon-piloto-${{ inputs.capacidade }}-${{ github.run_id }}
          path: ${{ runner.temp }}/nivon-piloto/resultado.json
          if-no-files-found: error
          retention-days: 7
