name: NIVON - Plano Seguro Primeiro Lote ANTT 2026
on:
  pull_request:
    paths:
      - '.github/workflows/nivon-antt-piloto-readonly.yml'
      - 'src/nivon/antt_gcp_preparar_piloto.py'
      - 'tests/test_antt_gcp_preparar_piloto.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nivon-antt-piloto-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-antt-piloto-planejar
  cancel-in-progress: false

jobs:
  testar-contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testar bloqueios de carga e integridade do staging sem rede
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_antt_gcp_preparar_piloto.py' -v
          python -m unittest discover -s tests -p 'test_antt_gcp_pipeline.py' -v

  planejar-com-dados-antt-reais:
    needs: testar-contrato
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verificar ambiente de origem
        run: |
          set -eu
          test -n "$NIVON_PROJETO" || { echo FALTA_PROJETO; exit 1; }
          test -n "$NIVON_DATASET" || { echo FALTA_DATASET; exit 1; }
          test -n "$NIVON_BUCKET" || { echo FALTA_BUCKET; exit 1; }
      - name: Gerar ADC temporaria com GitHub OIDC (sem chave permanente)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar clientes Google Cloud
        run: |
          python -m pip install --disable-pip-version-check --quiet 'google-cloud-bigquery>=3,<4' 'google-cloud-storage>=3,<4'
      - name: Obter somente arquivo oficial ANTT de 2026
        run: |
          python -m nivon.coleta_antt --inicio 2026 --fim 2026 \
            --destino "$RUNNER_TEMP/antt-stage" --live
      - name: Preparar primeiro lote e inspecionar metadados sem gravar
        run: |
          python -m nivon.antt_gcp_preparar_piloto \
            --staging "$RUNNER_TEMP/antt-stage" \
            --ano 2026 \
            --projeto "$NIVON_PROJETO" \
            --dataset "$NIVON_DATASET" \
            --bucket "$NIVON_BUCKET" \
            --saida "$RUNNER_TEMP/nivon-antt-primeiro-lote-plano.json"
      - name: Registrar resultado sem expor dados brutos
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          arquivo = Path(os.environ['RUNNER_TEMP'])/'nivon-antt-primeiro-lote-plano.json'
          x = json.loads(arquivo.read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('### NIVON — Primeiro lote ferroviário ANTT (plano read-only)\n\n')
              f.write('| Indicador | Valor |\n|---|---|\n')
              for key in ('projeto','dataset','bucket','ano','competencia_maxima_publicada',
                          'bytes_brutos','linhas_ferroviarias','toneladas_uteis_declaradas_no_arquivo',
                          'arquivo_sha256','bigquery_tabela_existe','bigquery_bootstrap_necessario',
                          'gcs_objeto_ja_arquivado','gravacoes_realizadas','jobs_bigquery_criados'):
                  f.write(f'| {key} | {str(x[key])} |\n')
              f.write('\n**Nenhuma escrita Cloud nem job SQL.** Primeiro lote ainda nao gravado.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: nivon-plano-primeiro-lote-antt-${{ github.run_id }}
          path: ${{ runner.temp }}/nivon-antt-primeiro-lote-plano.json
          retention-days: 30
      - name: Descartar staging temporario
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/antt-stage" "$RUNNER_TEMP/nivon-antt-primeiro-lote-plano.json"
