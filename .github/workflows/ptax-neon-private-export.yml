# NIVON: copy PTAX Neon -> BigQuery. Sem variaveis de aprovacao, SOMENTE leitura privada.
# Nenhuma credencial, cotacao ou artifact enviado ao repositório publico.
# O codigo vem de commit imutavel na main; GCP permanece desabilitado por padrao.
name: NIVON PTAX - ponte privada para Google Cloud
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ptax-neon-private-export.yml'
      - 'scripts/ptax_neon_private_export.py'
      - 'tests/test_ptax_neon_bridge_policy.py'
  pull_request:
    paths:
      - '.github/workflows/ptax-neon-private-export.yml'
      - 'scripts/ptax_neon_private_export.py'
      - 'tests/test_ptax_neon_bridge_policy.py'
  workflow_dispatch:
  schedule:
    - cron: '45 23 * * 1-5'
permissions:
  contents: read
concurrency:
  group: nivon-ptax-neon-bigquery
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar ponte privada sem Cloud ou Neon
        run: |
          python -m unittest discover -s tests -p 'test_ptax_neon_bridge_policy.py' -v
          python -m unittest discover -s tests -p 'test_ptax_bcb_workflow_policy.py' -v

  exportar-e-sincronizar:
    needs: validar
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 22
    env:
      NIVON_PTAX_PRIVATE_ENDPOINT: https://br-twilight-cell-b77ukd6x-ptaxbridge.compute.c-13.us-east-1.aws.neon.tech
      NIVON_GCP_WRITE_APPROVED: ${{ vars.NIVON_GCP_WRITE_APPROVED }}
      NIVON_GCP_COST_REVIEWED: ${{ vars.NIVON_GCP_COST_REVIEWED }}
      NIVON_GCP_ENABLED: ${{ vars.NIVON_GCP_WRITE_APPROVED == 'true' && vars.NIVON_GCP_COST_REVIEWED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_PTAX_DIRECT_WRITER_APPROVED != 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Credencial GCP efemera somente depois dos gates
        if: ${{ env.NIVON_GCP_ENABLED == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
      - name: Instalar cliente BigQuery somente quando habilitado
        if: ${{ env.NIVON_GCP_ENABLED == 'true' }}
        run: python -m pip install --disable-pip-version-check google-cloud-bigquery==3.38.0
      - name: Extrair PTAX real, validar BigQuery e sincronizar se autorizado
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/nivon-ptax-source-${{ github.run_id }}.jsonl"
          dst="$RUNNER_TEMP/nivon-ptax-bigquery-${{ github.run_id }}.jsonl"
          trap 'rm -f "$src" "$dst"' EXIT
          umask 077
          if [ "$NIVON_GCP_ENABLED" = "true" ]; then
            # O BigQuery determina o cursor, com rewind de 5.000 IDs.
            after_id="$(python -m scripts.ptax_bigquery_incremental --cursor)"
          else
            after_id=0
            echo 'GCP_OFF: exportacao/validacao sem escrita na nuvem'
          fi
          python -m scripts.ptax_neon_private_export \
            --endpoint "$NIVON_PTAX_PRIVATE_ENDPOINT" \
            --source-jsonl "$src" --target-jsonl "$dst" --after-id "$after_id"
          python -m scripts.ptax_bigquery_incremental --arquivo "$dst"
          if [ "$NIVON_GCP_ENABLED" = "true" ]; then
            python -m scripts.ptax_bigquery_incremental --arquivo "$dst" --executar
          else
            echo 'BIGQUERY_WRITE_BLOCKED_BY_DEFAULT=true'
          fi
