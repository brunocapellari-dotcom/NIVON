name: NIVON - BCB SGS11 para GCS BigQuery com readback

on:
  workflow_dispatch:
  schedule:
    - cron: '35 14 * * 1-5'

permissions:
  contents: read
  id-token: write

concurrency:
  group: nivon-bcb-sgs11-gcp
  cancel-in-progress: false

jobs:
  executar-fonte:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || vars.NIVON_SGS11_E2E_VERIFIED == 'true') && vars.NIVON_SGS11_GCP_WRITE_APPROVED == 'true' && vars.NIVON_RAW_ARCHIVE_APPROVED == 'true' && vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' && vars.NIVON_SGS11_EVIDENCIA_USO != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: nivon-gcp-producao
    env:
      NIVON_SGS11_GCP_WRITE_APPROVED: ${{ vars.NIVON_SGS11_GCP_WRITE_APPROVED }}
      NIVON_RAW_ARCHIVE_APPROVED: ${{ vars.NIVON_RAW_ARCHIVE_APPROVED }}
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_SGS11_EVIDENCIA_USO: ${{ vars.NIVON_SGS11_EVIDENCIA_USO }}
    steps:
      - name: Checkout somente de main sem token persistente
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Autenticação ADC temporária via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar cliente GCP de produção
        run: python -m pip install -e '.[gcp]'
      - name: Coletar SGS11 e confirmar RAW + BigQuery por leitura
        run: python -m nivon.sgs11_gcp --executar
