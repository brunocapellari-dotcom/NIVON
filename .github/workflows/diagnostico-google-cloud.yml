name: NIVON - Diagnostico Google Cloud somente leitura

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nivon-gcp-diagnostico
  cancel-in-progress: false

jobs:
  diagnostico:
    if: ${{ github.ref == 'refs/heads/main' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
    steps:
      - name: Checkout sem token persistente
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar SDKs GCP
        run: python -m pip install -e '.[gcp]'
      - name: Autenticar com identidade efemera OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Validar exclusivamente metadados
        run: |
          set -euo pipefail
          python -m nivon.preflight_google_cloud \
            --projeto "$NIVON_BQ_PROJECT" \
            --dataset "$NIVON_BQ_DATASET" \
            --bucket "$NIVON_GCS_BUCKET" \
            --executar | tee cloud-preflight.json
      - name: Guardar resultado no resumo
        if: success()
        run: |
          echo '## NIVON / Google Cloud: validacao sem gravacao' >> "$GITHUB_STEP_SUMMARY"
          echo 'IAM de GCS, localizacao, identidade ADC e esquema BigQuery conferidos.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Nao realizou upload, job BigQuery, coleta, deploy ou liberacao de custos.' >> "$GITHUB_STEP_SUMMARY"
