name: NIVON — Terminal interno MVP
on:
  pull_request:
    paths:
      - 'src/nivon/terminal_mvp.py'
      - 'src/nivon/mvp_web/**'
      - 'tests/test_terminal_mvp.py'
      - 'infra/google_cloud/Dockerfile.terminal_mvp'
      - 'pyproject.toml'
      - '.github/workflows/terminal-mvp-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrato-e-seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Testar token e bloqueio sem consentimento
        run: python -m unittest discover -s tests -p 'test_terminal_mvp.py' -v
      - name: Conferir integridade e empacotamento das telas
        run: |
          python -m compileall -q src/nivon/terminal_mvp.py
          python - <<'PY'
          import importlib.resources as r
          base=r.files("nivon").joinpath("mvp_web")
          for f in ("index.html","terminal.css","terminal.js"):
              b=base.joinpath(f).read_bytes()
              assert len(b)>50, f
          print("MVP_ASSETS_EMPACOTADOS_OK")
          PY
      - name: Construir container real (sem push ou deploy)
        run: docker build -f infra/google_cloud/Dockerfile.terminal_mvp -t nivon-terminal-ci:${{ github.sha }} .
