name: NIVON — CI transporte ANTT e ANTAQ
on:
  push:
    branches: [feature/transporte-antt-antaq-20261022]
  pull_request:
    paths:
      - 'src/nivon/transporte_multimodal.py'
      - 'src/nivon/coleta_antt.py'
      - 'tests/test_transporte_multimodal.py'
      - 'tests/test_coleta_antt.py'
      - '.github/workflows/transporte-antt-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-transporte-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-e-coleta-pontual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testes de contratos e staging (sem rede)
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_transporte_multimodal.py' -v
          python -m unittest discover -s tests -p 'test_coleta_antt.py' -v
      - name: Prova LIVE pontual ANTT 2026 (nao publica)
        env:
          PYTHONPATH: src
        run: |
          python -m nivon.coleta_antt --inicio 2026 --fim 2026 --destino "${RUNNER_TEMP}/nivon-antt" --live
      - name: Verificar staging e hash de origem
        if: success()
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, os, pathlib, hashlib
          d = pathlib.Path(os.environ["RUNNER_TEMP"]) / "nivon-antt"
          m = json.loads((d / "manifesto-antt.json").read_text())
          a = m["anos"]["2026"]
          raw = (d / "antt-od-2026.csv").read_bytes()
          assert hashlib.sha256(raw).hexdigest() == a["sha256"]
          assert a["registros"] > 0
          assert a["status"] == "STAGING_NAO_HOMOLOGADO"
          print("PROVA_LIVE_RECEBIDA_SEM_HOMOLOGACAO", "ano=2026",
                "registros=", a["registros"], "competencia=", a["competencia_maxima"])
          PY
