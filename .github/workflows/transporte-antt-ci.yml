name: NIVON — CI transporte ANTT e ANTAQ
on:
  push:
    branches: [feature/transporte-antt-antaq-20261022]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-transporte-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-e-coleta-pontual:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testes de contratos e staging (sem rede)
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_transporte_multimodal.py' -v
          python -m unittest discover -s tests -p 'test_coleta_antt.py' -v
      - name: Prova LIVE pontual ANTT 2025 e 2026 (nao publica)
        if: github.event_name == 'workflow_dispatch'
        env:
          PYTHONPATH: src
        run: |
          python -m nivon.coleta_antt --inicio 2025 --fim 2026 --destino "${RUNNER_TEMP}/nivon-antt" --live
      - name: Conciliar staging anual e gerar totais TU/TKU
        if: github.event_name == 'workflow_dispatch'
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from nivon.resumo_antt import consolidar_staging
          d = Path(os.environ["RUNNER_TEMP"]) / "nivon-antt"
          r = consolidar_staging(d, [2025, 2026])
          for ano, info in r["anos"].items():
              print("PROVA_LIVE", "ano=", ano, "registros=", info["registros"],
                    "competencia_maxima=", info["competencia_maxima"],
                    "sha256=", info["sha256"])
          print("TOTAIS_TU_TKU_2025_2026", r["toneladas_uteis"], r["tku_raw"])
          print("TONELADAS_POR_MES", json.dumps(r["por_mes"], ensure_ascii=False))
          print("TONELADAS_UF_ORIGEM_MT", r["por_uf_origem"].get("MT", "NAO_ENCONTRADO"))
          print("MERCADORIAS_TOP_10", json.dumps(list(r["por_mercadoria"].items())[:10], ensure_ascii=False))
          print("VOLUMES_ANUAIS_MT_SOJA_MILHO_FARELO", json.dumps(r["por_ano"], ensure_ascii=False))
          print("ESTADO", r["estado"], "NAO_PUBLICADO_NO_BANCO")
          PY
