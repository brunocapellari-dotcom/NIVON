name: NIVON - Scheduler marítimo pós Cloud Run
on:
  pull_request:
    paths:
      - 'scripts/nivon_maritimo_cloudscheduler.sh'
      - '.github/workflows/maritimo-gcp-cloudscheduler.yml'
  workflow_dispatch:
    inputs:
      autorizar_agendamento:
        type: boolean
        required: true
        default: false
        description: 'Autorizar Scheduler 6h depois do Cloud Run E2E'
permissions:
  contents: read
  id-token: write
concurrency:
  group: nivon-maritimo-cloudscheduler
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Garantir bloqueio antes da habilitação
        run: |
          bash -n scripts/nivon_maritimo_cloudscheduler.sh
          if NIVON_MARITIMO_AGENDAMENTO_AUTORIZADO=false \
             bash scripts/nivon_maritimo_cloudscheduler.sh; then
            echo BLOQUEIO_INOPERANTE
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          data=Path('scripts/nivon_maritimo_cloudscheduler.sh').read_text()
          assert 'CLOUD_RUN_E2E_SEM_SUCESSO_CONFIRMADO' in data
          assert 'scheduler jobs create http' in data
          assert 'services enable' not in data
          assert 'add-iam-policy-binding' not in data
          print('VALIDACAO_FAIL_CLOSED_APROVADA')
          PY
  ativar:
    needs: validar
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.autorizar_agendamento && vars.NIVON_MARITIMO_E2E_CLOUDRUN_CONFIRMADO == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_GCP_REGION: southamerica-east1
      NIVON_SCHEDULER_SA: ${{ vars.NIVON_MARITIMO_SCHEDULER_SA }}
      NIVON_MARITIMO_E2E_CLOUDRUN_CONFIRMADO: ${{ vars.NIVON_MARITIMO_E2E_CLOUDRUN_CONFIRMADO }}
      NIVON_MARITIMO_AGENDAMENTO_AUTORIZADO: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
      - name: Instalar agendamento apenas após E2E e autorização
        run: bash scripts/nivon_maritimo_cloudscheduler.sh
