name: NIVON - Candidato go-live CONAB

on:
  push:
    branches:
      - release/nivon-go-live-conab-20261025
    paths:
      - 'src/nivon/conab_*.py'
      - 'src/nivon/agro_bigquery_*.py'
      - 'sql/bigquery/002_agro_fontes_staging.sql'
      - 'tests/test_agro_bigquery_loader.py'
      - 'src/nivon/auditoria_publicacao_conab.py'
      - 'src/nivon/captura_xlsx_conab.py'
      - 'src/nivon/conciliacao_progresso_stores.py'
      - 'src/nivon/progresso_conab_historico.py'
      - 'src/nivon/registro_snapshots.py'
      - 'src/nivon/transacoes_sqlite.py'
      - 'src/nivon/verificador_bytes_origem.py'
      - 'tests/test_conab_*.py'
      - '.github/workflows/ci-go-live-conab.yml'
  pull_request:
    paths:
      - 'src/nivon/conab_*.py'
      - 'src/nivon/auditoria_publicacao_conab.py'
      - 'src/nivon/captura_xlsx_conab.py'
      - 'src/nivon/conciliacao_progresso_stores.py'
      - 'src/nivon/progresso_conab_historico.py'
      - 'src/nivon/registro_snapshots.py'
      - 'src/nivon/transacoes_sqlite.py'
      - 'src/nivon/verificador_bytes_origem.py'
      - 'tests/test_conab_*.py'

permissions:
  contents: read

concurrency:
  group: nivon-go-live-conab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-captura-historica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validar integracao offline sem network e GCP
        env:
          PYTHONPATH: src
        run: |
          set -eu
          python -m compileall -q src/nivon
          for testfile in \
            test_conab_indice_progresso.py \
            test_conab_fila_publicacoes.py \
            test_conab_resolver_anexo.py \
            test_conab_execucao_edicao.py \
            test_conab_incremental.py \
            test_conab_sync_metadados.py \
            test_conab_gcs_archive.py \
            test_conab_gcp_schema.py \
            test_conab_quarentena_stage.py \
            test_agro_bigquery_loader.py
          do
            python -m unittest discover -s tests -p "$testfile" -v
          done
      - name: Bloqueio de ativacao automatica
        run: |
          test ! -f .github/workflows/conab-autodeploy.yml
          echo 'RELEASE_TESTADO_SEM_DEPLOY_SEM_COLETA_AUTOMATICA'
