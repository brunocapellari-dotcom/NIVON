name: NIVON - PTAX direta Banco Central para BigQuery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ptax-bcb-direto-gcp.yml'
      - 'scripts/ptax_bcb_bigquery_direto.py'
      - 'tests/test_ptax_bcb_bigquery_direto.py'
      - 'tests/test_ptax_bcb_workflow_policy.py'
  pull_request:
    paths:
      - '.github/workflows/ptax-bcb-direto-gcp.yml'
      - '.github/workflows/ptax-neon-private-export.yml'
      - 'scripts/bootstrap_nivon_gcp.sh'
      - 'scripts/ptax_bcb_bigquery_direto.py'
      - 'tests/test_ptax_bcb_workflow_policy.py'
  workflow_dispatch:
  schedule:
    - cron: '20 23 * * 1-5'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verificar contrato do BCB sem rede
        env:
          PYTHONPATH: '.:src'
        run: |
          python -m unittest discover -s tests -p 'test_ptax_bcb_bigquery_direto.py' -v
          python -m unittest discover -s tests -p 'test_ptax_bcb_workflow_policy.py' -v

  consultar_bcb:
    needs: validar
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: nivon-ptax-neon-bigquery
      cancel-in-progress: false
    env:
      NIVON_GCP_WRITE_APPROVED: ${{ vars.NIVON_GCP_WRITE_APPROVED }}
      NIVON_GCP_COST_REVIEWED: ${{ vars.NIVON_GCP_COST_REVIEWED }}
      NIVON_GCP_ENABLED: ${{ vars.NIVON_GCP_WRITE_APPROVED == 'true' && vars.NIVON_GCP_COST_REVIEWED == 'true' && vars.NIVON_PTAX_DIRECT_WRITER_APPROVED == 'true' && vars.NIVON_GCP_WIF_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: WIF somente apos aprovacao de escritor unico
        if: ${{ env.NIVON_GCP_ENABLED == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
      - name: Instalar BigQuery somente quando habilitado
        if: ${{ env.NIVON_GCP_ENABLED == 'true' }}
        run: python -m pip install --disable-pip-version-check google-cloud-bigquery==3.38.0
      - name: Consultar BCB real e carregar apenas com aprovacao
        shell: bash
        env:
          PYTHONPATH: '.:src'
        run: |
          set -euo pipefail
          umask 077
          file="$RUNNER_TEMP/nivon-ptax-bcb-${{ github.run_id }}.jsonl"
          trap 'rm -f "$file"' EXIT
          args=(--arquivo "$file" --dias 10)
          if [ "$NIVON_GCP_ENABLED" = "true" ]; then
            args+=(--carregar)
          else
            echo 'PTAX_BCB_READ_ONLY=true; BIGQUERY_WRITE_BLOCKED_BY_DEFAULT=true'
          fi
          python -m scripts.ptax_bcb_bigquery_direto "${args[@]}"
