name: NIVON - Fontes complementares Google Cloud CONAB SGS

on:
  schedule:
    - cron: '55 13 * * 1-5'
  workflow_dispatch:
    inputs:
      fonte:
        type: choice
        required: true
        default: BCB_SGS
        options:
          - BCB_SGS
          - CONAB_SICARM

permissions:
  contents: read
  id-token: write

concurrency:
  group: nivon-gcp-complementar-conab-sgs
  cancel-in-progress: false

jobs:
  coletar:
    if: ${{ github.ref == 'refs/heads/main' && vars.NIVON_GCP_OPERACIONAL_APROVADO == 'true' && vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' && vars.NIVON_GCP_RIGHTS_EVIDENCE != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIVON_GCP_OPERACIONAL_APROVADO: ${{ vars.NIVON_GCP_OPERACIONAL_APROVADO }}
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_GCP_RIGHTS_EVIDENCE: ${{ vars.NIVON_GCP_RIGHTS_EVIDENCE }}
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_GCS_BUCKET_PRIVADO_VERIFICADO: ${{ vars.NIVON_GCS_BUCKET_PRIVADO_VERIFICADO }}
      NIVON_FONTE_BCB_SGS_TAXA_SELIC_DIARIA_ATIVA: ${{ vars.NIVON_FONTE_BCB_SGS_TAXA_SELIC_DIARIA_ATIVA }}
      NIVON_FONTE_CONAB_ARMAZENS_CAPACIDADE_ATIVA: ${{ vars.NIVON_FONTE_CONAB_ARMAZENS_CAPACIDADE_ATIVA }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar cliente cloud do NIVON
        run: python -m pip install -e '.[gcp]'
      - name: Workload Identity Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Coletar fontes habilitadas
        env:
          FONTE: ${{ inputs.fonte || 'BCB_SGS' }}
        run: |
          set -euo pipefail
          if [ "$FONTE" = "BCB_SGS" ]; then
            if [ "$NIVON_FONTE_BCB_SGS_TAXA_SELIC_DIARIA_ATIVA" = "true" ]; then
              python scripts/coletar_sgs_google_cloud.py --executar
            fi
          elif [ "$FONTE" = "CONAB_SICARM" ]; then
            if [ "$NIVON_FONTE_CONAB_ARMAZENS_CAPACIDADE_ATIVA" = "true" ]; then
              python -m nivon.coletor_conab_sicarm_gcp --executar
            fi
          else
            echo 'Fonte fora do menu' >&2
            exit 2
          fi
