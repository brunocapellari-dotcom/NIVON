name: NIVON - Backfill historico por ano
on:
  workflow_dispatch:
    inputs:
      fonte:
        description: Fonte oficial a recuperar
        required: true
        type: choice
        options:
          - BR_CCEE_PLD
          - CAN_GRAINS_WEEKLY
      inicio:
        description: Ano inicial (CCEE desde 2021)
        required: true
        type: number
      fim:
        description: Ano final (maximo 5 anos por lote)
        required: true
        type: number
permissions:
  contents: read
  id-token: write
concurrency:
  group: nivon-backfill-historico
  cancel-in-progress: false
jobs:
  backfill:
    if: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_RAW_ARCHIVE_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NIVON_RECOVERABLE_STAGE_APPROVED: ${{ vars.NIVON_RECOVERABLE_STAGE_APPROVED }}
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_BACKFILL_FONTE: ${{ inputs.fonte }}
      NIVON_BACKFILL_INICIO: ${{ inputs.inicio }}
      NIVON_BACKFILL_FIM: ${{ inputs.fim }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
      - run: python -m pip install -e '.[gcp]'
      - name: Recuperar historico, preservar RAW GCS, inserir BigQuery
        run: |
          args=()
          if [[ "$NIVON_RECOVERABLE_STAGE_APPROVED" == "true" ]]; then args+=(--arquivar-recuperacao); fi
          python -m scripts.backfill_fontes_cloud --fonte "$NIVON_BACKFILL_FONTE" --inicio "$NIVON_BACKFILL_INICIO" --fim "$NIVON_BACKFILL_FIM" --projeto "$NIVON_BQ_PROJECT" --dataset "$NIVON_BQ_DATASET" --bucket "$NIVON_GCS_BUCKET" --executar "${args[@]}"
