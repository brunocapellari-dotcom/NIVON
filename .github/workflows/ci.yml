name: NIVON - CI unico

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nivon-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Obter codigo sem manter token Git
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Verificar contratos finais F2/F3/F4
        shell: bash
        run: |
          set -euo pipefail
          for arquivo in \
            requirements/ci.lock \
            infra/google_cloud/Dockerfile.terminal \
            infra/google_cloud/Dockerfile.coletor \
            config/fontes.yaml \
            scripts/auditar_publicacao_restrita.py; do
              if [[ ! -f "$arquivo" ]]; then
                echo "::error::DEPENDENCIA_NAO_ENTREGUE: $arquivo"
                exit 1
              fi
          done
          echo 'CONTRATOS_F2_F3_F4_PRESENTES'

      - name: Instalar dependencias travadas do CI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements/ci.lock
          python -m pip install --disable-pip-version-check --no-deps -e .
          python - <<'PY'
          import importlib.util
          for modulo in ('pytest', 'ruff', 'yaml', 'nivon'):
              assert importlib.util.find_spec(modulo), f"Dependencia ausente: {modulo}"
          PY

      - name: Checar sintaxe de todos os pacotes Python
        run: python -m compileall -q src scripts tests

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Pytest
        run: python -m pytest -q tests

      - name: Bloquear publicacao de serie restrita em artefatos
        run: python scripts/auditar_publicacao_restrita.py --catalogo config/fontes.yaml

      - name: Build do terminal sem credenciais
        run: docker build --file infra/google_cloud/Dockerfile.terminal --tag nivon-terminal:ci .

      - name: Smoke HTTP local do terminal sem acessar Google Cloud
        shell: bash
        run: |
          set -euo pipefail
          contenedor="$(docker run --rm --detach --publish 127.0.0.1:18080:8080 \
            --env PORT=8080 nivon-terminal:ci)"
          trap 'docker logs "$contenedor" || true; docker rm -f "$contenedor" >/dev/null 2>&1 || true' EXIT
          pronto=0
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:18080/healthz >/dev/null; then
              pronto=1
              break
            fi
            sleep 1
          done
          if [[ "$pronto" != 1 ]]; then
            echo '::error::Terminal nao respondeu HTTP 200 no /healthz local sem credenciais.'
            exit 1
          fi
          echo 'TERMINAL_LOCAL_SMOKE=OK'

      - name: Build e smoke offline do coletor
        shell: bash
        run: |
          set -euo pipefail
          docker build --file infra/google_cloud/Dockerfile.coletor --tag nivon-coletor:ci .
          docker run --rm --network none --entrypoint python nivon-coletor:ci \
            -c 'import nivon.carga; import nivon.fontes; print("COLETOR_OFFLINE_IMPORT_OK")'

      - name: Sumario de testes
        if: success()
        shell: bash
        run: |
          echo '### NIVON — CI único' >> "$GITHUB_STEP_SUMMARY"
          echo 'Python 3.11, Ruff, pytest, sintaxe, publicações, builds e smoke sem credenciais: OK.' >> "$GITHUB_STEP_SUMMARY"
          echo 'CI verde NÃO comprova IAM, dados atualizados, preço de consulta ou deploy em produção.' >> "$GITHUB_STEP_SUMMARY"
