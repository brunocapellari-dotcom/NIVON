name: NIVON - ANTT Rodovia RGI 2025 para Google Cloud
on:
  pull_request:
    paths:
      - '.github/workflows/nivon-antt-rodovia-rgi-carga-unica.yml'
      - 'src/nivon/antt_rodovia_rgi_gcp.py'
      - 'tests/test_antt_rodovia_rgi_gcp.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nivon-antt-rodovia-rgi-carga-unica.yml'
  workflow_dispatch:
    inputs:
      confirmar_carga_unica:
        type: boolean
        default: false
        required: true
        description: 'Importar uma vez somente os 16 fluxos RGI ANTT de 2025'

permissions:
  contents: read

concurrency:
  group: nivon-rgi-rodovia-2025-uma-vez
  cancel-in-progress: false

jobs:
  validar-contratos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compilar e testar sem acesso externo
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/nivon/antt_rodovia_rgi_gcp.py
          python -m unittest discover -s tests -p 'test_antt_rodovia_rgi_gcp.py' -v
          python -m unittest discover -s tests -p 'test_antt_anuario_rgi.py' -v

  coleta-real-top16:
    needs: validar-contratos
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.confirmar_carga_unica == true))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Confinar projeto dataset e bucket
        run: |
          set -euo pipefail
          test "$NIVON_PROJETO" = 'nivon-data'
          test "$NIVON_DATASET" = 'nivon_raw'
          test "$NIVON_BUCKET" = 'nivon-data-raw-2026'
      - name: Identidade GCP curta via OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar biblioteca Google Cloud e parser PDF fixado
        run: |
          python -m pip install --disable-pip-version-check --quiet 'google-cloud-bigquery>=3,<4' 'google-cloud-storage>=3,<4'
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Coletar PDF oficial RGI 2025 uma unica vez arquivar e conciliar
        run: |
          python -m nivon.antt_rodovia_rgi_gcp \
            --live --confirmar-carga-unica \
            --saida "$RUNNER_TEMP/antt-rgi-rodovia-2025-prova.json"
      - name: Exibir somente evidencias e limite dos recortes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ["RUNNER_TEMP"])/"antt-rgi-rodovia-2025-prova.json"
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["estado"]=="ANTT_RGI_TOP16_2025_CONCILIADO"
          assert j["registros"]==16 and not j["produto_identificado"]
          print("PROVA_ANTT_RODOVIA_RGI",json.dumps(j,ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### NIVON: Anuário TRC 2025 — Top-16 fluxos RGI\n\n")
              f.write(f"16 fluxos, {j['toneladas_top16']} toneladas anuais no recorte limitado.\n\n")
              f.write(f"Arquivo SHA-256: {j['sha256_pdf']}\n\n")
              f.write(f"GCS: {j['gcs_estado']} | BQ: {j['bq_estado']}\n\n")
              f.write("**Não é matriz rodoviária integral; não identifica produtos, terminal ou transbordo. Não somar a ferrovia.**\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: nivon-antt-rodovia-top16-2025-${{ github.run_id }}
          path: ${{ runner.temp }}/antt-rgi-rodovia-2025-prova.json
          retention-days: 90
      - name: Limpar relatorio e temporarios
        if: always()
        run: rm -f "$RUNNER_TEMP/antt-rgi-rodovia-2025-prova.json"
