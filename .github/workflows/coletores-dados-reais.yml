name: NIVON - Coletores reais e historico RAW
on:
  pull_request:
    paths:
      - 'src/nivon/coletores_dados_reais.py'
      - 'src/nivon/ingestao_fontes_reais.py'
      - 'tests/test_coletores_dados_reais.py'
      - '.github/workflows/coletores-dados-reais.yml'
  workflow_dispatch:
    inputs:
      live_smoke:
        description: 'Testar HTTP ao vivo das fontes publicas (sem persistir dados)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  contract-and-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Testar coletores e persistencia local
        run: python -m unittest discover -s tests -p 'test_coletores_dados_reais.py' -v
      - name: Testar sintaxe dos adaptadores
        run: python -m compileall -q src/nivon/coletores_dados_reais.py src/nivon/ingestao_fontes_reais.py
