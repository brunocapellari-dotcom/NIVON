name: Diagnostico HTTP fontes gratuitas (pontual)

on:
  push:
    branches:
      - feat/fontes-gratuitas-ckan-apis-20261021
    paths:
      - .github/workflows/diagnostico-fontes-gratuitas.yml
  workflow_dispatch:
    inputs:
      modo:
        description: "Diagnostico de cabecalho ou arquivo ZARC integral"
        type: choice
        required: true
        default: cabecalho
        options:
          - cabecalho
          - integral

permissions:
  contents: read

jobs:
  smoke-pontual:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Diagnostico de dados gratuitos sem persistencia
        env:
          PYTHONPATH: src
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.modo }}" == "integral" ]]; then
            python scripts/diagnostico_zarc_stream_mt.py --executar
          else
            python -m nivon.diagnostico_zarc_prefixo --executar --limite-bytes 8192
          fi
