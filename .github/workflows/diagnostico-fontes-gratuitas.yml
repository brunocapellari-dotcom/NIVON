name: Diagnostico HTTP fontes gratuitas (pontual)
# Quinta prova: inspecionar schema CSV ZARC sem expor registros.
# Terceira prova: evidência de regras recusar sem expor URLs.
# Segunda prova: classificação de erro SICOR e amostra CSV ZARC publicada.

on:
  push:
    branches:
      - feat/fontes-gratuitas-ckan-apis-20261021
    paths:
      - .github/workflows/diagnostico-fontes-gratuitas.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-pontual:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Diagnostico controlado de quatro GET publicos
        env:
          PYTHONPATH: src
        run: python scripts/diagnostico_http_fontes_gratuitas.py --executar --fonte ZARC_PREFIX_2026_2027
