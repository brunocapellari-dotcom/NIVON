name: CI ANP PPI (offline)
on:
  push:
    paths:
      - "src/nivon/anp_ppi.py"
      - "tests/test_anp_ppi.py"
      - "scripts/operar_fontes_reais.py"
      - ".github/workflows/ci-anp-ppi.yml"
  pull_request:
    paths:
      - "src/nivon/anp_ppi.py"
      - "tests/test_anp_ppi.py"
      - "scripts/operar_fontes_reais.py"
      - ".github/workflows/ci-anp-ppi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ppi:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências locais para parser XLSX
        run: python -m pip install -e '.[excel]' pytest
      - name: Testes offline PPI ANP
        run: python -m pytest tests/test_anp_ppi.py -q
