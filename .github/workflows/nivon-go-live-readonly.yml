name: NIVON - Go Live inventario GCP somente leitura

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nivon-go-live-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verificar-ambiente:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Exigir variaveis ja existentes sem imprimir credenciais
        env:
          WIF: ${{ vars.NIVON_GCP_PROVIDER }}
          ID: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
          DATASET: ${{ vars.NIVON_BQ_DATASET }}
          BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          for v in WIF ID PROJETO DATASET BUCKET; do
            if [[ -z "${!v}" ]]; then
              echo "FALTA_CONFIGURACAO_$v"
              exit 2
            fi
          done
          echo "CONFIGURACAO_GCP_PRESENTE"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Autenticar somente para metadados via OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar clientes readonly
        run: python -m pip install --quiet --disable-pip-version-check 'google-cloud-bigquery>=3,<4' 'google-cloud-storage>=2.18,<4'
      - name: Verificar METADADOS do piloto ferroviario sem SQL ou mutacao
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python scripts/verificar_golive_gcp_readonly.py --executar > "$RUNNER_TEMP/nivon-readiness.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'nivon-readiness.json').read_text())
          assert r['estado']=='PILOTO_DADOS_READONLY_PRONTO'
          assert r['consultas_sql_executadas']==0
          assert not r['libera_deploy'] and not r['libera_whatsapp']
          print('NIVON_GOLIVE_PILOTO_READONLY='+json.dumps(r,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write('### NIVON — dados do piloto ANTT (somente metadados)\n\n')
              out.write('Estado: '+r['estado']+'\n\n')
              out.write('Stage Agro: '+r['stage_agro']+' — separado do piloto ferroviário.\n\n')
              out.write('Cloud Run: não verificado. Nenhum deploy autorizado.\n')
          PY
