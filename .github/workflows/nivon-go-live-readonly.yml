name: NIVON - Go Live inventario GCP somente leitura

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nivon-go-live-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verificar-ambiente:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Exigir variaveis ja existentes sem imprimir credenciais
        env:
          WIF: ${{ vars.NIVON_GCP_PROVIDER }}
          ID: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
          DATASET: ${{ vars.NIVON_BQ_DATASET }}
          BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          for v in WIF ID PROJETO DATASET BUCKET; do
            if [[ -z "${!v}" ]]; then
              echo "FALTA_CONFIGURACAO_$v"
              exit 2
            fi
          done
          echo "CONFIGURACAO_GCP_PRESENTE"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Autenticar somente para metadados via OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar clientes readonly
        run: python -m pip install --quiet --disable-pip-version-check 'google-cloud-bigquery>=3,<4' 'google-cloud-storage>=2.18,<4'
      - name: Verificar dataset bucket e tabela staging sem criar recursos
        env:
          PYTHONPATH: src
          NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
          NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
          NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
        run: |
          python - <<'PY'
          import os,json,sys
          from google.cloud import bigquery,storage
          from google.api_core.exceptions import NotFound
          from nivon.agro_bigquery_loader import _TIPOS
          project=os.environ['NIVON_BQ_PROJECT']
          dataset=os.environ['NIVON_BQ_DATASET']
          bucketname=os.environ['NIVON_GCS_BUCKET']
          bq=bigquery.Client(project=project)
          ds=bq.get_dataset(f'{project}.{dataset}')
          bucket=storage.Client(project=project).get_bucket(bucketname)
          result={'status':'METADADOS_AUTENTICADOS_READONLY',
                  'dataset_regiao':str(ds.location).lower(),
                  'bucket_regiao':str(bucket.location).lower(),
                  'tabela_agro_fonte_stage':None}
          if result['dataset_regiao']!='southamerica-east1' or result['bucket_regiao']!='southamerica-east1':
              print(json.dumps({**result,'status':'BLOQUEIO_REGIAO'}))
              sys.exit(3)
          try:
              tbl=bq.get_table(f'{project}.{dataset}.agro_fonte_stage')
          except NotFound:
              result['tabela_agro_fonte_stage']='AUSENTE'
              print(json.dumps(result,sort_keys=True))
              sys.exit(4)
          cols={f.name:f.field_type.upper() for f in tbl.schema}
          p=getattr(tbl,'time_partitioning',None)
          valido=(cols==_TIPOS and p is not None and p.field=='coletado_utc')
          result['tabela_agro_fonte_stage']='SCHEMA_OK' if valido else 'SCHEMA_DIVERGENTE'
          print(json.dumps(result,sort_keys=True))
          if not valido:sys.exit(5)
          PY
