name: NIVON - Ativar dois destinos BigQuery para coletores

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'false = verificar; true = criar apenas tabelas ausentes (gates obrigatórios)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: nivon-bootstrap-bigquery-dois-destinos
  cancel-in-progress: false

jobs:
  bootstrap-controlado:
    if: ${{ github.ref == 'refs/heads/main' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nivon-gcp-producao
    env:
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_BQ_BOOTSTRAP_TABLE_APPROVED: ${{ vars.NIVON_BQ_BOOTSTRAP_TABLE_APPROVED }}
      NIVON_AGRO_STAGING_SCHEMA_APPROVED: ${{ vars.NIVON_AGRO_STAGING_SCHEMA_APPROVED }}
      NIVON_AGRO_GCP_WRITE_APPROVED: ${{ vars.NIVON_AGRO_GCP_WRITE_APPROVED }}
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_APLICAR: ${{ inputs.aplicar }}
    steps:
      - name: Impedir criação sem aprovação dos dois contratos e orçamento
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NIVON_APLICAR" == 'true' ]]; then
            test "$NIVON_BQ_BOOTSTRAP_TABLE_APPROVED" == 'true'
            test "$NIVON_AGRO_STAGING_SCHEMA_APPROVED" == 'true'
            test "$NIVON_AGRO_GCP_WRITE_APPROVED" == 'true'
            test "$NIVON_ZERO_COST_BQ_APPROVED" == 'true'
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar SDK Google Cloud
        run: python -m pip install -e '.[gcp]'
      - name: Verificar ou criar somente tabelas de dados no dataset existente
        shell: bash
        run: |
          set -euo pipefail
          args=(--projeto "$NIVON_BQ_PROJECT" --dataset "$NIVON_BQ_DATASET" --bucket "$NIVON_GCS_BUCKET" --executar-preflight)
          if [[ "$NIVON_APLICAR" == 'true' ]]; then args+=(--aplicar); fi
          python -m nivon.bootstrap_tabelas_gcp "${args[@]}" | tee estado-tabelas.json
      - name: Registrar que o bootstrap não é carga de dados
        if: success()
        run: |
          echo '### NIVON — Esquemas do BigQuery conferidos' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verificadas/criadas apenas nivon_observacoes e agro_publicacoes_staging.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sem upload RAW, sem MERGE, sem consultas analíticas nem dados públicos publicados.' >> "$GITHUB_STEP_SUMMARY"
