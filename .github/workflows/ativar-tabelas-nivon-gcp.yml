name: NIVON - Ativar dois destinos BigQuery para coletores

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'false = verificar; true = criar apenas tabelas ausentes (gates obrigatórios)'
        type: boolean
        required: true
        default: false
      primeira_fonte:
        description: 'Primeira carga REAL opcional após validar/criar tabelas; exige gates individuais'
        type: choice
        required: true
        default: NENHUMA
        options:
          - NENHUMA
          - BCB_SGS11
          - IMEA
          - CONAB
          - CEPEA_SOJA
          - CEPEA_MILHO

permissions:
  contents: read
  id-token: write

concurrency:
  group: nivon-bootstrap-bigquery-dois-destinos
  cancel-in-progress: false

jobs:
  bootstrap-controlado:
    if: ${{ github.ref == 'refs/heads/main' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nivon-gcp-producao
    env:
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_BQ_BOOTSTRAP_TABLE_APPROVED: ${{ vars.NIVON_BQ_BOOTSTRAP_TABLE_APPROVED }}
      NIVON_AGRO_STAGING_SCHEMA_APPROVED: ${{ vars.NIVON_AGRO_STAGING_SCHEMA_APPROVED }}
      NIVON_AGRO_GCP_WRITE_APPROVED: ${{ vars.NIVON_AGRO_GCP_WRITE_APPROVED }}
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_APLICAR: ${{ inputs.aplicar }}
      NIVON_PRIMEIRA_FONTE: ${{ inputs.primeira_fonte }}
      NIVON_RAW_ARCHIVE_APPROVED: ${{ vars.NIVON_RAW_ARCHIVE_APPROVED }}
      NIVON_AGRO_STAGING_BIGQUERY_APPROVED: ${{ vars.NIVON_AGRO_STAGING_BIGQUERY_APPROVED }}
      NIVON_SGS11_GCP_WRITE_APPROVED: ${{ vars.NIVON_SGS11_GCP_WRITE_APPROVED }}
      NIVON_SGS11_EVIDENCIA_USO: ${{ vars.NIVON_SGS11_EVIDENCIA_USO }}
      NIVON_IMEA_FONTE_AUTORIZADA: ${{ vars.NIVON_IMEA_FONTE_AUTORIZADA }}
      NIVON_CONAB_FONTE_AUTORIZADA: ${{ vars.NIVON_CONAB_FONTE_AUTORIZADA }}
      NIVON_CEPEA_FONTE_AUTORIZADA: ${{ vars.NIVON_CEPEA_FONTE_AUTORIZADA }}
      NIVON_CEPEA_HOMOLOGACAO_APROVADA: ${{ vars.NIVON_CEPEA_HOMOLOGACAO_APROVADA }}
    steps:
      - name: Impedir criação sem aprovação dos dois contratos e orçamento
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NIVON_APLICAR" == 'true' ]]; then
            test "$NIVON_BQ_BOOTSTRAP_TABLE_APPROVED" == 'true'
            test "$NIVON_AGRO_STAGING_SCHEMA_APPROVED" == 'true'
            test "$NIVON_AGRO_GCP_WRITE_APPROVED" == 'true'
            test "$NIVON_ZERO_COST_BQ_APPROVED" == 'true'
          fi
      - name: Validar autorização individual ANTES da autenticação e qualquer carga
        shell: bash
        run: |
          set -euo pipefail
          case "$NIVON_PRIMEIRA_FONTE" in
            NENHUMA) ;;
            BCB_SGS11)
              [[ "$NIVON_APLICAR" == "true" &&
                 "$NIVON_SGS11_GCP_WRITE_APPROVED" == "true" &&
                 -n "$NIVON_SGS11_EVIDENCIA_USO" ]] ;;
            IMEA)
              [[ "$NIVON_APLICAR" == "true" &&
                 "$NIVON_IMEA_FONTE_AUTORIZADA" == "true" &&
                 "$NIVON_AGRO_STAGING_BIGQUERY_APPROVED" == "true" ]] ;;
            CONAB)
              [[ "$NIVON_APLICAR" == "true" &&
                 "$NIVON_CONAB_FONTE_AUTORIZADA" == "true" &&
                 "$NIVON_AGRO_STAGING_BIGQUERY_APPROVED" == "true" ]] ;;
            CEPEA_SOJA|CEPEA_MILHO)
              [[ "$NIVON_APLICAR" == "true" &&
                 "$NIVON_CEPEA_FONTE_AUTORIZADA" == "true" &&
                 "$NIVON_CEPEA_HOMOLOGACAO_APROVADA" == "true" ]] ;;
            *) echo "FONTE_NAO_PERMITIDA" >&2; exit 2 ;;
          esac
          if [[ "$NIVON_PRIMEIRA_FONTE" != "NENHUMA" ]]; then
            [[ "$NIVON_RAW_ARCHIVE_APPROVED" == "true" &&
               "$NIVON_ZERO_COST_BQ_APPROVED" == "true" ]]
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar SDK Google Cloud
        run: python -m pip install -e '.[gcp]'
      - name: Verificar ou criar somente tabelas de dados no dataset existente
        shell: bash
        run: |
          set -euo pipefail
          args=(--projeto "$NIVON_BQ_PROJECT" --dataset "$NIVON_BQ_DATASET" --bucket "$NIVON_GCS_BUCKET" --executar-preflight)
          if [[ "$NIVON_APLICAR" == 'true' ]]; then args+=(--aplicar); fi
          python -m nivon.bootstrap_tabelas_gcp "${args[@]}" | tee estado-tabelas.json
      - name: Registrar diagnóstico do bootstrap
        if: success()
        run: |
          echo '### NIVON — Esquemas do BigQuery conferidos' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verificadas/criadas apenas nivon_observacoes e agro_publicacoes_staging.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A etapa de bootstrap não realiza upload, MERGE ou publicação; primeira carga ocorre em passo separado se autorizada.' >> "$GITHUB_STEP_SUMMARY"
      - name: Primeira carga única em Cloud depois do bootstrap validado
        if: ${{ inputs.aplicar && inputs.primeira_fonte != 'NENHUMA' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$NIVON_PRIMEIRA_FONTE" in
            BCB_SGS11)
              python -m nivon.sgs11_gcp --executar ;;
            IMEA|CONAB)
              NIVON_AGRO_FONTE_AUTORIZADA=true \
                python scripts/coletar_agro_google_cloud.py \
                  --fonte "$NIVON_PRIMEIRA_FONTE" \
                  --base "data/nivon/ativacao/$NIVON_PRIMEIRA_FONTE" \
                  --executar --gcs --staging-bigquery ;;
            CEPEA_SOJA|CEPEA_MILHO)
              NIVON_AGRO_FONTE_AUTORIZADA=true \
                python scripts/coletar_agro_google_cloud.py \
                  --fonte "$NIVON_PRIMEIRA_FONTE" \
                  --base "data/nivon/ativacao/$NIVON_PRIMEIRA_FONTE" \
                  --executar --gcs --homologar-cepea --bigquery ;;
            *) exit 2 ;;
          esac
      - name: Resumo de operação, distinto do bootstrap
        if: success()
        run: |
          echo '### NIVON - Ativacao e primeira fonte' >> "$GITHUB_STEP_SUMMARY"
          echo "Fonte solicitada: $NIVON_PRIMEIRA_FONTE" >> "$GITHUB_STEP_SUMMARY"
          echo 'O sucesso dos coletores exige confirmação específica da gravação conforme seu contrato.' >> "$GITHUB_STEP_SUMMARY"

