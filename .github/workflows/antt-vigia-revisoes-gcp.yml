name: NIVON - Vigia de revisoes ferroviarias ANTT
on:
  pull_request:
    paths:
      - '.github/workflows/antt-vigia-revisoes-gcp.yml'
      - 'src/nivon/antt_vigia_revisoes.py'
      - 'tests/test_antt_vigia_revisoes.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/antt-vigia-revisoes-gcp.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1'

permissions:
  contents: read

concurrency:
  group: nivon-antt-vigia-revisoes
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testar comparacao de revisoes sem rede nem GCP
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_antt_vigia_revisoes.py' -v

  comparar_fonte:
    needs: testes
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Limitar escopo antes da autenticacao
        run: |
          set -euo pipefail
          test "$NIVON_PROJETO" = 'nivon-data'
          test "$NIVON_DATASET" = 'nivon_raw'
      - name: Credencial de curta duracao para leitura
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Biblioteca de consulta BigQuery
        run: python -m pip install --disable-pip-version-check --quiet 'google-cloud-bigquery>=3,<4'
      - name: Coletar apenas anos atuais oficiais em staging descartavel
        run: |
          python - <<'PY'
          import os,subprocess
          from datetime import datetime,timezone
          ano=datetime.now(timezone.utc).year
          if ano < 2026 or ano > 2100:
              raise RuntimeError('ano fora da janela esperada')
          anos=[ano-1,ano]
          root=os.path.join(os.environ['RUNNER_TEMP'],'antt-vigia')
          subprocess.run(['python','-m','nivon.coleta_antt',
              '--inicio',str(anos[0]),'--fim',str(anos[-1]),
              '--destino',root,'--live','--usar-url-verificada-contingencia'],check=True)
          subprocess.run(['python','-m','nivon.antt_vigia_revisoes',
              '--staging',root,'--anos',*[str(x) for x in anos],
              '--projeto',os.environ['NIVON_PROJETO'],
              '--dataset',os.environ['NIVON_DATASET'],
              '--saida',os.path.join(os.environ['RUNNER_TEMP'],'antt-revisoes-status.json')],check=False)
          PY
      - name: Classificar divergencias e registrar evidencia
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'antt-revisoes-status.json'
          if not p.is_file():
              raise RuntimeError('VIGIA_SEM_RELATORIO; possivel erro de fonte ou permissao')
          r=json.loads(p.read_text(encoding='utf-8'))
          print('ESTADO_VIGIA_ANTT',r['estado'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('### ANTT: comparacao de revisoes com BigQuery (sem escrita)\n\n')
              f.write('| Ano | Resultado | SHA fonte | SHA BQ | Competencia fonte |\n|---|---|---|---|---|\n')
              for x in r['resultados']:
                  f.write(f"| {x['ano']} | {x['estado']} | {x['arquivo_sha256_fonte'][:12]} | {(x['arquivo_sha256_bq'] or '')[:12]} | {x['competencia_fonte']} |\n")
          if r['estado']!='FONTES_SEM_REVISAO_PENDENTE':
              raise RuntimeError('ANTT_REVISAO_OU_DIVERGENCIA_EXIGE_AVALIACAO_SEM_CARGA')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nivon-antt-vigia-revisoes-${{ github.run_id }}
          path: ${{ runner.temp }}/antt-revisoes-status.json
          if-no-files-found: warn
          retention-days: 30
      - name: Apagar CSV bruto temporario
        if: always()
        run: rm -rf "$RUNNER_TEMP/antt-vigia" "$RUNNER_TEMP/antt-revisoes-status.json"
