name: Neon PTAX - bloqueio de invocacao HTTP externa
on:
  push:
    paths:
      - '.github/workflows/ptax-neon-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Public client cannot spoof a Neon trigger
        env:
          URL: https://br-twilight-cell-b77ukd6x-ptaxcollector.compute.c-13.us-east-1.aws.neon.tech/
        run: |
          code=$(curl --silent --show-error --max-time 35 \
            --output "$RUNNER_TEMP/response.json" \
            --write-out "%{http_code}" --request POST \
            --header "x-neon-trigger-invocation-id: spoofed" \
            --header "Content-Type: application/json" \
            --data '{}' "$URL")
          test "$code" = 403 || { echo "Expected 403, received $code"; exit 1; }
          grep -q 'FORBIDDEN' "$RUNNER_TEMP/response.json"
          echo "Public invocation blocked as expected (403)."
