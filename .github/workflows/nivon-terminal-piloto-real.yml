name: NIVON - Gate real do terminal privado
on:
  pull_request:
    paths:
      - '.github/workflows/nivon-terminal-piloto-real.yml'
      - 'tests/test_golive_readiness_workflow.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nivon-terminal-piloto-real.yml'
      - 'tests/test_golive_readiness_workflow.py'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: nivon-terminal-readiness
  cancel-in-progress: false
jobs:
  validar-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testar politica de checkout e de publicacao
        run: python -m unittest discover -s tests -p 'test_golive_readiness_workflow.py' -v
  piloto-real:
    needs: validar-preflight
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.NIVON_TERMINAL_READ_APPROVED == 'true' && vars.NIVON_GCP_COST_REVIEWED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
    steps:
      - name: Validar destino e acesso de custo limitado
        run: |
          test "$NIVON_BQ_PROJECT" = "nivon-data" || { echo 'GCP_PROJECT_NOT_APPROVED'; exit 1; }
          test "$NIVON_BQ_DATASET" = "nivon_raw" || { echo 'GCP_DATASET_NOT_APPROVED'; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Avalia o mesmo commit da main que disparou o workflow; sem SHA legado.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testar API, isolamento e comportamento sem dados fabricados
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m unittest discover -s tests -p 'test_terminal_web.py' -v
          python -m compileall -q src/nivon/terminal_web.py
      - name: Autenticar na nuvem com identidade temporaria
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Consultar serie ANTT realmente armazenada no BigQuery
        run: |
          python -m pip install --disable-pip-version-check -e '.[gcp]'
          python - <<'PY'
          import json
          from nivon.terminal_web import consultar_ferrovia,LIMITE_BYTES
          assert LIMITE_BYTES <= 250_000_000
          result=consultar_ferrovia()
          assert result['estado']=='ANTT_SERIE_OBSERVADA_DECLARADA'
          assert result['anos']>=20
          assert result['ultima_competencia'][:4] == '2026'
          assert result['homologacao_editorial'] is False
          assert result['soma_multimodal_permitida'] is False
          bytes_used=result['bytes_processados_ultimo_job']
          if bytes_used is not None and (bytes_used<0 or bytes_used>LIMITE_BYTES):
              raise SystemExit('CUSTO_BQ_FORA_DO_LIMITE')
          output={'estado':'LEITURA_BIGQUERY_VALIDADA','anos':result['anos'],
                  'ultima_competencia':result['ultima_competencia'],
                  'bytes_processados':bytes_used,
                  'terminal_em_producao':False,
                  'valores_sinteticos_publicados':False}
          print('NIVON_TERMINAL_GATE='+json.dumps(output,ensure_ascii=False))
          PY
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
      - name: Identificar servico de hospedagem privado ja existente (somente leitura)
        run: |
          python - <<'PY'
          import json,subprocess
          p=subprocess.run(['gcloud','run','services','list','--project','nivon-data',
               '--region','southamerica-east1','--format=json'],text=True,capture_output=True,timeout=45)
          if p.returncode!=0:
              print('CLOUD_RUN_READ_ONLY_STATUS=NO_LIST_PERMISSION_OR_SERVICE')
          else:
              data=json.loads(p.stdout or '[]')
              selected=[{'name':x.get('metadata',{}).get('name'),
                         'url_available':bool(x.get('status',{}).get('url'))}
                        for x in data if 'nivon' in x.get('metadata',{}).get('name','').lower()]
              print('NIVON_CLOUD_RUN_EXISTING_SERVICES='+json.dumps(selected,ensure_ascii=False))
          PY
      - name: Diagnosticar gates de publicacao e recursos sem alteracoes
        env:
          NIVON_GO_LIVE_DEPLOY_APPROVED: ${{ vars.NIVON_GO_LIVE_DEPLOY_APPROVED }}
          NIVON_GCP_COST_REVIEWED: ${{ vars.NIVON_GCP_COST_REVIEWED }}
          NIVON_TERMINAL_ARTIFACT_REPO: ${{ vars.NIVON_TERMINAL_ARTIFACT_REPO }}
          NIVON_TERMINAL_EXECUTION_SA: ${{ vars.NIVON_TERMINAL_EXECUTION_SA }}
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          def flag(name):
              return 'APROVADO' if os.getenv(name)=='true' else 'PENDENTE'
          def exists_var(name):
              return 'CONFIGURADA' if os.getenv(name) else 'AUSENTE'
          region='southamerica-east1'
          project='nivon-data'
          repo=os.getenv('NIVON_TERMINAL_ARTIFACT_REPO','')
          sa=os.getenv('NIVON_TERMINAL_EXECUTION_SA','')
          def describe(cmd, ok_to_run):
              if not ok_to_run: return 'DEPENDENCIA_AUSENTE'
              try:
                  p=subprocess.run(cmd,check=False,capture_output=True,text=True,timeout=28)
              except (OSError,subprocess.TimeoutExpired):
                  return 'VERIFICACAO_INDISPONIVEL'
              if p.returncode==0:return 'EXISTENTE'
              msg=p.stderr.lower()
              if 'permission_denied' in msg or 'permission denied' in msg or '403' in msg:
                  return 'SEM_PERMISSAO_DE_CONSULTA'
              if 'not found' in msg or 'not_found' in msg or '404' in msg:
                  return 'NAO_ENCONTRADO'
              return 'NAO_COMPROVADO'
          reg_ok=bool(re.fullmatch(r'[a-z][a-z0-9-]{1,62}',repo))
          sa_ok=bool(re.fullmatch(r'[a-z][a-z0-9-]{4,28}[a-z0-9]@nivon-data\.iam\.gserviceaccount\.com',sa))
          results={
              'aprovar_deploy':flag('NIVON_GO_LIVE_DEPLOY_APPROVED'),
              'revisao_custos':flag('NIVON_GCP_COST_REVIEWED'),
              'repositorio_docker_config':exists_var('NIVON_TERMINAL_ARTIFACT_REPO'),
              'conta_runtime_config':exists_var('NIVON_TERMINAL_EXECUTION_SA'),
              'repositorio_docker':describe(['gcloud','artifacts','repositories','describe',repo,
                   '--project='+project,'--location='+region,'--format=value(name)'],reg_ok),
              'conta_runtime':describe(['gcloud','iam','service-accounts','describe',sa,
                   '--project='+project,'--format=value(email)'],sa_ok),
              'servico_cloud_run':describe(['gcloud','run','services','describe','nivon-terminal',
                   '--project='+project,'--region='+region,'--format=value(status.url)'],True),
          }
          # "Nao encontrado" para o serviço é compatível com primeiro deploy.
          ok=(results['aprovar_deploy']=='APROVADO' and
              results['revisao_custos']=='APROVADO' and
              results['repositorio_docker']=='EXISTENTE' and
              results['conta_runtime']=='EXISTENTE')
          results['liberacao_para_dispatch_manual']='PRONTO_PRELIMINAR' if ok else 'GATES_PENDENTES'
          results['deploy_realizado_nesta_execucao']=False
          results['conta_de_faturamento_verificada']=False
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
              f.write('\n### NIVON: checklist único para ativar o terminal privado\n\n')
              f.write('| Gate | Resultado |\n|---|---|\n')
              for k,v in results.items():f.write(f'| {k} | {v} |\n')
              f.write('\n**Esta é uma leitura de configuração, não autorização de custos nem go-live.**\n')
          print('NIVON_GO_LIVE_PREFLIGHT='+json.dumps(results,ensure_ascii=False))
          PY

      - name: Registrar evidencias sem anunciar go-live inexistente
        if: ${{ always() }}
        run: |
          echo '### NIVON — Gate privado BigQuery' >> "$GITHUB_STEP_SUMMARY"
          echo 'Teste integrado, BigQuery read-only limitado a 250 MB, sem IAM alterado.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A execução **não constitui deploy de produção**. Acesso privado e custos devem ser homologados antes de publicar.' >> "$GITHUB_STEP_SUMMARY"
