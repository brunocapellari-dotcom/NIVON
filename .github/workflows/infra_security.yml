# Inspeção real de imagem de homologação, sem autorizar deploy.
# Action pinned por commit e scanner versionado; não usar tags móveis/latest.
# A cadeia Trivy sofreu comprometimento de supply-chain em março/2026:
# política explícita de SHA e sem segredos de produção nos runners.
name: NIVON security image SBOM

on:
  pull_request:
    paths:
      - '.github/workflows/infra_security.yml'
      - 'infra/docker/Dockerfile.worker'
      - '.dockerignore'
      - 'src/nivon/infra_security_scan.py'
      - 'tests/test_infra_security_scan.py'
      - 'src/nivon/infra_worker.py'
      - 'infra/inventory.v1.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sem persistir credenciais
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Contratos fail-closed antes de executar scanner
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_infra_security_scan.py -v
      - name: Criar imagem local sem push e sem login de registry
        run: docker build -f infra/docker/Dockerfile.worker -t nivon-worker-ci:offline .
      - name: Trivy vuln na imagem local (relatório, sem autorização de release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 immutable SHA
        with:
          scan-type: image
          image-ref: nivon-worker-ci:offline
          scanners: vuln
          format: json
          output: /tmp/nivon-trivy-vuln.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          version: v0.76.0
          cache: 'false'
      - name: Trivy CycloneDX SBOM sem publicar artefatos
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 immutable SHA
        with:
          scan-type: image
          image-ref: nivon-worker-ci:offline
          format: cyclonedx
          output: /tmp/nivon-trivy-sbom.json
          exit-code: '0'
          version: v0.76.0
          cache: 'false'
      - name: Revisar resultados e manter produção bloqueada
        env:
          PYTHONPATH: src
        run: |
          python -m nivon.infra_security_scan \
            --vulnerabilities /tmp/nivon-trivy-vuln.json \
            --sbom /tmp/nivon-trivy-sbom.json
          # Nunca mudar gates de infra neste pipeline; scan limpo != go-live.
          python -m nivon.infra_preflight
