name: NIVON - Teste E2E BCB SGS11 sem Google Cloud

on:
  pull_request:
    paths:
      - 'src/nivon/sgs11_gcp.py'
      - 'tests/test_sgs11_gcp.py'
      - '.github/workflows/ci-sgs11-gcp.yml'
  push:
    branches:
      - 'feat/bcb-sgs11-gcp-main-20261023'
    paths:
      - 'src/nivon/sgs11_gcp.py'
      - 'tests/test_sgs11_gcp.py'
      - '.github/workflows/ci-sgs11-gcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-sintetico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout sem token persistente
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configurar Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Instalar NIVON sem dependencias GCP
        run: python -m pip install --disable-pip-version-check -e .
      - name: Executar E2E e bloqueios de rede e Cloud
        run: python -m unittest discover -s tests -p 'test_sgs11_gcp.py' -v
      - name: Confirmar plano inerte
        run: python -m nivon.sgs11_gcp
