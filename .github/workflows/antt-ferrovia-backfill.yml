name: NIVON - Backfill historico ferroviario ANTT
on:
  push:
    branches: [feature/transporte-antt-antaq-20261022]
    paths:
      - '.github/workflows/antt-ferrovia-backfill.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nivon-antt-ferrovia-backfill-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backfill:
    strategy:
      fail-fast: false
      matrix:
        include:
          - inicio: 2006
            fim: 2010
          - inicio: 2011
            fim: 2015
          - inicio: 2016
            fim: 2020
          - inicio: 2021
            fim: 2024
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Coletar e validar serie historica oficial
        env:
          PYTHONPATH: src
        run: |
          python -m nivon.coleta_antt --inicio ${{ matrix.inicio }} --fim ${{ matrix.fim }} --destino "${RUNNER_TEMP}/antt-historico" --live
      - name: Conferir volumes e contar versoes
        if: success()
        env:
          PYTHONPATH: src
        run: |
          python -m nivon.resumo_antt --destino "${RUNNER_TEMP}/antt-historico" --anos $(seq ${{ matrix.inicio }} ${{ matrix.fim }}) > "${RUNNER_TEMP}/antt-resumo.json"
          python - <<'PY'
          import os,json, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"antt-resumo.json"
          j=json.loads(p.read_text())
          print("BACKFILL_ANTT", "registros", j["registros"], "TU", j["toneladas_uteis"], "TKU", j["tku_raw"])
          print("ANOS", json.dumps(j["anos"],ensure_ascii=False))
          PY
      - name: Preservar evidencia de backfill em artefatos por bloco
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: antt-ferrovia-${{ matrix.inicio }}-${{ matrix.fim }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/antt-historico/manifesto-antt.json
            ${{ runner.temp }}/antt-resumo.json
          if-no-files-found: warn
          retention-days: 90
