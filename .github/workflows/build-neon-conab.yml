name: NIVON - build Neon CONAB OIDC
on:
  push:
    paths:
      - 'functions/conab_neon/index.mjs'
      - '.github/workflows/build-neon-conab.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bundle usando versões fixadas
        run: |
          npm install --no-audit --no-fund --no-save pg@8.13.0 jose@6.1.0 esbuild@0.25.0
          mkdir -p functions/conab_neon/dist
          ./node_modules/.bin/esbuild functions/conab_neon/index.mjs \
            --bundle --platform=node --target=node24 --format=esm \
            --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" \
            --outfile=functions/conab_neon/dist/index.mjs
          node --check functions/conab_neon/dist/index.mjs
      - name: Commit bundle revisável
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f functions/conab_neon/dist/index.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build(conab): gerar bundle Neon OIDC [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
