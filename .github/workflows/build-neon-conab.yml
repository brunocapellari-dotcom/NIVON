name: NIVON - build Neon CONAB OIDC
on:
  push:
    paths:
      - 'functions/conab_neon/index.mjs'
      - '.github/workflows/build-neon-conab.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bundle usando versões fixadas
        run: |
          npm install --no-audit --no-fund --no-save pg@8.13.0 jose@6.1.0 esbuild@0.25.0
          mkdir -p functions/conab_neon/dist
          ./node_modules/.bin/esbuild functions/conab_neon/index.mjs \
            --bundle --platform=node --target=node24 --format=esm \
            --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);" \
            --outfile=functions/conab_neon/dist/index.mjs
          node --check functions/conab_neon/dist/index.mjs
      - name: Recusar acesso nao autenticado nos dois endpoints
        run: |
          node --input-type=module - <<'NODE'
          import functionCode from './functions/conab_neon/dist/index.mjs'
          const endpoints=['/ingest','/ingest-balanco']
          for(const path of endpoints){
            const result=await functionCode.fetch(new Request('https://test.local'+path,{method:'POST',body:'{}'}))
            if(result.status!==401)throw new Error(path+': expected 401, got '+result.status)
          }
          const health=await functionCode.fetch(new Request('https://test.local/health'))
          if(health.status!==200)throw new Error('health endpoint failed')
          console.log('GitHub OIDC required for CONAB safra and balanco endpoints')
          NODE
      - name: Commit bundle revisável
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f functions/conab_neon/dist/index.mjs
          if ! git diff --cached --quiet; then
            git commit -m "build(conab): gerar bundle Neon OIDC [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
