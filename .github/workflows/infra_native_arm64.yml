# Homologação experimental em ARM64 nativo GitHub-hosted. Não é OCI ou produção.
# Repo público: runners padrão gratuitos no GitHub; se privado, job não inicia.
name: NIVON native ARM64 offline validation

on:
  pull_request:
    paths:
      - '.github/workflows/infra_native_arm64.yml'
      - '.dockerignore'
      - 'infra/docker/Dockerfile.worker'
      - 'infra/docker/Dockerfile.worker-trim'
      - 'infra/inventory.v1.json'
      - 'src/nivon/infra_worker.py'
      - 'src/nivon/infra_trim_compare.py'
      - 'src/nivon/infra_smoke.py'
      - 'src/nivon/infra_job_ledger.py'
      - 'tests/test_infra_native_arm64.py'
      - 'tests/test_infra_trim_compare.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivon-native-arm64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-arm64-worker:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 19
    steps:
      - name: Checkout sem token persistido
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verificar arquitetura ARM64 NATIVA do runner e engine Docker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import platform
          import subprocess
          machine=platform.machine().lower()
          if machine not in ("aarch64", "arm64"):
              raise SystemExit("Runner não é ARM64 nativo: " + machine)
          engine=subprocess.check_output(["docker","info","--format","{{.Architecture}}"],
                                         text=True).strip().lower()
          if engine not in ("aarch64", "arm64"):
              raise SystemExit("Docker Engine não é ARM64 nativo: " + engine)
          print("NIVON_NATIVE_ARM64_RUNNER_AND_DOCKER_OK")
          PY
      - name: Testes de contrato do workflow ARM64 e comparador
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p test_infra_native_arm64.py -v
          python -m unittest discover -s tests -p test_infra_trim_compare.py -v
      - name: Instalar Trivy ARM64 oficial e validar checksum imutável
        shell: bash
        env:
          TRIVY_ARM64_SHA256: aab21e677a7b7071fc79f1711480840754c18a1b9d9cefa7ccd06af63a0e8f4c
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/nivon-arm64-tool"
          archive="$RUNNER_TEMP/trivy_0.76.0_Linux-ARM64.tar.gz"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 180 \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-ARM64.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$TRIVY_ARM64_SHA256" "$archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP/nivon-arm64-tool" trivy
          chmod 0700 "$RUNNER_TEMP/nivon-arm64-tool/trivy"
          printf '%s\n' "$RUNNER_TEMP/nivon-arm64-tool" >> "$GITHUB_PATH"
      - name: Construir duas imagens nativas sem rede durante a build
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 \
            python:3.11-slim-trixie@sha256:cce12316475d7d56d605f76e1d811d0dc4e7227f2d4afd29951521264f504ff8
          docker build --network=none --platform linux/arm64 \
            -f infra/docker/Dockerfile.worker -t nivon-worker-trim:baseline .
          docker build --network=none --platform linux/arm64 \
            -f infra/docker/Dockerfile.worker-trim -t nivon-worker-trim:candidate .
          for tag in baseline candidate; do
            arch="$(docker image inspect "nivon-worker-trim:$tag" --format '{{.Architecture}}')"
            test "$arch" = "arm64" || { echo "::error::Imagem não ARM64"; exit 1; }
          done
      - name: Worker nativo sem rede/privilegios, packaging ausente e persistencia idempotente
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --user 65532:65532 --pids-limit 64 --memory 256m --cpus 0.5 \
            nivon-worker-trim:candidate --mode self-check
          docker run --rm --platform linux/arm64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --user 65532:65532 --entrypoint python nivon-worker-trim:candidate \
            -c 'import platform; from importlib import metadata; assert platform.machine().lower() in ("aarch64", "arm64"); banned={"pip","setuptools","wheel","jaraco.context"}; found={d.metadata.get("Name","").lower() for d in metadata.distributions()} & banned; assert not found, "packaging presente"; print("NATIVE_ARM64_RUNTIME_AND_TRIM_OK")'
          state="$(mktemp -d)"
          trap 'sudo rm -rf "$state"' EXIT
          sudo chown 65532:65532 "$state"
          sudo chmod 0700 "$state"
          for i in 1 2; do
            docker run --rm --platform linux/arm64 --network none --read-only \
              --cap-drop ALL --security-opt no-new-privileges:true \
              --user 65532:65532 --pids-limit 64 --memory 256m --cpus 0.5 \
              --tmpfs /tmp:rw,noexec,nosuid,size=16m \
              -e NIVON_OFFLINE_STATE_DIR=/var/lib/nivon/state \
              --mount "type=bind,source=$state,target=/var/lib/nivon/state" \
              nivon-worker-trim:candidate --mode synthetic-once \
              --instante 2026-10-20T16:30:00-03:00
          done
          sudo test -s "$state/jobs.sqlite"
      - name: Escanear imagens ARM64 nativas com mesmo banco Trivy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trivy image --quiet --scanners vuln --format json \
            --output "$RUNNER_TEMP/nivon-arm64-base.json" nivon-worker-trim:baseline
          trivy image --quiet --scanners vuln --format json \
            --output "$RUNNER_TEMP/nivon-arm64-trim.json" nivon-worker-trim:candidate
          trivy image --quiet --format cyclonedx \
            --output "$RUNNER_TEMP/nivon-arm64-sbom.json" nivon-worker-trim:candidate
      - name: Validar SBOM e comparar CVEs sem qualquer liberacao de producao
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"nivon-arm64-sbom.json"
          bom=json.loads(path.read_text(encoding="utf-8"))
          assert bom.get("bomFormat")=="CycloneDX"
          assert isinstance(bom.get("components"),list) and bom["components"]
          print("NIVON_ARM64_SBOM_COMPONENTS",len(bom["components"]))
          PY
          python -m nivon.infra_trim_compare \
            --baseline "$RUNNER_TEMP/nivon-arm64-base.json" \
            --candidate "$RUNNER_TEMP/nivon-arm64-trim.json"
          echo "Experimento ARM64: SEM AUTORIZACAO DE RELEASE"
