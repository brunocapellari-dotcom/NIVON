name: NIVON - Recuperar lote BigQuery a partir de GCS

on:
  workflow_dispatch:
    inputs:
      manifesto_sha:
        description: 'SHA-256 do manifesto previamente arquivado em nivon/lotes/v1'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: nivon-gcp-recuperacao-controlada
  cancel-in-progress: false

jobs:
  recuperar:
    if: ${{ github.ref == 'refs/heads/main' && vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_RAW_ARCHIVE_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nivon-gcp-producao
    env:
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_RAW_ARCHIVE_APPROVED: ${{ vars.NIVON_RAW_ARCHIVE_APPROVED }}
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_MANIFESTO_SHA: ${{ inputs.manifesto_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Confirmar identificador SHA antes de autenticar
        shell: bash
        run: |
          [[ "$NIVON_MANIFESTO_SHA" =~ ^[a-f0-9]{64}$ ]] || {
            echo 'Identificador de manifesto invalido' >&2
            exit 2
          }
      - name: Autenticar com WIF sem service account JSON
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
      - name: Instalar dependencias
        run: python -m pip install -e '.[gcp]'
      - name: Validar recursos existentes
        run: |
          python -m nivon.preflight_gcp_fontes --projeto "$NIVON_BQ_PROJECT" --dataset "$NIVON_BQ_DATASET" --bucket "$NIVON_GCS_BUCKET"
      - name: Recuperar somente o MERGE do recibo validado
        run: |
          python scripts/lote_cloud_recuperavel.py --fase replay --manifesto-sha "$NIVON_MANIFESTO_SHA" --projeto "$NIVON_BQ_PROJECT" --dataset "$NIVON_BQ_DATASET" --bucket "$NIVON_GCS_BUCKET" --executar
