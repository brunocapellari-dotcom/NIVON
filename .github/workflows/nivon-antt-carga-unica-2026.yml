name: NIVON - Primeira Carga Unica ANTT 2026
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nivon-antt-carga-unica-2026.yml'
  pull_request:
    paths:
      - '.github/workflows/nivon-antt-carga-unica-2026.yml'
      - 'src/nivon/antt_gcp_piloto_2026.py'
      - 'tests/test_antt_gcp_piloto_2026.py'
  workflow_dispatch:
    inputs:
      confirmar_piloto_2026:
        description: 'Confirmo uma única carga controlada ANTT/SIADE ano 2026'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nivon-carga-piloto-antt-2026
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testar modelo e bloqueios de escrita
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_antt_gcp_piloto_2026.py' -v
          python -m unittest discover -s tests -p 'test_antt_bigquery.py' -v
          python -m unittest discover -s tests -p 'test_antt_gcs.py' -v

  executar-lote-unico:
    needs: testar
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmar_piloto_2026 == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Confirmar recursos fixos e projeto sem redirecionamentos
        run: |
          set -eu
          test "$NIVON_PROJETO" = 'nivon-data'
          test "$NIVON_DATASET" = 'nivon_raw'
          test "$NIVON_BUCKET" = 'nivon-data-raw-2026'
      - name: Credencial OIDC efemera sem chave JSON permanente
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Bibliotecas Google Cloud
        run: |
          python -m pip install --disable-pip-version-check --quiet 'google-cloud-bigquery>=3,<4' 'google-cloud-storage>=3,<4'
      - name: Coletar arquivo oficial SIADE somente 2026
        run: |
          python -m nivon.coleta_antt --inicio 2026 --fim 2026 \
            --destino "$RUNNER_TEMP/antt-stage" --live --usar-url-verificada-contingencia
      - name: Executar unica carga de ate 2MB/10000 registros e reconciliar
        run: |
          python -m nivon.antt_gcp_piloto_2026 \
            --staging "$RUNNER_TEMP/antt-stage" \
            --projeto "$NIVON_PROJETO" \
            --dataset "$NIVON_DATASET" \
            --bucket "$NIVON_BUCKET" \
            --saida "$RUNNER_TEMP/antt-piloto-2026-resultado.json" \
            --live --confirmar-piloto-2026
      - name: Registrar provas sem dados privados ou CSV bruto
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'antt-piloto-2026-resultado.json'
          x=json.loads(p.read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('### ANTT/SIADE — primeira carga GCS e BigQuery 2026\n\n')
              f.write('| Indicador | Valor |\n|---|---|\n')
              for k in ('estado','projeto','dataset','bucket','ano','competencia_maxima','sha256',
                        'bytes_fonte','linhas_confirmadas','toneladas_uteis_confirmadas',
                        'gcs_estado','bigquery_estado','bigquery_tabela','bigquery_view_atual',
                        'carga_continua_ativada'):
                  f.write(f'| {k} | {x[k]} |\n')
              f.write('\n**Somente 2026. Nenhuma ativação de agendamento contínuo.**\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: nivon-antt-primeira-carga-2026-${{ github.run_id }}
          path: ${{ runner.temp }}/antt-piloto-2026-resultado.json
          retention-days: 90
      - name: Limpeza dos brutos temporarios e relatorio
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/antt-stage" "$RUNNER_TEMP/antt-piloto-2026-resultado.json"
