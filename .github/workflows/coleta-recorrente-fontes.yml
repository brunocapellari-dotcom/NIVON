name: NIVON - Coleta recorrente de fontes publicas
on:
  schedule:
    - cron: '20 11 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: nivon-coleta-fontes-reais
  cancel-in-progress: false
jobs:
  coletar:
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar coletor
        run: python -m pip install -e .
      - name: Coletar BCRA/granos diariamente e Canada/CCEE semanalmente
        run: |
          if [ "$(date -u +%u)" = '1' ]; then
            python scripts/operar_fontes_reais.py --canada --ccee
          else
            python scripts/operar_fontes_reais.py
          fi
      - name: Registrar modo sem nuvem
        if: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED != 'true' || vars.NIVON_GCP_PROVIDER == '' || vars.NIVON_GCP_SERVICE_ACCOUNT == '' || vars.NIVON_BQ_PROJECT == '' || vars.NIVON_BQ_DATASET == '' }}
        run: echo 'COLETA TEMPORARIA. BIGQUERY NAO CONFIGURADO; HISTORICO NAO PERSISTENTE.'
      - name: Credenciais efemeras GCP via OIDC
        if: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
      - name: Instalar extra BigQuery
        if: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' }}
        run: python -m pip install -e '.[gcp]'
      - name: Carregar JSONL no BigQuery com MERGE idempotente
        if: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' }}
        run: python -m nivon.carga_bigquery_fontes --arquivo data/nivon/staging_fontes_reais.jsonl --projeto "${{ vars.NIVON_BQ_PROJECT }}" --dataset "${{ vars.NIVON_BQ_DATASET }}" --executar
