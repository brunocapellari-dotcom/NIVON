name: NIVON - Auditoria GCP somente leitura
on:
  pull_request:
    paths:
      - 'src/nivon/auditoria_gcp_readonly.py'
      - 'tests/test_auditoria_gcp_readonly.py'
      - 'tests/test_auditoria_gcp_workflow_policy.py'
      - '.github/workflows/auditoria-gcp-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'src/nivon/auditoria_gcp_readonly.py'
      - '.github/workflows/auditoria-gcp-readonly.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'
permissions:
  contents: read
concurrency:
  group: nivon-auditoria-gcp-readonly
  cancel-in-progress: false
jobs:
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_auditoria_gcp_readonly.py' -v
      - run: python -m unittest discover -s tests -p 'test_auditoria_gcp_workflow_policy.py' -v
  metadados-reais:
    needs: contrato
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_BQ_PROJECT != '' && vars.NIVON_BQ_DATASET != '' && vars.NIVON_GCS_BUCKET != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - run: python -m pip install -e '.[gcp]'
      - name: Conferir recursos Google Cloud sem gravar dados
        env:
          NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
          NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
          NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          python -m nivon.auditoria_gcp_readonly --projeto "$NIVON_BQ_PROJECT" --dataset "$NIVON_BQ_DATASET" --bucket "$NIVON_GCS_BUCKET" --executar > "$RUNNER_TEMP/nivon-auditoria-gcp.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          resultado=json.loads((Path(os.environ['RUNNER_TEMP'])/'nivon-auditoria-gcp.json').read_text(encoding='utf-8'))
          tabelas=resultado.get('tabelas',[])
          validas=all(t.get('existe') is True and t.get('schema_conforme') is True and t.get('particao_conforme') is True for t in tabelas)
          if not resultado.get('regiao_conforme'):
              raise SystemExit('REGIAO_GCP_DIVERGENTE')
          if not validas:
              print('::warning::NIVON_TABELAS_AGRICOLAS_PENDENTES_OU_DIVERGENTES')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as saida:
              saida.write('### NIVON — auditoria BigQuery/GCS somente leitura\n\n')
              saida.write('Região: São Paulo. Nenhum SQL, upload, custo de consulta ou alteração de recursos.\n\n')
              saida.write('| Tabela | Existe | Contrato | Partição |\n|---|---|---|---|\n')
              for t in tabelas:
                  saida.write(f"| {t['tabela']} | {t['existe']} | {t['schema_conforme']} | {t['particao_conforme']} |\n")
              saida.write('\n**Isto não comprova permissão de escrita, carga nem atualização de dados.**\n')
          print('NIVON_GCP_DESTINOS='+('ESQUEMAS_EXISTENTES' if validas else 'PENDENTES'))
          PY
