name: "NIVON - Renovar snapshot privado do portal no Google Cloud"
on:
  workflow_dispatch:
    inputs:
      executar:
        description: "Confirmo leitura limitada BigQuery e escrita em GCS privado"
        type: boolean
        required: true
        default: false
  schedule:
    - cron: '40 11 * * 1-5'
permissions:
  contents: read
concurrency:
  group: nivon-portal-snapshot-privado
  cancel-in-progress: false
jobs:
  atualizar:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.NIVON_PORTAL_GCP_READ_APPROVED == 'true' &&
      vars.NIVON_PORTAL_GCS_WRITE_APPROVED == 'true' &&
      vars.NIVON_PORTAL_PRIVATE_BUCKET_REVIEWED == 'true' &&
      vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' &&
      vars.NIVON_RAW_ARCHIVE_APPROVED == 'true' &&
      vars.NIVON_GCP_PROVIDER != '' &&
      vars.NIVON_GCP_SERVICE_ACCOUNT != '' &&
      vars.NIVON_BQ_PROJECT == 'nivon-data' &&
      vars.NIVON_BQ_DATASET == 'nivon_raw' &&
      vars.NIVON_GCS_BUCKET == 'nivon-data-raw-2026' &&
      ((github.event_name == 'workflow_dispatch' && inputs.executar == true) ||
       (github.event_name == 'schedule' && vars.NIVON_PORTAL_E2E_VERIFIED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nivon-gcp-producao
    permissions:
      contents: read
      id-token: write
    env:
      NIVON_PORTAL_GCP_READ_APPROVED: ${{ vars.NIVON_PORTAL_GCP_READ_APPROVED }}
      NIVON_PORTAL_GCS_WRITE_APPROVED: ${{ vars.NIVON_PORTAL_GCS_WRITE_APPROVED }}
      NIVON_PORTAL_PRIVATE_BUCKET_REVIEWED: ${{ vars.NIVON_PORTAL_PRIVATE_BUCKET_REVIEWED }}
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_RAW_ARCHIVE_APPROVED: ${{ vars.NIVON_RAW_ARCHIVE_APPROVED }}
      NIVON_BQ_PROJECT: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_BQ_DATASET: ${{ vars.NIVON_BQ_DATASET }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
      NIVON_PORTAL_FERROVIA_COMPETENCIA: ${{ vars.NIVON_PORTAL_FERROVIA_COMPETENCIA || '2026-08' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Autenticar por WIF sem chaves persistentes
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar SDK de consultas limitado
        run: python -m pip install --disable-pip-version-check -e '.[gcp]'
      - name: Ler BQ, validar evidencias e renovar objeto privado com SHA
        run: python scripts/atualizar_snapshot_portal_gcp.py
      - name: Registrar contrato somente interno
        run: |
          echo 'NIVON: snapshot de revisao privada atualizado com integridade verificada.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Nao foi implantado servidor, liberado IAM publico ou publicado preco.' >> "$GITHUB_STEP_SUMMARY"
