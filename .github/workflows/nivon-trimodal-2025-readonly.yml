name: NIVON - Comparacao Trimodal 2025 somente leitura
on:
  pull_request:
    paths:
      - '.github/workflows/nivon-trimodal-2025-readonly.yml'
      - 'src/nivon/painel_trimodal_2025.py'
      - 'tests/test_painel_trimodal_2025.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/nivon-trimodal-2025-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nivon-trimodal-readonly-2025
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Testar sem acesso a BigQuery ou HuggingFace
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_painel_trimodal_2025.py' -v

  obter-relatorio-real:
    needs: testar
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
      NIVON_PROJETO: ${{ vars.NIVON_BQ_PROJECT }}
      NIVON_DATASET: ${{ vars.NIVON_BQ_DATASET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Conferir configuracao sem habilitar escrita
        run: |
          test "$NIVON_PROJETO" = 'nivon-data'
          test "$NIVON_DATASET" = 'nivon_raw'
      - name: Gerar credencial somente leitura via GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - name: Instalar leitor local, cliente HF e BigQuery
        run: |
          python -m pip install --disable-pip-version-check --quiet 'duckdb>=1.2,<2' 'huggingface_hub>=0.30,<2' 'google-cloud-bigquery>=3,<4'
      - name: Obter tres universos reais sem gravar BigQuery
        run: |
          python -m nivon.painel_trimodal_2025 \
            --saida "$RUNNER_TEMP/nivon-trimodal-2025.json"
      - name: Salvar resumo metodologicamente separado
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"nivon-trimodal-2025.json").read_text(encoding="utf8"))
          assert j["estado"]=="PAINEL_TRIMODAL_2025_SEM_SOMA_ENTRE_MODALIDADES"
          assert j["hidrovia_grupos"]==27
          assert all(v is False for v in j["gates"].values())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf8") as f:
              f.write("### NIVON: comparação de 3 fontes (2025, leitura real)\n\n")
              f.write(f"**{len(j['polos_rodovia_e_ferrovia'])} polos** da ANTT e **{j['hidrovia_grupos']} recortes de trechos hidroviários de terceiro**.\n\n")
              f.write("Fonte | Natureza | Situação\n---|---|---\n")
              f.write("Ferrovia ANTT | Estações de origem e mercadorias | Observado\n")
              f.write("Rodovia ANTT | Apenas top16 RGI anual sem mercadorias | Observado no recorte\n")
              f.write("Hidrovia HF | Terceiro, recortes por rio/produto | Não homologado\n\n")
              f.write("| Hidrovia | Sentido | Produto | Toneladas de trechos, não aditivas |\n|---|---|---|---:|\n")
              for x in j["hidrovia_recortes"][:27]:
                  f.write(f"| {x['hidrovia']} | {x['sentido']} | {x['produto']} | {x['toneladas_trechos']} |\n")
              f.write("\n**Sem soma multimodal, sem transbordos confirmados e sem escrita Cloud.**\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: nivon-trimodal-2025-prova-${{ github.run_id }}
          path: ${{ runner.temp }}/nivon-trimodal-2025.json
          retention-days: 90
      - name: Limpar relatorio local temporario
        if: always()
        run: rm -f "$RUNNER_TEMP/nivon-trimodal-2025.json"
