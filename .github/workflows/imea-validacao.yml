name: NIVON - IMEA validacao de indicadores
on:
  push:
    paths:
      - 'nivon/imea_publico.py'
      - 'tests/test_imea_publico.py'
      - '.github/workflows/imea-validacao.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_imea_publico.py' -v
  consulta-publica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check agrobr==2.0.0
      - name: Consulta pontual IMEA de soja, sem gravacao
        run: |
          python - <<'PY'
          import asyncio,json
          from agrobr import imea
          from nivon.imea_publico import normalize
          async def main():
              df,meta=await imea.cotacoes('soja',return_meta=True)
              if str(getattr(meta,'source','')).lower()!='imea':
                  raise SystemExit('IMEA_FONTE_PRIMARIA_INVALIDA')
              rows=df.to_dict(orient='records')
              usable=[];rejected={}
              for row in rows:
                  try: usable.append(normalize(row))
                  except (ValueError,TypeError) as e:
                      k=str(e)[:60];rejected[k]=rejected.get(k,0)+1
              latest=max((r['published_at'][:10] for r in usable),default=None)
              print('NIVON_IMEA_DIAGNOSTICO='+json.dumps({
                'source':'imea','received':len(rows),
                'candidate_rows':len(usable),'latest_publication':latest,
                'rejected':rejected,'source_url':str(getattr(meta,'source_url',''))[:160],
                'persisted':False,'reference_dates_available':0
              },ensure_ascii=False))
              if not usable: raise SystemExit('IMEA_NENHUMA_OBSERVACAO_HOMOLOGADA')
          asyncio.run(main())
          PY
