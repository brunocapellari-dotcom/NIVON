name: NIVON - IMEA validacao de indicadores
on:
  push:
    paths:
      - 'nivon/imea_publico.py'
      - 'tests/test_imea_publico.py'
      - 'nivon/imea_lotes.py'
      - 'tests/test_imea_lotes.py'
      - '.github/workflows/imea-validacao.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_imea_publico.py' -v
          python -m unittest discover -s tests -p 'test_imea_lotes.py' -v
  consulta-publica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check agrobr==2.0.0
      - name: Consulta pontual IMEA de soja e milho, sem gravacao
        run: |
          python - <<'PY'
          import asyncio,json
          from agrobr import imea
          from nivon.imea_lotes import prepare
          async def main():
              for chain,source_id in (('soja','4'),('milho','3')):
                  df,meta=await imea.cotacoes(chain,return_meta=True)
                  url=str(getattr(meta,'source_url',''))
                  if str(getattr(meta,'source','')).lower()!='imea' or (
                      not url.startswith('https://api1.imea.com.br/api/v2/mobile/cadeias/'+source_id+'/cotacoes')):
                      raise SystemExit('IMEA_FONTE_PRIMARIA_INVALIDA_'+chain)
                  rows=df.to_dict(orient='records')
                  pacote=prepare(rows,meta,chain,batch_size=80)
                  print('NIVON_IMEA_DIAGNOSTICO='+json.dumps({
                    'source':'imea','chain':chain,'received':pacote['received'],
                    'candidate_rows':pacote['validated'],'latest_publication':pacote['last_publication'],
                    'discarded':pacote['discarded'],'quarantine_by_reason':pacote['discard_reasons'],
                    'batches':len(pacote['batches']),
                    'source_url':pacote['source_url'],
                    'persisted':False,'reference_dates_available':0
                  },ensure_ascii=False))
                  if pacote['validated']<1:
                      raise SystemExit('IMEA_NENHUMA_OBSERVACAO_HOMOLOGADA_'+chain)
          asyncio.run(main())
          PY
