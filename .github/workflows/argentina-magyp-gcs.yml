name: Argentina MAGyP - coleta e prova GCS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nivon-argentina-magyp-gcs
  cancel-in-progress: false
jobs:
  coletar:
    if: ${{ github.ref == 'refs/heads/main' && vars.NIVON_RAW_ARCHIVE_APPROVED == 'true' && vars.NIVON_ZERO_COST_BQ_APPROVED == 'true' && vars.NIVON_GCP_PROVIDER != '' && vars.NIVON_GCP_SERVICE_ACCOUNT != '' && vars.NIVON_GCS_BUCKET != '' && vars.NIVON_BQ_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: nivon-gcp-producao
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: src
      NIVON_RAW_ARCHIVE_APPROVED: ${{ vars.NIVON_RAW_ARCHIVE_APPROVED }}
      NIVON_ZERO_COST_BQ_APPROVED: ${{ vars.NIVON_ZERO_COST_BQ_APPROVED }}
      NIVON_GCS_BUCKET: ${{ vars.NIVON_GCS_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.NIVON_GCP_PROVIDER }}
          service_account: ${{ vars.NIVON_GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NIVON_BQ_PROJECT }}
          create_credentials_file: true
      - run: python -m pip install -e '.[gcp]'
      - name: Coletar, arquivar e conferir bytes no GCS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base="$RUNNER_TEMP/argentina-magyp"
          python scripts/coletar_argentina_magyp.py --base "$base" --executar --gcs --bucket "$NIVON_GCS_BUCKET" > "$RUNNER_TEMP/argentina-primeira.json"
          python scripts/coletar_argentina_magyp.py --base "$base" --executar --gcs --bucket "$NIVON_GCS_BUCKET" > "$RUNNER_TEMP/argentina-segunda.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          a = json.loads((root/'argentina-primeira.json').read_text())
          b = json.loads((root/'argentina-segunda.json').read_text())
          if a['manifesto']['sha256'] != b['manifesto']['sha256']:
              raise SystemExit('Fonte revisada entre capturas; repetir teste de idempotencia')
          if b['gcs']['novos'] != 0 or b['readback']['objetos_conferidos'] != 2:
              raise SystemExit('Idempotencia/readback nao comprovados')
          print(json.dumps({'estado':'RAW_GCS_VERIFICADO','registros':b['manifesto']['registros'],
                            'sha256':b['manifesto']['sha256'],'readback':b['readback'],
                            'bigquery_executado':False}))
          PY
