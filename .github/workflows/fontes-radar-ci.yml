name: NIVON - Radar de fontes offline
on:
  pull_request:
    paths:
      - 'src/nivon/fontes_radar.py'
      - 'src/nivon/maritime/maritime_source_health.py'
      - 'tests/test_fontes_radar.py'
      - '.github/workflows/fontes-radar-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Metadados com relogio congelado, sem autenticacao ou rede
        env:
          PYTHONPATH: src
        run: python -B -m unittest discover -s tests -p 'test_fontes_radar.py' -v
