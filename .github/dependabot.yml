version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 3
    labels:
      - "dependencias"
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 3
    labels:
      - "dependencias"
    commit-message:
      prefix: "ci"
