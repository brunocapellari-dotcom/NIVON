steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'infra/google_cloud/Dockerfile.terminal'
      - '-t'
      - '${_IMAGE_URI}'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push','${_IMAGE_URI}']
images:
  - '${_IMAGE_URI}'
options:
  logging: CLOUD_LOGGING_ONLY
