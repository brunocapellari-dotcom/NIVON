# NIVON: somente jobs de auditoria offline (profile explícito).
# Sem rede, portas, volumes privados, deploy, secrets ou agendamentos.
services:
  nivon-preflight:
    profiles: ["audit"]
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.audit
    image: nivon-audit:local
    user: "65532:65532"
    read_only: true
    network_mode: "none"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    command: ["python", "-m", "nivon.infra_preflight"]
