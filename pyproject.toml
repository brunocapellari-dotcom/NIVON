[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nivon"
version = "0.1.0"
description = "Motores determinísticos de inteligência agrícola e logística"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agro = ["agrobr==2.0.0"]
forecast = ["pandas>=2.2,<3", "statsforecast>=2,<3"]
ports = ["pdfplumber>=0.11,<1", "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5"]
excel = ["openpyxl>=3.1,<4"]

analytics = ["duckdb>=1.4,<2", "polars>=1,<2", "pydantic>=2,<3"]
agents = ["pydantic>=2,<3"]
auth = ["google-auth>=2.40,<4", "requests>=2.31,<3"]
gcp = ["google-cloud-bigquery>=3,<4", "google-cloud-storage>=2.18,<4", "google-crc32c>=1.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]
