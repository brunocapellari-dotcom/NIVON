[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nivon"
version = "0.1.0"
description = "Motores determinísticos de inteligência agrícola e logística"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agro = ["agrobr==2.0.0"]
forecast = ["pandas>=2.2,<3", "statsforecast>=2,<3"]
ivo-ml = ["pandas>=2.2,<3", "scikit-learn>=1.4,<2", "mlforecast>=1,<2"]
ivo-online = ["river>=0.22,<1"]
ivo-query = ["duckdb>=1,<2"]
ports = ["pdfplumber>=0.11,<1"]
excel = ["openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]
